<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>More hero verbs</title>
<style>
/* Four more verbs, same language as index.html. Base styles are each verb's last frame; keyframes only under no-preference. */
:root{
  --bg:#faf7f1; --text:#0b4c4c; --muted:#276460; --border:#dfe6e2; --border-strong:#6fbeb2;
  --primary:#007979; --primary-soft:#eef6f3; --primary-tint:#c3f0e6; --white:#fff; --sun:#ffcf8a; --hill:#2f8f86;
  --ease:cubic-bezier(.2,.8,.2,1);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(#c3f0e6,#faf7f1 70%);color:var(--text);font:15px/1.5 var(--f-ui)}
.shell{max-width:1360px;margin:0 auto;padding:24px 16px 64px}
.bar{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.bar h1{margin:0;font-size:22px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:12px;background:var(--primary);color:var(--white);font:650 15px var(--f-ui);border:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,600px));gap:40px 40px;justify-content:center}
.cell{display:grid;gap:10px;align-content:start}
.name{text-align:center;font-weight:700;font-size:18px}
.sheet{background:var(--white);border-radius:22px;padding:16px 20px 24px;display:grid;gap:12px;justify-items:center;box-shadow:0 1px 0 rgba(11,76,76,.06),0 26px 50px -32px rgba(6,43,43,.45)}
.fh{width:60%;height:22px;border-radius:6px;background:var(--border)}
.fh.s{width:40%;height:12px;margin-top:-4px}
.fb{height:46px;padding:0 20px;border-radius:12px;background:var(--primary);color:var(--white);font:650 15px/46px var(--f-ui)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cards i{height:56px;border-radius:14px;background:var(--white);box-shadow:0 0 0 1px var(--border)}
.cards i:nth-child(2){box-shadow:0 0 0 2px var(--primary)}

/* the verb stage: 200px tall everywhere, so the two with quality cards fit */
.vstage{position:relative;width:100%;height:200px}
.verb{position:absolute;inset:0}
.verb::after{content:"";position:absolute;left:30%;right:30%;bottom:22px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(6,43,43,.10),transparent)}
.pg,.ph{position:absolute;left:50%;top:50%;width:70px;height:92px;margin:-52px 0 0 -35px;border-radius:4px;background:var(--white);box-shadow:0 0 0 1px var(--border),0 8px 16px -10px rgba(6,43,43,.4);font-style:normal}
.pg::before{content:"";position:absolute;inset:16px 10px auto;height:30px;background:repeating-linear-gradient(to bottom,var(--border) 0 3px,transparent 3px 8px)}
.pg::after{content:"";position:absolute;left:10px;top:8px;width:22px;height:3px;border-radius:2px;background:var(--primary)}
.ph b{position:absolute;inset:8px 7px 26px;border-radius:2px;background:radial-gradient(circle at 72% 28%,var(--sun) 0 5px,transparent 6px),linear-gradient(155deg,transparent 52%,var(--hill) 52% 74%,var(--primary) 74%),linear-gradient(var(--primary-tint),var(--primary-soft));box-shadow:0 0 0 1px rgba(11,76,76,.06)}
.ghost{position:absolute;left:50%;top:50%;border:2px dashed var(--border-strong);border-radius:8px;opacity:.7}

/* split: last frame = two stacks apart, faint tear line between */
.stk{position:absolute;inset:0;translate:var(--sx) 0}
.stk.l{--sx:-58px}.stk.r{--sx:58px}
.stk .pg:nth-child(1){translate:0 0}
.stk .pg:nth-child(2){translate:0 -5px}
.stk .pg:nth-child(3){translate:0 -10px}
.tear{position:absolute;left:50%;top:50%;height:120px;margin:-66px 0 0 -1px;border-left:2px dashed var(--border-strong);opacity:.8}

/* compress: page settles to .78 inside the dashed outline of its old size */
.v-comp .pg{scale:.78;translate:0 6px;box-shadow:0 0 0 1px var(--border),0 4px 8px -6px rgba(6,43,43,.35)}
.v-comp .ghost{width:92px;height:120px;margin:-68px 0 0 -46px}

/* pdf to image: lines give way to the photo; white print border, slight tilt */
.v-p2i .ph{width:84px;height:106px;margin:-59px 0 0 -42px;rotate:5deg;box-shadow:0 0 0 1px var(--border),0 10px 18px -10px rgba(6,43,43,.45)}
.v-p2i .ph b{inset:8px 8px 28px}
.v-p2i .ph::before{content:"";position:absolute;inset:16px 10px auto;height:30px;background:repeating-linear-gradient(to bottom,var(--border) 0 3px,transparent 3px 8px);opacity:0}

/* compress image: a landscape print settles smaller */
.v-cimg .ph{width:124px;height:90px;margin:-50px 0 0 -62px;scale:.74;translate:0 6px;box-shadow:0 0 0 1px var(--border),0 4px 8px -6px rgba(6,43,43,.35)}
.v-cimg .ph b{inset:6px}
.v-cimg .ghost{width:124px;height:90px;margin:-50px 0 0 -62px;scale:1.28}

@media (prefers-reduced-motion:no-preference){
  @keyframes tearIn{from{opacity:0;scale:1 .3}}
  @keyframes apart{0%,38%{translate:0 0}}
  @keyframes settle{0%{scale:1.28;translate:0 -4px;box-shadow:0 0 0 1px var(--border),0 16px 26px -12px rgba(6,43,43,.45)}35%{scale:1.28;translate:0 -4px}}
  @keyframes cardIn{from{opacity:0}}
  @keyframes lift{0%{translate:0 0;rotate:0deg}30%{translate:0 -16px;rotate:0deg}}
  @keyframes linesOut{0%,35%{opacity:1}}
  @keyframes photoIn{0%,40%{opacity:0}}
  @keyframes pageGrow{0%{width:70px;height:92px;margin:-52px 0 0 -35px}40%{width:70px;height:92px;margin:-52px 0 0 -35px}}
  .play .tear{animation:tearIn .5s ease .1s both}
  .play .stk{animation:apart 1.8s var(--ease) .2s both}
  .play .v-comp .pg{animation:settle 1.7s var(--ease) .2s both}
  .play .v-comp .ghost{animation:cardIn .4s ease both}
  .play .v-p2i .ph{animation:lift 1.8s var(--ease) .2s both,pageGrow 1.8s var(--ease) .2s both}
  .play .v-p2i .ph::before{animation:linesOut 1.8s ease .2s both}
  .play .v-p2i .ph b{animation:photoIn 1.8s ease .2s both}
  .play .v-cimg .ph{animation:settle 1.7s var(--ease) .2s both}
  .play .v-cimg .ghost{animation:cardIn .4s ease both}
}
</style>
<div class="shell">
  <div class="bar"><h1>More hero verbs</h1><button class="btn" id="replay" type="button">Replay all</button></div>
  <div class="grid">
    <div class="cell"><div class="sheet"><div class="vstage"><div class="verb v-split">
      <div class="stk l"><i class="pg"></i><i class="pg"></i><i class="pg"></i></div>
      <div class="stk r"><i class="pg"></i><i class="pg"></i><i class="pg"></i></div>
      <span class="tear"></span></div></div>
      <div class="fh"></div><div class="fh s"></div><div class="fb">Choose files</div></div>
      <div class="name">Split</div></div>

    <div class="cell"><div class="sheet"><div class="vstage"><div class="verb v-comp">
      <span class="ghost"></span><i class="pg"></i></div></div>
      <div class="fh"></div><div class="fh s"></div><div class="fb">Choose files</div></div>
      <div class="cards"><i></i><i></i><i></i></div>
      <div class="name">Compress</div></div>

    <div class="cell"><div class="sheet"><div class="vstage"><div class="verb v-p2i">
      <i class="ph"><b></b></i></div></div>
      <div class="fh"></div><div class="fh s"></div><div class="fb">Choose files</div></div>
      <div class="name">PDF to Image</div></div>

    <div class="cell"><div class="sheet"><div class="vstage"><div class="verb v-cimg">
      <span class="ghost"></span><i class="ph"><b></b></i></div></div>
      <div class="fh"></div><div class="fh s"></div><div class="fb">Choose files</div></div>
      <div class="cards"><i></i><i></i><i></i></div>
      <div class="name">Compress Image</div></div>
  </div>
</div>
<script>
  const cells = document.querySelectorAll('.sheet');
  function replay(){cells.forEach(s=>{s.classList.remove('play');void s.offsetWidth;s.classList.add('play')})}
  document.getElementById('replay').addEventListener('click',replay);
  replay();
</script>
