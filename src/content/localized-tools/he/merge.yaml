steps:
  - title: 'הוסיפו את קבצי ה-PDF והתמונות'
    text: 'בחרו קבצי PDF או תמונות JPEG ו-PNG, או גררו ושחררו כאן את מה שרוצים לאחד.'
  - title: 'סדרו אותם'
    text: 'מיינו לפי שם או תאריך, או גררו כל קובץ למקום הרצוי.'
  - title: 'הורידו'
    text: >-
      סמנו "הוספת מספרי עמודים" אם רוצים בכך, ואז לחצו על הורדה. הקובץ המאוחד
      נבנה על המכשיר שלכם תוך כדי, אז הוא מוכן כשאתם מוכנים.
faq:
  - question: 'האם PDkef באמת חינמי?'
    answer: >-
      כן. PDkef חינמי לגמרי, בלי הגבלות, בלי הרשמה ובלי סימן מים על ה-PDF
      המאוחד.
  - question: 'האם הקבצים שלי מועלים לשרת?'
    answer: >-
      לא. PDkef רץ כולו בדפדפן. קבצי ה-PDF לא נשלחים לשום שרת, הם נשארים
      במכשיר שלכם לאורך כל הדרך.
  - question: 'האם PDkef עובד בנייד?'
    answer: >-
      כן. PDkef עובד ב-Chrome באנדרואיד וב-iOS, וגם בדפדפנים במחשבי Mac
      ו-Windows.
  - question: 'יש הגבלה על גודל הקובץ או מספר העמודים?'
    answer: >-
      PDkef לא מציב שום מגבלה מלאכותית. המגבלה היחידה היא הזיכרון הפנוי
      במכשיר שלכם, כי האיחוד מתבצע מקומית.
  - question: 'אפשר לאחד קבלות סרוקות או דוחות לקובץ PDF אחד?'
    answer: >-
      כן, זה אחד השימושים הנפוצים. הוסיפו כל עמוד סרוק או דוח PDF, סדרו
      אותם, ואחדו לקובץ אחד לדוח הוצאות, לתיק עבודות או לספר.
  - question: 'אפשר להוסיף קבצי PDF מ-Google Drive, Dropbox או iCloud?'
    answer: >-
      כן. הדרך הפשוטה היא בוחר הקבצים של המכשיר עצמו, כך ש-PDkef לא מתחבר
      לשירותים האלה. באנדרואיד לחצו על בחירת קבצים ובחרו Google Drive מהרשימה,
      לצד "הורדות". באייפון או באייפד פתחו את בחירת קבצים ואז עיון, וה-Drive,
      ה-Dropbox או ה-iCloud Drive שלכם יופיעו ברגע שהאפליקציה שלהם מותקנת. במק
      או במחשב Windows התיקייה של אפליקציית Drive, Dropbox או OneDrive לשולחן
      העבודה תופיע בבוחר הקבצים כמו כל תיקייה אחרת. ב-Google Drive במחשב אפשר
      גם ללחוץ קליק ימני על קובץ PDF, לבחור "פתיחה באמצעות" ואז PDkef, והקובץ
      הזה יגיע למכשיר שלכם.
  - question: 'מה קורה לקבצים שלי אם סוגרים את הלשונית באמצע?'
    answer: >-
      שום דבר לא הולך לאיבוד. תוך כדי הוספת קבצים, שינוי סדר, סיבוב או דילוג
      על עמודים, הכלי שומר אוטומטית את קבוצת הקבצים, סדר העמודים, הסיבובים
      והדילוגים באחסון המקומי של הדפדפן, ומשחזר הכול אוטומטית בפעם הבאה
      שתפתחו את הכלי באותו מכשיר. קבוצת קבצים גדולה מאוד אולי לא תיכנס
      לאחסון המקומי של הדפדפן; במקרה כזה הכלי מודיע שהטיוטה לא נשמרה במקום
      להעמיד פנים שכן, והאיחוד עצמו ממשיך לעבוד בכל מקרה. טיוטות שמורות פגות
      תוקף אחרי 28 יום בלי שינוי. במכשיר משותף, נקו את נתוני האתר בסיום; זה
      גם מוחק טיוטות שמורות והעדפות.
  - question: 'אפשר לאחד תמונות עם קבצי PDF?'
    answer: >-
      כן. הוסיפו תמונות JPEG או PNG לצד קבצי ה-PDF, וכל תמונה הופכת לעמוד
      אחד, בגודל התמונה, לפי הסדר שקבעתם. הכול קורה על המכשיר שלכם.
