# use (LOC-01's SERP captures; tools.pdf24.org/he/): "מיזוג PDF" is the
# market term, "איחוד" and "חיבור" the synonyms, "מספרי עמודים", "גררו
# ושחררו", "בחרו קבצים" the UI nouns. The difference is the register: plural
# imperative, plain facts, and the one thing an upload site cannot say -
# the file never leaves the device.
