faq:
  - question: 'האם PDkef באמת חינמי?'
    answer: >-
      כן. PDkef חינמי לחלוטין, בלי הגבלות, בלי הרשמה ובלי סימן מים על קובץ
      ה-PDF המאוחד.
  - question: 'האם הקבצים שלי מועלים לשרת?'
    answer: >-
      לא. PDkef פועל כולו בדפדפן שלכם. קבצי ה-PDF לא נשלחים ברשת בשום שלב -
      הם נשארים במכשיר שלכם כל הזמן.
  - question: 'האם PDkef עובד בנייד?'
    answer: >-
      כן. PDkef עובד בכרום באנדרואיד וב-iOS, וגם בדפדפנים לשולחן העבודה
      במחשבי Mac ו-Windows.
  - question: 'יש הגבלת גודל קובץ או מספר עמודים?'
    answer: >-
      אין הגבלה מלאכותית מטעם PDkef. המגבלה היחידה היא הזיכרון הפנוי במכשיר
      שלכם, מכיוון שהמיזוג מתבצע מקומית.
  - question: 'אפשר לאחד קבלות או דוחות סרוקים לקובץ אחד?'
    answer: >-
      כן, זה אחד השימושים הנפוצים. הוסיפו כל עמוד סרוק או דוח PDF, סדרו
      אותם, ומזגו לקובץ אחד לדוח הוצאות, תיק עבודות או ספר.
