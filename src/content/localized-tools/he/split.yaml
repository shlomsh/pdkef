schemaName: 'PDkef - פיצול PDF'
toolName: 'פיצול PDF'
h1: 'פיצול PDF בחינם: חילוץ עמודים'
subhead: >-
  חלצו טווח עמודים, הוציאו עמודים בודדים, או פצלו קובץ PDF אחד לכמה קבצים
  נפרדים. חינם, קוד פתוח, והקובץ נשאר אצלכם במכשיר.
ariaLabel: 'כלי פיצול PDF'
aboutHeading: 'איך מפצלים קובצי PDF בחינם בדפדפן'
aboutLead: >-
  חיתוך קובץ PDF, הפרדת עמודים או פיצול למסמכים נפרדים, ישירות בדפדפן.
  בלי העלאה ובלי שרת באמצע: הקבצים שלכם לא עוזבים את המכשיר.
freeNoteLead: >-
  חלצו עמודים או פצלו קובץ PDF לקבצים נפרדים כמה פעמים שתרצו, בלי סימן מים
  ובלי הגבלת עמודים. הכול רץ על המכשיר שלכם, אז אין מה להעלות ואין מכסות.
  רוצים להסיר כמה עמודים ולשמור את שאר המסמך המקורי? השתמשו במקום זאת ב<a href="/edit-pdf/">עריכת עמודי PDF</a>: הפיצול מוציא את העמודים שבחרתם
  לקובץ חדש, ועריכת העמודים מוחקת אותם ומשאירה את כל השאר.
steps:
  - title: 'פתחו את ה-PDF'
    text: 'בחרו את קובץ ה-PDF שרוצים לפצל, או גררו ושחררו אותו לכלי.'
  - title: 'בחרו מצב פיצול'
    text: >-
      בחרו "PDF אחד" כדי לשמור את העמודים שבחרתם יחד בקובץ אחד, או "PDF לכל
      עמוד" כדי לקבל כל עמוד בקובץ נפרד.
  - title: 'בחרו עמודים'
    text: >-
      לחצו על תמונות העמודים, או הקלידו מספרי עמודים וטווחים (למשל 1-3, 5,
      8-), או ללחוץ על "בחירת הכול" ועל "ניקוי". אפשר להעמיד כל עמוד ישר
      בעזרת הכפתור "סיבוב עמוד" שלו.
  - title: 'הורידו'
    text: >-
      לחצו על "הורדת PDF אחד", או, אחרי שבחרתם "PDF לכל עמוד", על "הורדת 3
      קבצי PDF" (המספר הוא מספר העמודים שבחרתם). הקבצים מוכנים תוך כדי
      הבחירה, אז הם מוכנים כשאתם מוכנים. אפשר גם ללחוץ על "שיתוף".
faq:
  - question: 'האם כלי פיצול ה-PDF חינמי לגמרי?'
    answer: >-
      כן. כמו כל הכלים ב-PDkef, פיצול PDF חינמי לגמרי, בלי הגבלות, בלי
      הרשמה ובלי סימן מים.
  - question: 'האם קבצי ה-PDF שלי מועלים לשרת?'
    answer: >-
      לא. שום דבר לא מועלה. הכלי רץ על המכשיר שלכם, בדפדפן, והקבצים לא
      עוזבים אותו. אין שרת עיבוד. לשימוש בלי אינטרנט, התקינו את PDkef ותנו
      לנכסים הנדרשים להיטען בזמן שאתם מחוברים.
  - question: 'איך עובדים טווחי עמודים?'
    answer: >-
      אפשר להקליד עמודים מסוימים מופרדים בפסיקים (למשל 1, 3, 5), טווחים
      סגורים (למשל 2-4), או טווחים פתוחים כמו "5-" (מעמוד 5 ועד סוף
      המסמך).
  - question: 'מה ההבדל בין "PDF אחד" ל"PDF לכל עמוד"?'
    answer: >-
      "PDF אחד" שומר את העמודים שבחרתם יחד, לפי הסדר, בקובץ חדש אחד. "PDF
      לכל עמוד" שומר כל עמוד שנבחר כקובץ נפרד, עם הורדה אחת לכל עמוד.
      התצוגה המקדימה מראה מה בחרתם: מסגרת אחת סביב העמודים, או מסגרת סביב
      כל עמוד. אפשר לעבור בין המצבים בכל רגע לפני ההורדה.
  - question: 'יש הגבלה על גודל הקובץ או מספר העמודים?'
    answer: >-
      אין שום מגבלה מלאכותית. הכלי מטפל בכל גודל קובץ ובכל מספר עמודים,
      והמגבלה היחידה היא הזיכרון הפנוי במכשיר שלכם.
  - question: 'אפשר להוציא פרק אחד או קבלה אחת מתוך PDF גדול?'
    answer: >-
      כן. הקלידו את טווח העמודים של הפרק, החשבונית או הקבלה שאתם צריכים,
      והפיצול יחלץ בדיוק את העמודים האלה לקובץ משלהם.
  - question: 'אפשר לכווץ את העמודים שחילצתי?'
    answer: >-
      כן. כשבוחרים "PDF אחד", הכפתור "כיווץ" פותח את העמודים שחולצו בכיווץ PDF
      על המכשיר שלכם, בלי צורך לפתוח שוב שום קובץ.
  - question: 'האם זה כלי לחילוץ עמודים מ-PDF?'
    answer: >-
      כן. פיצול וחילוץ הם אותה פעולה כאן: בוחרים את העמודים הרצויים, ואז
      "PDF לכל עמוד" מוציא כל אחד מהם לקובץ משלו, ו"PDF אחד" מחלץ טווח
      לקובץ PDF חדש אחד. אם רוצים להסיר כמה עמודים ולשמור את שאר המסמך,
      השתמשו בעריכת עמודי PDF.
