faq:
  - question: 'האם PDkef באמת חינמי?'
    answer: >-
      כן. PDkef חינמי לגמרי, בלי הגבלות, בלי הרשמה ובלי סימן מים על התמונות
      שהומרו.
  - question: 'האם PDkef מוסיף סימן מים לתמונות?'
    answer: >-
      לא. ייצוא JPG ו-PNG כאן בלי סימן מים ובלי הורדת רזולוציה בכוח. ההמרה
      רצה על המכשיר שלכם, ולכן אין עלות שרת שצריך להחזיר בעזרת הגבלת האיכות.
  - question: 'האם קבצי ה-PDF שלי מועלים לשרת?'
    answer: >-
      לא. שום דבר לא מועלה. הכלי רץ על המכשיר שלכם, בדפדפן, והקבצים לא
      עוזבים אותו. אין שרת עיבוד. לשימוש בלי אינטרנט, התקינו את PDkef ותנו
      לנכסים הנדרשים להיטען בזמן שאתם מחוברים.
  - question: 'מה ההבדל בין PNG ל-JPG?'
    answer: >-
      PNG שומר על רקע שקוף ואינו מאבד איכות, ולכן הוא מתאים לעמודים עם הרבה
      טקסט או גרפיקה. JPG משתמש ברקע לבן ובקבצים קטנים יותר, ומתאים לצילומים
      ולסריקות.
  - question: 'מה קורה עם PDF שיש בו כמה עמודים?'
    answer: >-
      כברירת מחדל כל עמוד הופך לקובץ תמונה משלו. "הורדת כל התמונות" שומרת
      אותן אחת אחת ולא כקובץ zip, כי בכלי אין ספריית zip, ולכן הדפדפן עשוי
      לבקש רשות להורדת כמה קבצים בפעם הראשונה. אפשר גם לבחור "תמונה אחת לכל
      העמודים", ואז כל העמודים נערמים לתמונה ארוכה אחת.
  - question: 'אפשר להפוך דף עבודה סרוק או מצגת לתמונות?'
    answer: >-
      כן. פתחו את ה-PDF, בחרו JPG או PNG, וכל עמוד, בין אם זה דף עבודה סרוק,
      שקף במצגת או עמוד בחוזה, הופך לקובץ תמונה משלו, מוכן לשיתוף או להטמעה.
  - question: 'אפשר להמיר רק כמה עמודים ולא את כל ה-PDF?'
    answer: >-
      כן. הקלידו בשדה העמודים את מה שצריך, למשל 1-3, 5 או 8- (מעמוד 8 ועד
      הסוף), ורק הם יומרו. זה שימושי כדי להוציא תרשים או תמונה אחת ממסמך סרוק
      ארוך בלי להמיר את כל השאר.
  - question: 'באיזו רזולוציה התמונות יוצאות?'
    answer: >-
      בחרו "רגילה" (כ-72 DPI, הקבצים הקטנים ביותר, מספיקה למסך), "גבוהה"
      (כ-144 DPI, חדה ברוב ההדפסות, וזו ברירת המחדל) או "מקסימלית" (כ-216 DPI,
      הכי טובה להגדלה או להדפסה גדולה). ההגדרה קובעת כמה פיקסלים יש בכל עמוד,
      ולכן רזולוציה גבוהה יותר נותנת תמונה חדה וגדולה יותר.
