  והקובץ שלכם מעובדים מקומית, וטיוטה יכולה להישמר בדפדפן הזה כדי שתמשיכו
  מאוחר יותר.
steps:
  - title: 'פתחו את הטופס'
    text: >-
      שמרו את קובץ ה-PDF מוואטסאפ או מאימייל למכשיר שלכם, ואז בחרו אותו
      כאן או גררו אותו לתוך הכלי. הוא לא מועלה לשום מקום.
  - title: 'הוסיפו טקסט וחתימות'
    text: >-
      הקישו כדי למקם בלוקי טקסט, סמלים, או חתימות על העמודים. אם בטופס
      יש שורת תיבות מודפסת, אחת לכל אות, הקישו עליה והטקסט שלכם ייכנס
      אות אחת בכל תיבה.
  - title: 'חתמו בקלות'
    text: 'ציירו את החתימה שלכם על המסך, הקלידו אותה בגופן כתב יד, או העלו תמונת חתימה.'
  - title: 'מקמו וגודלו'
    text: 'גררו פריטים כדי למקם אותם בדיוק במקום שהם שייכים במסמך.'
  - title: 'הורידו ושלחו'
    text: >-
      בחרו הורדה, בדקו את קובץ ה-PDF המושלם, ואז צרפו את הקובץ החדש
      בתשובה שלכם. בנייד עם תמיכה, הקשה על שיתוף מכינה עותק, והקשה נוספת
      עליו פותחת את תפריט השיתוף.
faq:
  - question: 'איך חותמים על PDF במחשב או בנייד?'
    answer: >-
      פתחו כאן את קובץ ה-PDF בדפדפן. הוסיפו טקסט או סימוני וי, ואז ציירו
      חתימה, הקלידו אחת, או בחרו תמונת חתימה. מקמו אותה בעמוד ובחרו
      הורדה. אפשר להשתמש בעכבר במחשב או באצבע בנייד. אין צורך בחשבון או
      בהתקנת אפליקציה.
  - question: 'איך חותמים על PDF שנשלח בוואטסאפ?'
    answer: >-
      שמרו קודם את הקובץ המצורף למכשיר: לתיקיית הקבצים באייפון, או
      לתיקיית ההורדות באנדרואיד או במחשב. פתחו כאן את הקובץ שנשמר, מלאו
      וחתמו עליו, ואז הורידו את העותק המושלם. חזרו לשיחה וצרפו את קובץ
      ה-PDF החדש כמסמך. בנייד עם תמיכה, לחיצה על שיתוף פעמיים יכולה
      לשלוח אותו דרך תפריט השיתוף של המערכת.
  - question: 'צריך להקים חשבון כדי לחתום על PDF?'
    answer: >-
      לא. אין הרשמה, אין אימות אימייל ואין תקופת ניסיון. פתחו את הכלי
      והתחילו לחתום מיד.
  - question: 'אפשר לחתום על הסכמים לטיול שנתי בבית הספר?'
    answer: >-
      כן. הכלי מתאים בול לטפסי הסכמה לטיול שנתי, אישורי הורים, וטפסי PDF
      רגילים. אפשר להקליד את שם הילד, לסמן וי בתיבות ההסכמה, ולצייר את
      חתימת ההורה.
  - question: 'בטופס יש שורה של תיבות קטנות, אות אחת בכל תיבה. איך ממלאים את זה?'
    answer: >-
      בחרו בכלי הטקסט, והכלי מסמן בעדינות את שורות התיבות המודפסות שהוא
      מצא בעמוד. הקישו על אחת והטקסט שלכם ייכנס אות אחת בכל תיבה,
      ממורכז בתוכה, במקום לרוץ לאורך התיבות כטקסט רגיל. כך ממלאים תאריך,
      מספר תעודת זהות, או קוד אסמכתא בטופס מודפס מראש. אם הכלי טעה במספר
      התיבות אפשר להוסיף או להסיר אותן מסרגל הכלים, וכלי הסמלים מקבל את
      אותו טיפול לתיבות סימון מודפסות, כך שוי נכנס בתוך הריבוע ולא לידו.
      התיבות נמצאות בקובץ ה-PDF שכבר פתוח בדפדפן שלכם; שום דבר בעמוד לא
      מועלה כדי לזהות אותן.
  - question: 'החתימה שלי בטוחה כאן?'
    answer: >-
      כן. הכלי הזה רץ כולו על המכשיר שלכם, אז אין חשבון ואין עותק של
      המסמך בצד שרת. תמונת החתימה מוטבעת בקובץ ה-PDF בזיכרון בלבד, ולעולם
      לא עוזבת את המחשב או הנייד שלכם.
  - question: 'מה קורה אם הדפדפן קורס באמצע מילוי טופס?'
    answer: >-
      העבודה שלכם לא נעלמת. תוך כדי הוספת טקסט, סמלים וחתימות, הכלי שומר
      את ההתקדמות אוטומטית באחסון מקומי בדפדפן שלכם, ומשחזר אותה
      אוטומטית בפעם הבאה שתפתחו את הכלי באותו מכשיר. מכיוון שזה קורה על
      המכשיר שלכם, הקובץ עדיין לעולם לא מועלה, והטיוטה השמורה נשארת עד
      שתחליפו את הקובץ, או במשך 14 יום אם לא תחזרו.
  - question: 'השפה שלי תצא נכון בקובץ שהורדתי, או תהפוך לריבועים ריקים?'
    answer: >-
      נכון, בכל פעם, כי הגופנים מגיעים בתוך הכלי במקום להסתמך על מה
      שמותקן במכשיר שלכם. כל גופן נבדק מול האותיות שבאמת נמצאות בקובץ
      הגופן, והוא נוסע מוטבע בתוך קובץ ה-PDF שאתם מורידים, כך שהטקסט שלכם
      נראה בדיוק אותו הדבר בכל מכשיר שפותח אותו, בלי ריבועים ריקים במקום
      שבו אמורה להיות האות. אם תבחרו גופן שלא יודע לצייר את השפה שלכם,
      הכלי עובר אוטומטית לגופן שיודע, ומודיע לכם על זה. במקרה הנדיר שאף
      גופן מובנה לא יודע לצייר תו מסוים, תגלו את זה תוך כדי הקלדה, לא
      אחרי שכבר מילאתם את כל הטופס, כדי שתוכלו לבקש את השפה הזו בלי לאבד
      את העבודה.
  - question: 'אפשר למלא ולחתום על PDF בעברית?'
    answer: >-
      כן. עברית עובדת מקצה לקצה. הקלידו לתוך תיבת טקסט והיא גדלה שמאלה
      מקצה ימני קבוע, בדיוק כמו שכתיבה מימין לשמאל אמורה להתנהג. הגופנים
      המוצעים לעברית מובנים בתוך הכלי ונבדקים מול כיסוי האותיות האמיתי
      שלהם, כך שמה שרואים על המסך זה מה שמוטבע בקובץ שמורידים, בלי
      ריבועים ריקים במקום האותיות. אפשר גם להקליד את החתימה בגופן כתב יד
      עברי במקום לצייר אותה.
