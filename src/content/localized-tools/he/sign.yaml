subhead: >-
  מלאו וחתמו על PDF בנייד או במחשב בלי להדפיס ולסרוק. הוסיפו טקסט, סימוני
  וי וחתימה לטופס בית ספר, בקשה, או קובץ מוואטסאפ. הקלידו בעברית וגם
  בעוד כ-20 שפות וכתבים, עם תמיכה אמיתית מימין לשמאל: תיבת טקסט גדלה
  שמאלה מקצה ימני קבוע, בדיוק כמו כתיבה ביד. חינם, קוד פתוח, והמסמך נשאר
  אצלכם במכשיר.
ariaLabel: 'כלי חתימה על PDF'
