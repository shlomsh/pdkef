ariaLabel: 'כלי כיווץ PDF'
aboutHeading: 'איך מכווצים קובץ PDF בחינם בדפדפן'
aboutLead: >-
  הקטינו את הגודל של קבצי ה-PDF שלכם, ישירות בדפדפן. בלי העלאה, בלי שרת. רוב המשקל של PDF הוא בדרך כלל התמונות שבו, אז הן מה שקטן: תמונות וסריקות נדחסות מחדש במקומן, והטקסט, השרטוטים והקישורים נשארים חדים וניתנים לבחירה. ב-PDF שכולו טקסט ושרטוטים אין מה להקטין בדרך הזו, והכלי אומר את זה עוד לפני שמתחילים. אם קובץ לא יכול לקטון, המקור נשאר אצלכם והכלי אומר לכם. לסריקה שצריכה לקטון עוד, אפשר להפוך את העמודים לתמונות, ואז הטקסט כבר לא ניתן לבחירה והקישורים לא עובדים.
freeNoteLead: >-
  כווצו קבצי PDF ליעד כמו 100KB עבור מגבלות טפסים מחמירות, כמה פעמים
  שצריך, בלי סימן מים ובלי מגבלה יומית. מכיוון שהכיווץ רץ על המכשיר שלכם,
  אין מה להעלות ואין עלות שרת שמגולגלת אליכם.
steps:
  - title: 'פתחו את קובץ ה-PDF'
    text: 'בחרו או גררו לתוך הכלי את הקובץ שרוצים לכווץ. הוא נשאר במכשיר שלכם.'
  - title: 'בחרו מצב'
    text: >-
      בחרו רמת איכות (קיצוני, מומלץ, או איכות גבוהה), או בחרו גודל יעד
      והקלידו מגבלה כמו 100KB, 200KB או 1MB.
  - title: 'כווצו והורידו'
    text: 'לחצו על כיווץ PDF, בדקו את החיסכון בגודל שמוצג, ושמרו את הקובץ המכווץ.'
faq:
  - question: 'אפשר לכווץ PDF ל-100KB בחינם?'
    answer: >-
      כן, אפשר להגדיר 100KB כיעד בחינם. בחרו גודל יעד, בחרו בקיצור הדרך
      ל-100KB, וכווצו. הכלי מנסה להגיע ליעד או מתחתיו, לא בדיוק 100KB.
      קובץ ארוך או מפורט לא תמיד יתאים; בדקו את גודל הפלט בפועל ואת
      הקריאות שלו לפני שמעלים אותו למקום אחר.
  - question: 'איך עובד הכיווץ לגודל יעד?'
    answer: >-
      אם הקובץ כבר קטן מהיעד, הוא נשמר בלי שינוי. אחרת, הכלי דוחס מחדש את התמונות שבתוכו, יורד בשלבים מהאיכות הטובה ביותר עד שלב שעומד ביעד, ואז מכוונן בינו לבין השלב שמעליו כדי לשמור את התוצאה החדה ביותר שעדיין עומדת ביעד. הטקסט והקישורים לא משתנים. אם אף שלב לא מתאים, תקבלו את התוצאה הקטנה ביותר והודעה שהיעד לא הושג; הפיכת העמודים לתמונות יכולה להקטין עוד, במחיר של טקסט שלא ניתן לבחירה. הכול קורה בדפדפן שלכם.
  - question: 'כיווץ PDF בטוח?'
    answer: >-
      כן. הכיווץ מתבצע כולו בצד הלקוח, בתוך הדפדפן שלכם. הקבצים שלכם,
      כולל תוכן רגיש כמו דוחות מס, תעודות זהות סרוקות או חוזים, אף פעם
      לא מועלים לשום שרת.
  - question: 'מה ההבדל בין רמות הכיווץ?'
    answer: >-
      שלוש הרמות דוחסות מחדש רק את התמונות. קיצוני מקטין כל תמונה לכל היותר ל-1000 פיקסלים בצלע הארוכה באיכות JPEG של 40, מומלץ ל-1600 פיקסלים באיכות 60, ואיכות גבוהה ל-2400 פיקסלים באיכות 80. הטקסט והשרטוטים זהים בכל הרמות. החיסכון תלוי בכמה מהקובץ הוא תמונות, אז PDF שרובו טקסט אולי לא יקטן. גודל יעד יורד דרך השלבים האלה, ועוד יותר כשצריך, עד שהקובץ מתאים.
  - question: 'כיווץ PDF פוגע בחיפוש טקסט או בהעתקה?'
    answer: >-
      לא. הכיווץ דוחס מחדש רק את התמונות, אז הטקסט נשאר ניתן לבחירה ולחיפוש והקישורים ממשיכים לעבוד. היוצא מן הכלל הוא המתג "להפוך עמודים לתמונות", שאתם מפעילים בעצמכם: הוא הופך כל עמוד לתמונה, ואז התוצאה מאבדת טקסט לבחירה וקישורים. שמרו את המקור אם אתם צריכים אותם.
  - question: 'יש מגבלה על גודל הקובץ שאפשר לכווץ?'
    answer: >-
      אין מגבלה מלאכותית: בלי תקרת משימות יומית, בלי סימן מים, בלי חומת
      תשלום. רוב כלי הכיווץ המקוונים מטילים מגבלות כי עיבוד בשרת עולה
      להם כסף. הכלי הזה רץ כולו על המכשיר שלכם, אז המגבלה היחידה היא
      הזיכרון הפנוי במכשיר.
  - question: 'אפשר לבחור גודל מותאם אישית, כמו 110KB או 250KB, לא רק את הקיצורים?'
    answer: >-
      כן. הקיצורים 100KB, 200KB, 500KB ו-1MB הם קיצורי דרך. הזינו מגבלה
      משלכם בשדה ה-KB, ואז בדקו אם התוצאה שהורדתם עמדה בה. יעד הוא לא
      הבטחה שכל PDF יוכל להתאים בלי לאבד קריאות.
