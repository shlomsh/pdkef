subhead: >-
  צריכים PDF מתחת ל-100KB לטופס או להעלאה? בחרו גודל יעד ובדקו את התוצאה.
  התמונות שבתוכו קטנות, והטקסט והקישורים נשארים בדיוק כמו שהם. פרטי. הקובץ נשאר
