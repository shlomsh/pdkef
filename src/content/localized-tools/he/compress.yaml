faq:
  - question: 'אפשר לכווץ PDF ל-100KB בחינם?'
    answer: >-
      כן, אפשר להגדיר 100KB כיעד בחינם. בחרו גודל יעד, בחרו בקיצור הדרך
      ל-100KB, וכווצו. הכלי מנסה להגיע ליעד או מתחתיו, לא בדיוק 100KB.
      קובץ ארוך או מפורט לא תמיד יתאים; בדקו את גודל הפלט בפועל ואת
      הקריאות שלו לפני שמעלים אותו למקום אחר.
  - question: 'איך עובד הכיווץ לגודל יעד?'
    answer: >-
      אם הקובץ כבר קטן מהיעד, הוא נשמר בלי שינוי. אחרת, הכלי הופך את
      העמודים לתמונות ומחפש הגדרות איכות ורזולוציה בתוך מגבלת זמן. אם הוא
      לא מצליח להגיע ליעד, הוא מחזיר את התוצאה הקטנה ביותר שנמצאה ומודיע
      שהיעד לא הושג. הכול קורה בדפדפן שלכם.
  - question: 'כיווץ PDF בטוח?'
    answer: >-
      כן. הכיווץ מתבצע כולו בצד הלקוח, בתוך הדפדפן שלכם. הקבצים שלכם,
      כולל תוכן רגיש כמו דוחות מס, תעודות זהות סרוקות או חוזים, אף פעם
      לא מועלים לשום שרת.
  - question: 'מה ההבדל בין רמות הכיווץ?'
    answer: >-
      קיצוני משתמש ברזולוציית תמונה ואיכות נמוכות יותר לקבצים קטנים
      יותר. מומלץ מאזן בין גודל לקריאות. איכות גבוהה שומרת על יותר
      פרטים. ההקטנה תלויה בקובץ המקור; קובץ שכבר קומפקטי אולי לא יקטן
      עוד. גודל יעד מחפש הגדרות שמתקרבות למגבלה שבחרתם.
  - question: 'כיווץ PDF פוגע בחיפוש טקסט או בהעתקה?'
    answer: >-
      כש-PDkef מכווץ קובץ, הוא הופך את העמודים לתמונות. הפלט מאבד טקסט
      לבחירה וקישורים מוטבעים, אז שמרו את המקור אם אתם צריכים חיפוש או
      גישת טקסט לקורא מסך. היוצא מן הכלל הוא גודל יעד כשהמקור כבר קטן
      מהמגבלה: הוא מוחזר בלי שינוי.
  - question: 'יש מגבלה על גודל הקובץ שאפשר לכווץ?'
    answer: >-
      אין מגבלה מלאכותית: בלי תקרת משימות יומית, בלי סימן מים, בלי חומת
      תשלום. רוב כלי הכיווץ המקוונים מטילים מגבלות כי עיבוד בשרת עולה
      להם כסף. הכלי הזה רץ כולו על המכשיר שלכם, אז המגבלה היחידה היא
      הזיכרון הפנוי במכשיר.
  - question: 'אפשר לבחור גודל מותאם אישית, כמו 110KB או 250KB, לא רק את הקיצורים?'
    answer: >-
      כן. הקיצורים 100KB, 200KB, 500KB ו-1MB הם קיצורי דרך. הזינו מגבלה
      משלכם בשדה ה-KB, ואז בדקו אם התוצאה שהורדתם עמדה בה. יעד הוא לא
      הבטחה שכל PDF יוכל להתאים בלי לאבד קריאות.
