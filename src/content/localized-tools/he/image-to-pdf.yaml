faq:
  - question: 'האם PDkef באמת חינמי?'
    answer: >-
      כן. PDkef חינמי לגמרי, בלי הגבלות, בלי הרשמה ובלי סימן מים על ה-PDF
      שנוצר.
  - question: 'האם התמונות שלי מועלות לשרת?'
    answer: >-
      לא. שום דבר לא מועלה. הכלי רץ על המכשיר שלכם, בדפדפן, והתמונות לא
      עוזבות אותו. אין שרת עיבוד. לשימוש בלי אינטרנט, התקינו את PDkef ותנו
      לנכסים הנדרשים להיטען בזמן שאתם מחוברים.
  - question: 'אילו סוגי תמונות אפשר להמיר?'
    answer: >-
      JPG ו-PNG. כל תמונה הופכת לעמוד משלה ב-PDF הסופי, לפי הסדר שבחרתם.
  - question: 'האם התמונות יוקטנו או יכווצו?'
    answer: >-
      לא. כל תמונה מוטמעת בעמוד ה-PDF שלה באיכות המקורית ובמידות המקוריות,
      בלי דחיסה חוזרת ובלי הקטנה.
  - question: 'אפשר לאחד סריקות או צילומים של מצגת לקובץ PDF אחד?'
    answer: >-
      כן. זה בדיוק מה שהכלי נבנה לו. הוסיפו כמה עמודי תמונה שתרצו (דפים
      סרוקים, שקפים מצולמים, צילומי מסך), סדרו אותם והורידו קובץ PDF אחד.
  - question: 'יש הגבלה על מספר התמונות?'
    answer: >-
      אין הגבלה מלאכותית. המגבלה היחידה היא הזיכרון הפנוי במכשיר שלכם, כי
      הכול רץ אצלכם.
  - question: 'אפשר לשלב תמונות JPG ו-PNG באותו PDF?'
    answer: >-
      כן. הוסיפו כל שילוב של קובצי JPG ו-PNG והם יתאחדו יחד לקובץ PDF אחד,
      כל תמונה בפורמט שלה. אין צורך להמיר הכול לסוג אחד קודם.
  - question: 'למה כל עמוד יוצא בגודל אחר?'
    answer: >-
      כל עמוד ב-PDF מקבל את מידות התמונה שלו, פיקסל אחד של תמונה לנקודה אחת
      ב-PDF. תמונת פורטרט הופכת לעמוד לאורך, וצילום מסך רחב הופך לעמוד רחב.
      שום דבר לא נחתך, לא נמתח ולא מקבל שוליים כדי להתאים לגודל נייר
      רגיל.
