title: 'התקנת אפליקציית PDF בדפדפן | PDkef'
description: 'הוסיפו את PDkef למסך הבית או לשולחן העבודה לגישה מהירה לטפסי PDF. כך פועלת התקנה בדפדפן, טיוטות מקומיות ועבודה לא מקוונת לאחר טעינת הנכסים.'
breadcrumb: 'התקנת PDF'
icon: 'Download'
kicker: 'גישה מהירה לטפסים'
h1: 'להתקין את כלי ה‑PDF כאפליקציה'
subhead: 'אפשר להוסיף את האתר למסך הבית או לשולחן העבודה דרך אפשרות ההתקנה של הדפדפן. זו דרך נוחה לפתוח אותו במהירות; היא אינה הופכת טיוטות לסנכרון בין מכשירים.'
primaryCta:
  href: '/he/sign/'
  label: 'פתיחת כלי המילוי'
sections:
  - sketch: 'arcs'
    icon: 'WifiOff'
    iconPos: 'tr'
    kicker: 'כשהקליטה נעלמת'
    heading: 'טפסים לא תמיד מגיעים עם חיבור יציב'
    blocks:
      - kind: 'prose'
        text: 'נסיעה, חדר המתנה או אזור ללא קליטה אינם זמן טוב לגלות שכלי PDF תלוי בשרת. העיבוד של המסמך נעשה במכשיר, אך שימוש לא מקוון תלוי בכך שהאתר והנכסים הנחוצים כבר נטענו ונשמרו במטמון.'
      - kind: 'prose'
        text: 'לפני עבודה חשובה, פתחו את הכלי בזמן שיש חיבור, ודאו שהוא נטען, ואז בדקו את תהליך הבחירה וההורדה. מטמון שנוקה או נכסים שלא נטענו עדיין עלולים למנוע עבודה לא מקוונת.'
  - variant: 'highlight'
    sketch: 'rings'
    icon: 'Download'
    iconPos: 'br'
    kicker: 'כמו אפליקציה רגילה'
    heading: 'איך מוסיפים את האתר למכשיר'
    blocks:
      - kind: 'prose'
        text: 'פתחו את האתר בדפדפן וחפשו את פקודת ההתקנה או "Add to Home Screen". השם והמיקום של הפקודה משתנים לפי דפדפן ומכשיר, לכן השתמשו באפשרות שהדפדפן מציג בפועל.'
      - kind: 'columns'
        items:
          - icon: 'Smartphone'
            title: 'טלפון'
            body: 'פתחו את תפריט השיתוף או הדפדפן וחפשו "Add to Home Screen" או "Install".'
          - icon: 'Laptop'
            title: 'מחשב'
            body: 'בדפדפנים תומכים, חפשו סמל התקנה בשורת הכתובת או פקודת Install בתפריט.'
          - icon: 'CheckCircle2'
            title: 'בדיקה'
            body: 'פתחו את הקיצור החדש וודאו שהכלי והקבצים המקומיים פועלים כפי שציפיתם.'
      - kind: 'prose'
        text: 'התקנה יוצרת קיצור נוח; היא אינה נותנת הרשאה מיוחדת למסמכים ואינה משנה את מדיניות האחסון של הדפדפן.'
  - sketch: 'rings'
    icon: 'FileText'
    iconPos: 'tr'
    kicker: 'במחשב Mac'
    heading: 'לפתוח PDF ישירות מ‑Finder'
    blocks:
      - kind: 'prose'
        text: 'אחרי ש‑PDkef הותקן מ‑Chrome במחשב Mac, הוא מופיע בתפריט הלחצן הימני "Open With" של קובצי PDF ב‑Finder, לצד האפליקציות האחרות שיכולות לפתוח אותם. כך קובץ PDF בתיקיית ההורדות נמצא במרחק שתי לחיצות ממילוי וחתימה.'
      - kind: 'steps'
        items:
          - '<strong>לחצו לחיצה ימנית על קובץ PDF ב‑Finder</strong> ובחרו "Open With".'
          - '<strong>בחרו "PDkef - Free Online PDF Tools".</strong> בפעם הראשונה Chrome שואל אם לפתוח את הקובץ באפליקציית האינטרנט הזו, ובוחרים "Open". אם מסמנים "Remember my choice for this file type: PDF", הוא לא ישאל שוב.'
          - '<strong>ממלאים וחותמים בכלי המילוי והחתימה.</strong> ה‑PDF נפתח שם, במכשיר שלכם, ושום דבר לא מועלה.'
      - kind: 'image'
        src: '/images/install-guide/open-with-finder.jpg'
        alt: 'צילום אמיתי של Finder עם תפריט הלחצן הימני פתוח על קובץ PDF, ו‑PDkef - Free Online PDF Tools מסומן תחת Open With'
        width: 960
        height: 591
        caption: '<strong>PDkef בתפריט "Open With" של Finder.</strong> לחיצה ימנית על קובץ PDF מציגה אותו לצד האפליקציות האחרות שלכם.'
      - kind: 'image'
        src: '/images/install-guide/open-with-chrome-prompt.jpg'
        alt: 'צילום אמיתי של חלון Chrome ששואל אם לפתוח ולערוך קובץ PDF באפליקציית האינטרנט של PDkef, עם תיבת סימון לזכירת הבחירה'
        width: 448
        height: 258
        caption: '<strong>Chrome שואל פעם אחת.</strong> בוחרים "Open", ומסמנים "Remember my choice for this file type: PDF" כדי לדלג על השאלה בפעם הבאה.'
  - sketch: 'waves'
    icon: 'Save'
    iconPos: 'cl'
    kicker: 'טיוטה מקומית'
    heading: 'טופס באמצע עבודה לא תלוי רק בלשונית פתוחה'
    blocks:
      - kind: 'prose'
        text: 'בעת עריכת טופס, טיוטה עשויה להישמר מקומית בדפדפן כדי לעזור בהתאוששות מתקלה או סגירה. זהו מנגנון נוחות, לא גיבוי מובטח; אחסון הדפדפן יכול להיות חסום, מנוקה או לא זמין.'
      - kind: 'prose'
        text: 'טיוטות נשמרות לזמן מוגבל של עד 28 ימים כמיטב המאמץ. הורידו עותק כאשר העבודה חשובה, ואל תניחו שהטיוטה תופיע אוטומטית במחשב או בטלפון אחר.'
  - sketch: 'grid'
    icon: 'WifiOff'
    iconPos: 'tr'
    kicker: 'לא מצב מצומצם'
    heading: 'מה אפשר ומה אי אפשר להבטיח ללא חיבור'
    blocks:
      - kind: 'prose'
        text: 'כאשר הנכסים הדרושים כבר במטמון, פעולות PDF מתבצעות במכשיר. עם זאת, אין להבטיח זמינות לא מקוונת לפני טעינה מוצלחת, לאחר ניקוי מטמון או בכל דפדפן שאינו מאפשר את האחסון הדרוש.'
faq:
  - question: 'האם צריך חיבור לאינטרנט כדי למלא טופס?'
    answer: 'אחרי טעינה מוצלחת ושמירת הנכסים במטמון, אפשר לעיתים לעבוד ללא חיבור. לפני כן, או אם המטמון נמחק, נדרש חיבור כדי לטעון את האתר.'
  - question: 'מה קורה אם החיבור נופל באמצע?'
    answer: 'עיבוד הקובץ אינו נשלח לשרת. טיוטה מקומית עשויה לעזור, אך יש להוריד עותקים חשובים ולא להסתמך עליה כעל גיבוי.'
  - question: 'כמה זמן נשמר טופס בתהליך?'
    answer: 'טיוטות מקומיות מיועדות להתאוששות לזמן מוגבל של עד 28 ימים כמיטב המאמץ. הן עשויות להיעלם אם אחסון הדפדפן מנוקה או אינו זמין.'
  - question: 'אפשר להתחיל במחשב ולהמשיך בטלפון?'
    answer: 'אין סנכרון אוטומטי בין מכשירים. הורידו את העותק והעבירו אותו בדרך שבחרתם כדי להמשיך במכשיר אחר.'
  - question: 'האם ההתקנה עובדת בטלפון או רק במחשב?'
    answer: 'האפשרות תלויה בדפדפן ובמערכת ההפעלה. חפשו פקודת התקנה או "Add to Home Screen" בדפדפן שבו אתם משתמשים.'
  - question: 'כשחוזרים לאינטרנט, האם הטופס מועלה?'
    answer: 'תוכן ה‑PDF מעובד מקומית ואינו נשלח לשרת לעיבוד. ייתכן שימוש במדידות תפעוליות אנונימיות שאינן כוללות את תוכן המסמך.'
  - question: 'אפשר לפתוח קובץ PDF ישירות מ‑Finder?'
    answer: 'כן, במחשב Mac ש‑PDkef הותקן בו מ‑Chrome. לחצו לחיצה ימנית על הקובץ, בחרו "Open With" ואז "PDkef - Free Online PDF Tools". Chrome שואל פעם אחת אם לפתוח את הקובץ באפליקציית האינטרנט, וה‑PDF נפתח בכלי המילוי והחתימה במכשיר שלכם, בלי העלאה.'
