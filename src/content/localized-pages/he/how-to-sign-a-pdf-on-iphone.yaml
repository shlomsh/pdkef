sourceVersion: '2026-08-28'
title: 'איך לחתום על PDF ב‑iPhone | PDkef'
description: >-
  חתמו ומלאו PDF ב‑iPhone או ב‑iPad בלי אפליקציה נוספת. למדו לשמור את הקובץ, להוסיף טקסט,
  לסמן תיבות ולהוריד עותק מוכן לשליחה.
breadcrumb: 'iPhone'
icon: 'Smartphone'
kicker: 'iPhone, בדפדפן'
h1: 'איך לחתום על PDF ב‑iPhone'
subhead: >-
  כלי הסימון של Apple שימושי לחתימה פשוטה על דף, אך הוא אינו מתאים לכל צורך של טופס. אפשר לבחור
  PDF מ‑Files, למלא אותו בדפדפן, להוסיף חתימה ולשמור עותק חדש.
primaryCta:
  href: '/sign/'
  label: 'לחתימה על PDF עכשיו'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'Smartphone'
    iconPos: 'tr'
    kicker: 'ארבעה שלבים'
    heading: 'חתימה על PDF ב‑iPhone'
    blocks:
      - kind: 'steps'
        items:
          - '<strong>שמרו קודם את ה‑PDF ב‑Files.</strong> פתחו את הקובץ ב‑Mail או ב‑WhatsApp, בחרו שיתוף ואז "Save to Files".'
          - '<strong>פתחו את <a href="/sign/">pdkef.com/sign</a> בדפדפן</strong> ובחרו את הקובץ ששמרתם.'
          - '<strong>מלאו ואז חתמו.</strong> הגדילו את הדף לפני הצבת פריטים קטנים; אפשר לצייר באצבע או ב‑Apple Pencil, להקליד או להעלות תמונה של חתימה.'
          - '<strong>הורידו ושתפו את הקובץ.</strong> בחרו את מיקום ההורדה המתאים לכם ושלחו את עותק ה‑PDF המוגמר.'
  - sketch: 'grid'
    icon: 'PenLine'
    iconPos: 'br'
    kicker: 'Markup מול מילוי טופס'
    heading: 'מתי כלי הסימון המובנה אינו מספיק'
    blocks:
      - kind: 'prose'
        text: >-
          Markup יכול להוסיף חתימה או הערה על הדף, והוא פתרון נוח לחתימה בודדת. בטופס סרוק או
          בטופס עם תיבות קטנות, לעומת זאת, הצבת טקסט וסימנים בדיוק במקום הנדרש יכולה להיות נוחה יותר
          בכלי מילוי ייעודי.
      - kind: 'compare'
        builtInLabel: 'Markup ב‑Files'
        caption: 'הטבלה מתארת סוגי משימות, לא בדיקת תאימות לגרסאות iOS או לכל מסמך.'
        rows:
          - task: 'הוספת חתימה בכתב יד'
