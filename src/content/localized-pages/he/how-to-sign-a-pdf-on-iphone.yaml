          - task: 'הקלדה על סריקה'
            builtIn: 'תווית טקסט שמזיזים'
            here: 'הצבת טקסט במקום הרצוי'
          - task: 'סימון תיבה בטופס סרוק'
            builtIn: ''
            here: 'אפשרי'
          - task: 'מחיקת מידע רגיש לצמיתות'
            builtIn: ''
            here: 'נדרש כלי מחיקה מתאים'
          - task: 'שמירת טיוטה מקומית'
            builtIn: 'תלוי ביישום ובקובץ'
            here: 'טיוטה מקומית לזמן מוגבל'
  - sketch: 'rings'
    icon: 'Lightbulb'
    iconPos: 'cl'
    kicker: 'הבחירה הפשוטה'
    heading: 'מתי Markup הוא דווקא הפתרון הנכון'
    blocks:
      - kind: 'prose'
        text: >-
          אם צריך רק להוסיף חתימה בתחתית דף, Markup עשוי להיות המהיר ביותר. פתחו אותו מתוך הקובץ,
          הוסיפו את החתימה ושמרו. אין הכרח לפתוח כלי נוסף.
      - kind: 'prose'
        text: >-
          עברו לכלי המילוי כאשר צריך למלא כמה אזורים, לסמן תיבות או <a href="/permanently-delete-text-from-pdf/">להסיר מידע באופן בטוח ולא רק לכסות אותו</a>. טיוטות נשמרות מקומית במכשיר לתקופה מוגבלת, אך זו אינה החלפה לגיבוי או לסנכרון אוטומטי בין מכשירים.
faq:
  - question: 'האם צריך להוריד אפליקציה מ‑App Store?'
    answer: 'לא. אפשר לעבוד בדפדפן עם קובץ שבחרתם מ‑Files, ללא חשבון וללא התקנת אפליקציה נוספת.'
  - question: 'אם Files כבר מאפשר סימון של PDF, למה להשתמש בכלי אחר?'
    answer: 'לחתימה אחת Markup יכול להספיק בהחלט. במילוי של טופס ארוך, תיבות סימון או מסמך סרוק, הצבת הטקסט והסימנים עשויה להיות נוחה יותר בכלי מילוי.'
  - question: 'איך מעבירים PDF מ‑WhatsApp או מ‑Mail?'
    answer: 'פתחו את הקובץ, בחרו שיתוף ואז "Save to Files". לאחר מכן בחרו אותו מתוך Files כשאתם מתבקשים לבחור קובץ.'
  - question: 'האם זה עובד גם ב‑iPad?'
    answer: 'אפשר לפתוח את האתר בדפדפן ב‑iPad ולבחור קובץ מקומי. שימוש ב‑Apple Pencil עשוי להקל על ציור חתימה, אך יש לבצע בדיקה על המכשיר והדפדפן שלכם.'
  - question: 'לאן נשמר PDF חתום?'
    answer: 'אתם בוחרים את פעולת ומיקום ההורדה דרך הדפדפן. לאחר מכן אפשר לפתוח את הקובץ ב‑Files ולשתף אותו.'
  - question: 'איך משפרים חתימה באצבע?'
    answer: 'הגדילו את הדף וחתמו באזור גדול, ואז הקטינו ומקמו את החתימה. אפשר גם להשתמש בעט תואם או להקליד את השם, אם אופן חתימה כזה מתקבל אצל הצד המבקש.'
