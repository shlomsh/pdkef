          - task: 'הקלדה על טופס סרוק'
            builtIn: 'לעיתים תיבת טקסט בלבד'
            here: 'הצבת טקסט במקום הרצוי'
          - task: 'סימון תיבה בטופס סרוק'
            builtIn: ''
            here: 'אפשרי'
          - task: 'הסרת תוכן מדף'
            builtIn: ''
            here: 'ראו כלי מחיקה ייעודי'
          - task: 'שמירת טיוטה מקומית'
            builtIn: 'תלוי באפליקציה'
            here: 'טיוטה מקומית לזמן מוגבל'
  - sketch: 'waves'
    icon: 'ShieldCheck'
    iconPos: 'cl'
    kicker: 'בלי אפליקציה קבועה'
    heading: 'לא חייבים להתקין אפליקציה בשביל טופס אחד'
    blocks:
      - kind: 'prose'
        text: >-
          לפעמים מדובר בטופס חד־פעמי — לבית הספר, לשכירות או לעבודה. אפשר לפתוח אותו בדפדפן, לעבוד
          עליו ולשמור עותק, בלי ליצור חשבון ובלי להשאיר אפליקציית PDF נוספת במכשיר.
      - kind: 'prose'
        text: >-
          העיבוד של המסמך נעשה במכשיר. זו אינה טענה שאין באתר מדידות תפעוליות אנונימיות; המשמעות היא
          שתוכן ה‑PDF אינו נשלח לשרת לעיבוד. לאחר שטעינת הנכסים הדרושים הושלמה, אפשר גם <a href="/install-pdf-app/">להוסיף את האתר למסך הבית</a> ולעבוד ללא חיבור, בכפוף לכך שהנכסים נשמרו במטמון.
faq:
  - question: 'האם צריך להתקין אפליקציה כדי לחתום על PDF באנדרואיד?'
    answer: 'לא. אפשר לפתוח את הכלי בדפדפן ולבחור קובץ מהמכשיר. אין צורך בחשבון או בהתקנה מחנות האפליקציות.'
  - question: 'למה מילוי PDF באנדרואיד מרגיש שונה ממכשיר למכשיר?'
    answer: 'לכל יצרן ואפליקציית צפייה עשויות להיות יכולות אחרות. חלק מהמציגים מאפשרים רק צפייה, וחלק מוסיפים סימון או ציור; לכן אין התנהגות מובנית אחידה.'
  - question: 'איך מעבירים PDF מ‑WhatsApp או מ‑Gmail לכלי?'
    answer: 'הורידו קודם את הקובץ למכשיר. אחר כך פתחו את הכלי, בחרו קובץ ובחרו אותו מתיקיית ההורדות או ממנהל הקבצים.'
  - question: 'האם נדרש חשבון או מנוי?'
    answer: 'לא. אין שלב הרשמה, כתובת אימייל או תקופת ניסיון כדי להתחיל להשתמש בכלי.'
  - question: 'האם יתווסף סימן מים לקובץ שהורדתי?'
    answer: 'לא. ההורדה היא עותק של המסמך עם השינויים שהוספתם, ללא סימן מים של PDkef.'
  - question: 'החתימה באצבע נראית לא טוב. מה אפשר לעשות?'
    answer: 'הגדילו את הדף, ציירו חתימה גדולה מהשטח הדרוש והקטינו אותה לאחר מכן. עט מגע יכול לעזור; חלופה היא להקליד שם בסגנון כתב יד, אם הגוף המבקש מקבל זאת.'
