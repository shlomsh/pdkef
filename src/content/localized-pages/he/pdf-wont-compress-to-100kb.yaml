pageId: 'pdf-wont-compress-to-100kb'
locale: 'he'
status: 'draft'
sourceHash: 'fnv1a64:7d62ce7cad2aa6e6'
title: 'כיווץ קובץ PDF למגבלת העלאה: ביטוח לאומי ועוד | PDkef'
description: >-
  קובץ PDF שלא עובר את מגבלת ההעלאה של ביטוח לאומי, בתי המשפט או NITE? המגבלות שפורסמו, ומה קורה לסריקה בכלי הכיווץ, נמדד ולא מובטח.
breadcrumb: 'מגבלות גודל ב-PDF'
icon: 'ScanText'
kicker: 'נמדד, לא מובטח'
h1: 'כיווץ קובץ PDF למגבלת ההעלאה: מה באמת נכנס?'
subhead: >-
  מגבלת גודל היא מספר אחד שמתחלק בין כל העמודים בקובץ. בדף הזה הרצנו סריקות בדיקה בכלי הכיווץ של PDkef וראינו מה קורה ב-1, 5, 10 ו-20 עמודים מול יעד של 500KB, כדי שתדעו אם הקובץ שלכם קרוב או שבאמת לא ייכנס.
primaryCta:
  href: '/he/compress/'
  label: 'כיווץ PDF בחינם'
sections:
  - variant: 'highlight'
    sketch: 'grid'
    icon: 'ScanText'
    iconPos: 'tr'
    kicker: 'המספר שחשוב'
    heading: 'כמות העמודים, לא גודל הקובץ, קובעת אם המגבלה ריאלית'
    blocks:
      - kind: 'prose'
        text: >-
          רוב המגבלות בישראל נדיבות: 5MB, 8MB, 10MB ואפילו 30MB. מבין מגבלות המסמכים שמצאנו, הצפופה ביותר היא בדין וחשבון הרב שנתי של ביטוח לאומי, <strong>500KB לכל קובץ</strong>, ובטופס פניות מנהליות של מכבי, 800KB. סריקה של כמה עמודים מהטלפון, כשכל עמוד שוקל כ-400KB, חורגת מיד, גם כשהיא נראית לכם קטנה.
      - kind: 'prose'
        text: >-
          הסיבה פשוטה. סריקה היא תמונה של כל עמוד, ולכן כדי להגיע ליעד קטן הכלי מקטין את התמונות האלה. הוא יורד בשלבים מתמונות גדולות באיכות גבוהה לתמונות קטנות באיכות נמוכה, ובודק בין השלב האחרון שנכנס לשלב שמעליו כדי להשאיר את התוצאה החדה ביותר שעדיין נכנסת ליעד. טקסט של PDF מוקלד נשאר כמו שהוא. כשאפילו השלב הקטן ביותר גדול מדי, הכלי אומר את זה, ויש מתג בשם "להפוך עמודים לתמונות" שיכול להקטין עוד, במחיר טקסט שאי אפשר לסמן.
  - sketch: 'waves'
    icon: 'HardDriveDownload'
    iconPos: 'br'
    kicker: 'חמישה קבצי בדיקה, יעד אחד'
    heading: 'איך נראה יעד של 500KB בכמויות עמודים שונות'
    blocks:
      - kind: 'table'
        caption: 'כל שורה נוצרה בהרצת הקובץ בכלי הכיווץ של PDkef ברמה "גודל מדויק" ובלחיצה על 500KB. הסריקות הן טופס אחד שנוצר במחשב, בסגנון צילום מהטלפון, כ-410KB לעמוד.'
        headers: ['קובץ', 'גודל מקורי', 'תוצאה ביעד 500KB', 'האם קריא?']
        rows:
          - ['עמוד אחד מוקלד (טקסט PDF)', '2,929 בתים', 'נשאר כמו שהוא, אין בו מה לכווץ', 'כן, לא נגענו בו']
          - ['עמוד סרוק אחד', '419,462 בתים', 'נשאר כמו שהוא, כבר מתחת ליעד', 'כן, זה הקובץ המקורי']
          - ['חמישה עמודים סרוקים', '2,097,122 בתים', '493,560 בתים, קטן ב-76%', 'כן, חד וברור']
          - ['עשרה עמודים סרוקים', '4,194,057 בתים', '502,851 בתים, קטן ב-88%', 'כן, קריא, מעט רך']
          - ['עשרים עמודים סרוקים', '8,386,018 בתים', '488,187 בתים, קטן ב-94%', 'קריא, אבל רך בבירור']
      - kind: 'prose'
        text: >-
          את הקריאות בדקנו בעין, בעמוד הראשון של כל קובץ מכווץ. עוד פרט קטן שכדאי להכיר: הכלי סופר KB כ-1,024 בתים, ולכן כפתור 500KB הוא יעד של 512,000 בתים. אם הפורטל סופר 500,000 בתים, הקלידו בשדה הגודל 476. ב-10 וב-20 עמודים זה נתן 474,636 ו-472,862 בתים, בשתי הרצות נפרדות.
  - sketch: 'rings'
    icon: 'AlertTriangle'
    iconPos: 'cl'
    kicker: 'החלק המסובך'
    heading: 'ככל שיש יותר עמודים, כל עמוד מקבל פחות מקום'
    blocks:
      - kind: 'prose'
        text: >-
          עשרה עמודים ב-500KB משאירים בערך 50KB לעמוד, ועשרים עמודים משאירים בערך 24KB. בבדיקה שלנו שניהם נכנסו ליעד, אבל ב-20 עמודים הטקסט כבר רך יותר. בלי לבדוק קובץ ארוך יותר אי אפשר להבטיח שהוא ייכנס, והכלי אומר במפורש כשלא הצליח להגיע ליעד ומראה את התוצאה הקרובה ביותר.
      - kind: 'checklist'
        items:
          - >-
            <strong>סרקו מראש בשחור לבן.</strong> ביטוח לאומי מבקש בדין וחשבון הרב שנתי לסרוק בשחור לבן ברזולוציה של עד 300 DPI כדי להקטין את הקובץ. זה קורה בסורק או באפליקציית הסריקה, ואחר כך כלי הכיווץ ממשיך מקובץ קטן יותר.
          - >-
            <strong>פצלו את הקובץ אם המגבלה היא לכל קובץ.</strong> בדין וחשבון הרב שנתי המגבלה היא 500KB לקובץ ו-10MB לכל הצרופות יחד, אז <a href="/he/split/">פיצול PDF</a> לכמה קבצים נותן לכל חלק את התקציב המלא שלו.
          - >-
            <strong>בדקו מה באמת נדרש.</strong> המגבלות שפורסמו הן גודל מקסימלי, לא יעד מדויק, וקובץ שכבר מתחת למגבלה אינו צריך כיווץ.
          - >-
            <strong>ב-PDF שכולו טקסט ושרטוטים אין מה להקטין.</strong> הכלי מקטין תמונות. כשאין בקובץ תמונות הוא אומר "אין כאן מה לכווץ", והמקור נשאר אצלכם.
  - sketch: 'grid'
    icon: 'FileText'
    iconPos: 'tr'
    kicker: 'מה כל אתר מבקש'
    heading: 'מגבלות העלאה שפורסמו באתרים בישראל'
    blocks:
      - kind: 'table'
        caption: 'נבדק בעמוד של כל שירות באוקטובר 2026. מגבלות משתנות, ולכן כדאי לוודא שוב לפני העלאה.'
        headers: ['שירות', 'מה מוגבל', 'המגבלה שפורסמה']
        rows:
          - ['ביטוח לאומי, שליחת מסמכים', 'קובץ אחד', '10MB לקובץ, עד 15 קבצים; JPG, PNG, TIFF, BMP, PDF']
          - ['ביטוח לאומי, שירות אישי', 'קובץ אחד', '5MB לקובץ; JPG, PNG, TIF, PDF']
          - ['ביטוח לאומי, דין וחשבון רב שנתי', 'קובץ אחד וכל הצרופות', '500KB לקובץ, 10MB לכל הצרופות יחד']
          - ['הרשות השופטת, בקשה כללית', 'הבקשה והנספחים', 'קובץ PDF אחד מאוחד, עד 30MB']
          - ['NITE, התאמות בבחינות', 'קובץ אחד', '8MB לקובץ, PDF בלבד']
          - ['משרד הביטחון, פיקדון', 'קובץ אחד', '10MB לקובץ, עד 10 קבצים; PDF, PNG, TIFF, JPG']
          - ['מכבי, טופס פניות מנהליות', 'קובץ מצורף', '800KB; txt, pdf, jpg, gif (בטופס הזה בלבד)']
      - kind: 'prose'
        text: >-
          את המספרים של ביטוח לאומי אספנו משלושה עמודים שלו: <a href="https://www.btl.gov.il/About/faq/TroubleShooting/FaqGeneral/Pages/איך-ניתן-לשלוח-לכם-מסמכים.aspx" target="_blank" rel="noopener noreferrer">שליחת מסמכים</a>, <a href="https://www.btl.gov.il/About/faq/TroubleShooting/FaqIshi/Pages/כיצד--ניתן-לשלוח-מסמכים-בשירות-אישי.aspx" target="_blank" rel="noopener noreferrer">שירות אישי</a> ו<a href="https://www.gov.il/he/service/annual_report" target="_blank" rel="noopener noreferrer">הדין וחשבון הרב שנתי</a>. בשליחת מסמכים ובשירות האישי המגבלות הן 10MB ו-5MB לקובץ, והדין וחשבון הרב שנתי הוא היוצא דופן.
      - kind: 'prose'
        text: >-
          את המגבלות של שאר השירותים אפשר לבדוק בעמודים עצמם: <a href="https://www.gov.il/he/service/general_labor_court_application" target="_blank" rel="noopener noreferrer">בקשה כללית של הרשות השופטת</a>, <a href="https://www.nite.org.il/special-test-accommodations-guidance/upload-documents/" target="_blank" rel="noopener noreferrer">התאמות בבחינות של NITE</a>, <a href="https://www.hachvana.mod.gov.il/GrantAndDeposit/DepositUpTo5/Pages/education.aspx" target="_blank" rel="noopener noreferrer">פיקדון במשרד הביטחון</a> ו<a href="https://www.maccabi4u.co.il/forms/administrative_issues/" target="_blank" rel="noopener noreferrer">טופס פניות מנהליות של מכבי</a>.
  - sketch: 'arcs'
    icon: 'Layers'
    iconPos: 'bl'
    kicker: 'בקשה לבית משפט'
    heading: 'קובץ אחד מאוחד, עד 30MB: קודם איחוד, אחר כך כיווץ'
    blocks:
      - kind: 'prose'
        text: >-
          בבקשה כללית של הרשות השופטת צריך לשלוח את הבקשה ואת הנספחים שלה כקובץ PDF אחד, עד 30MB. סריקה של 20 עמודים שוקלת כ-8MB, כלומר היא נכנסת לגבול הזה גם בלי כיווץ. רק אם הנספחים הרבה יותר גדולים צריך לכווץ.
      - kind: 'steps'
        items:
          - '<strong>אחדו את הקבצים</strong> לקובץ אחד עם <a href="/he/merge/">איחוד PDF</a>, ובדקו את סדר העמודים לפני ההורדה.'
          - '<strong>בדקו את הגודל של הקובץ המאוחד.</strong> אם הוא מתחת ל-30MB, אפשר להעלות אותו כמו שהוא.'
          - '<strong>אם הוא גדול מדי, פתחו את <a href="/he/compress/">כיווץ PDF</a>,</strong> בחרו "גודל מדויק" והקלידו את המגבלה, ואז הורידו את הקובץ המכווץ.'
  - variant: 'highlight'
    sketch: 'waves'
    icon: 'WifiOff'
    iconPos: 'br'
    kicker: 'חינם, פרטי, בלי חשבון'
    heading: 'נסו על הקובץ שלכם לפני שמחליטים מה לעשות'
    blocks:
      - kind: 'prose'
        text: >-
          <a href="/he/compress/">פתחו את כלי הכיווץ</a>, בחרו "גודל מדויק" והקלידו את המגבלה שהשירות מבקש. הקובץ נשאר אצלכם במכשיר, ואין העלאה שצריך לחכות לה: תראו מיד אם הוא נכנס, ואם לא, תוכלו לבחור יעד אחר או לפצל את הקובץ.
faq:
  - question: 'למה PDF סרוק לא מתכווץ ל-500KB?'
    answer: >-
      המגבלה מתחלקת בין כל העמודים. סריקה היא תמונה של כל עמוד, ולכן ככל שיש יותר עמודים, כל אחד מקבל פחות מקום. בבדיקה של PDkef חמישה, עשרה ועשרים עמודים סרוקים נכנסו ליעד של 500KB, אבל ב-20 עמודים הטקסט כבר רך.
  - question: 'כמה עמודים סרוקים נכנסים ב-500KB וקריאים?'
    answer: >-
      בבדיקה שלנו חמישה עמודים נשארו חדים, עשרה נשארו קריאים בטקסט מעט רך, ועשרים נכנסו אבל רכים בבירור. סריקה אחרת תיתן תוצאה אחרת, כי זה תלוי בגודל האותיות ובכמות הטקסט בכל עמוד, אז הבדיקה היחידה שמחייבת היא על הקובץ שלכם.
  - question: 'מה המגבלה של ביטוח לאומי להעלאת מסמכים?'
    answer: >-
      לפי העמודים של ביטוח לאומי, בשליחת מסמכים 10MB לקובץ ועד 15 קבצים, בשירות אישי 5MB לקובץ, ובדין וחשבון רב שנתי 500KB לקובץ ו-10MB לכל הצרופות יחד. בדקו שוב בעמוד של השירות, כי מגבלות משתנות.
  - question: 'איך מכינים קובץ לבקשה כללית של הרשות השופטת?'
    answer: >-
      הבקשה והנספחים צריכים להישלח כקובץ PDF אחד, עד 30MB. אחדו את הקבצים עם איחוד PDF, ואם התוצאה גדולה מ-30MB כווצו אותה. סריקה של 20 עמודים שוקלת כ-8MB, כלומר היא נכנסת גם בלי כיווץ.
  - question: 'איך מכינים סריקה לדין וחשבון הרב שנתי של ביטוח לאומי?'
    answer: >-
      ביטוח לאומי מבקש לסרוק בשחור לבן ברזולוציה של עד 300 DPI, וזה נעשה בסורק או באפליקציית הסריקה. אחר כך פתחו את כיווץ PDF, בחרו "גודל מדויק" ו-500KB, והכלי יקטין את תמונות העמודים עד שהקובץ ייכנס.
  - question: 'האם הכיווץ מעלה את הקובץ לשרת?'
    answer: >-
      לא. הכיווץ רץ בדפדפן, על המכשיר שלכם. הקובץ לא יוצא ממנו, ואין צורך בחשבון. אפשר לבדוק את התוצאה לפני שמעלים אותה לאתר השירות.
  - question: 'מה קורה אם הכלי לא מצליח להגיע ליעד?'
    answer: >-
      הכלי אומר שלא הצליח ומציג את התוצאה הקטנה ביותר שמצא, עם הגודל שלה. אז אפשר לפצל את הקובץ לכמה קבצים אם המגבלה היא לקובץ, לסרוק מחדש בשחור לבן, או להפוך עמודים לתמונות אם אפשר לוותר על טקסט שניתן לסימון.
