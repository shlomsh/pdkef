    kicker: 'הדפסה וסריקה'
    heading: 'הדפסה, חתימה וסריקה הן עקיפה — לא ברירת מחדל'
    blocks:
      - kind: 'prose'
        text: 'אם נדרש רק מסמך מודפס עם חתימה ידנית, הדפסה וסריקה הן אפשרות, אך הן מוסיפות זמן ועלולות לפגוע באיכות ובאפשרות לחפש טקסט. אין צורך בכך כדי להוסיף חתימה נראית לעין ל‑PDF.'
      - kind: 'prose'
        text: 'חתימה שמציירים או מקלידים היא חתימה אלקטרונית נראית לעין, לא חתימה דיגיטלית מבוססת תעודה. אם מבקשים במפורש תעודה דיגיטלית או חתימה מוסמכת, יש לברר עם הגוף המבקש מה נדרש.'
faq:
  - question: 'האם צריך להתקין תוכנה ב‑Windows כדי לחתום על PDF?'
    answer: 'לא. אפשר לפתוח את הכלי בדפדפן, לבחור קובץ מהמחשב ולהוריד עותק לאחר המילוי.'
  - question: 'אם מציג ה‑PDF כבר מאפשר לצייר, האם זה מספיק?'
    answer: 'לסימון פשוט ייתכן שכן. במילוי טופס, הצבת טקסט ותיבות או עבודה על סריקה, ייתכן שתזדקקו לכלי שמאפשר שליטה נוספת.'
  - question: 'האם עדיין צריך להדפיס, לחתום ולסרוק?'
    answer: 'לא כדי להוסיף חתימה אלקטרונית נראית לעין. הדפסה וסריקה הן בחירה אפשרית, אך אינן הכרחיות ויכולות להפוך את הדף לתמונה.'
  - question: 'האם זה עובד גם ב‑Chrome וגם ב‑Edge?'
    answer: 'המדריך אינו טוען שבדקנו דפדפנים מסוימים. בדקו את פתיחת הקובץ, העריכה וההורדה בדפדפן ובגרסת Windows שלכם לפני שימוש קריטי.'
  - question: 'אפשר לחתום במסך מגע או בעט במקום בעכבר?'
    answer: 'אפשר להשתמש בהתקן הקלט שהמחשב והדפדפן מזהים. מומלץ להגדיל את הדף ולבדוק את החתימה לפני ההורדה.'
  - question: 'לאן נשמר הקובץ החתום?'
    answer: 'הדפדפן מוריד את העותק למיקום ההורדות המוגדר או למיקום שתבחרו. המקור אינו מוחלף אוטומטית.'
