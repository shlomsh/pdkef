subhead: 'אפשר לבחור PDF מהמחשב, למלא אותו, להוסיף חתימה ולהוריד עותק חדש. כלי הציור שבמציג PDF עשוי להספיק להערה קטנה, אך אינו זהה למילוי כל סוגי הטפסים.'
