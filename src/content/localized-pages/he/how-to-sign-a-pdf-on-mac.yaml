faq:
  - question: 'האם אני צריך Preview או Adobe Acrobat כדי לחתום ב‑Mac?'
    answer: 'לא בהכרח. אפשר לבחור קובץ מקומי בדפדפן ולהוסיף חתימה או טקסט. Preview עשוי להיות מספיק לחתימה פשוטה.'
  - question: 'Preview כבר מאפשר לי לחתום. למה להשתמש במשהו אחר?'
    answer: 'אין צורך להחליף אותו אם הוא פותר את המשימה. כלי מילוי מועיל בעיקר כאשר צריך להוסיף תוכן במקומות רבים או לעבוד על טופס שטוח.'
  - question: 'אפשר לצייר חתימה באמצעות משטח העקיבה?'
    answer: 'אפשר להשתמש באמצעי הקלט הזמינים במחשב, או לבחור להקליד או להעלות תמונת חתימה. בדקו את התוצאה לפני שליחה.'
  - question: 'האם זה עובד ב‑Safari או רק ב‑Chrome?'
    answer: 'הכלי פועל בדפדפן, אך מדריך זה אינו מאשר תאימות לכל דפדפן או גרסה. אם מסמך חשוב, בדקו את העבודה וההורדה בסביבתכם.'
  - question: 'לאן נשמר ה‑PDF החתום?'
    answer: 'הדפדפן מבצע את ההורדה למיקום שבחרתם או למיקום ההורדות המוגדר בו. מומלץ לתת לקובץ שם ברור לפני שליחה.'
  - question: 'אפשר להתחיל במחשב ולהמשיך ב‑iPhone?'
    answer: 'אין סנכרון אוטומטי בין מכשירים. הורידו את העותק הנוכחי והעבירו אותו באופן שבחרתם אם תרצו להמשיך במכשיר אחר.'
