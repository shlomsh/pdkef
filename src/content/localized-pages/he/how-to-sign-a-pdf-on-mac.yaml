    blocks:
      - kind: 'prose'
        text: 'אם המסמך דורש רק חתימה אחת, Preview בדרך כלל הוא הנתיב הקצר ביותר. הוסיפו חתימה ושמרו עותק, בלי להחליף את המקור.'
      - kind: 'prose'
