pageId: 'open-source-pdf-editor'
locale: 'he'
status: 'draft'
sourceVersion: '2026-08-28'
title: 'עורך PDF חינמי בקוד פתוח | PDkef'
description: 'עורך PDF חינמי בקוד פתוח וברישיון MIT, שפועל בדפדפן. למדו איך לבדוק עיבוד מקומי, היכן לראות את הקוד ואיך להריץ עותק עצמאי.'
breadcrumb: 'קוד פתוח'
icon: 'Code2'
kicker: 'ברישיון MIT'
h1: 'עורך PDF חינמי בקוד פתוח'
subhead: 'כלי ה‑PDF פועלים בדפדפן והקוד שלהם גלוי. אפשר לבדוק את הארכיטקטורה, את רישיון ה‑MIT ואת האפשרות לבנות ולהגיש עותק עצמאי.'
primaryCta:
  href: '/edit-pdf/'
  label: 'ניסיון בעורך ה‑PDF'
sections:
  - sketch: 'arcs'
    icon: 'Code2'
    iconPos: 'tr'
    kicker: 'למה קוד פתוח'
    heading: '"אנחנו לא רואים את הקבצים" קל לומר'
    blocks:
      - kind: 'prose'
        text: 'כלי PDF מקוון יכול לעבד קובץ בשרת או במכשיר. מבחוץ, טענות פרטיות לבדן אינן מראות מה קורה בפועל, ולכן חשוב לקרוא מדיניות ולבדוק את ההתנהגות המתאימה לרמת הרגישות של המסמך.'
      - kind: 'prose'
        text: 'הקוד של PDkef זמין ב‑<a href="https://github.com/shlomsh/pdkef" target="_blank" rel="noopener noreferrer">GitHub</a> תחת רישיון MIT. אפשר לבדוק אותו או להריץ עותק עצמאי; אין צורך לקרוא קוד כדי להשתמש בכלי.'
  - variant: 'highlight'
    sketch: 'rings'
    icon: 'WifiOff'
    iconPos: 'br'
    kicker: 'בדיקה מעשית'
    heading: 'בדקו עיבוד מקומי במצב לא מקוון'
    blocks:
      - kind: 'prose'
        text: 'לאחר שהעמוד והנכסים הדרושים נטענו, אפשר לבדוק פעולה עם הרשת כבויה. בדיקה זו אינה מבטיחה שכל אתר יהיה זמין ללא רשת, כי היא תלויה במטמון ובדפדפן.'
      - kind: 'steps'
        items:
          - '<strong>פתחו כלי והמתינו לטעינה מלאה</strong> בזמן שיש חיבור.'
          - '<strong>עברו למצב לא מקוון</strong> בעזרת הגדרות המכשיר או כלי הפיתוח של הדפדפן.'
          - '<strong>נסו לערוך קובץ בדיקה ולהוריד אותו.</strong> ודאו שהקובץ הסופי נפתח כראוי.'
      - kind: 'prose'
        text: 'עיבוד PDF מקומי משתמש במעבד של המכשיר. אין להבטיח פעולה לא מקוונת לפני טעינה מוצלחת או לאחר ניקוי המטמון.'
      - kind: 'prose'
        text: 'מדיניות האבטחה של האתר מגבילה חיבורים, אך אבטחה היא שכבות של בקרות ובדיקות — לא תחליף לבדיקה של הגרסה שבה אתם משתמשים.'
  - sketch: 'grid'
    icon: 'GitFork'
    iconPos: 'tr'
    kicker: 'לבנות עותק משלכם'
    heading: 'מה נמצא מתחת לממשק ואיך מריצים אותו'
    blocks:
      - kind: 'prose'
        text: 'הפרויקט משתמש בספריות קוד פתוח, ובהן pdf.js לקריאה ורינדור, pdf-lib לכתיבה, Astro ו‑Preact לממשק ו‑signature_pad לציור. רשימת הרישיונות המלאה מופיעה ב‑<a href="/licenses/">עמוד הרישיונות</a>.'
      - kind: 'prose'
        text: 'אפשר לשכפל את המאגר, לבנות את האתר ולהגיש את תיקיית הפלט משרת סטטי. לפני שימוש ארגוני, בדקו בעצמכם את הקוד, ההגדרות והגרסה שנבנית אצלכם.'
faq:
  - question: 'באיזה רישיון מופץ PDkef?'
    answer: 'קוד הפרויקט מופץ ברישיון MIT. רישיונות של ספריות צד שלישי מפורטים בעמוד הרישיונות.'
  - question: 'איך אפשר לבדוק שהקבצים אינם מועלים?'
    answer: 'אפשר לעיין בקוד ולבצע בדיקה לא מקוונת לאחר טעינה מלאה, עם קובץ בדיקה. תוצאה תלויה במטמון ובדפדפן, ולכן אין להסיק ממנה הבטחה לכל סביבה.'
  - question: 'אפשר לארח עותק עצמאי?'
    answer: 'כן. הפרויקט הסטטי מאפשר לבנות עותק ולהגישו משרת מתאים. בדקו את הוראות המאגר ואת הגרסה שאתם בוחרים להפעיל.'
  - question: 'אפשר לתרום או לדווח על תקלה?'
    answer: 'כן. המאגר הציבורי ב‑GitHub הוא המקום המתאים לדיווחי תקלות, דיונים ותרומות.'
  - question: 'האם הגרסה החינמית מוגבלת לעומת גרסה בתשלום?'
    answer: 'העמוד אינו מציג שכבת מנוי או תקופת ניסיון עבור הכלים המתוארים. בדקו את הממשק והמדיניות העדכניים לפני שימוש.'
