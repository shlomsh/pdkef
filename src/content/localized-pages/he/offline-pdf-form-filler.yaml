pageId: 'offline-pdf-form-filler'
locale: 'he'
status: 'draft'
sourceVersion: '2026-08-28'
title: 'מילוי טופס PDF ללא אינטרנט | PDkef'
description: 'מלאו PDF מקומית בדפדפן, גם כשאין קליטה לאחר טעינה ומטמון מוצלחים. הוסיפו טקסט, סימנו תיבות והבינו את מגבלות הטיוטות והטפסים הסרוקים.'
breadcrumb: 'מילוי ללא אינטרנט'
icon: 'WifiOff'
kicker: 'עיבוד מקומי'
h1: 'מילוי טופס PDF ללא חיבור לאינטרנט'
subhead: 'המסמך מעובד במכשיר, אך עבודה ללא רשת אינה מובטחת עד שהדף והנכסים הדרושים נטענו ונשמרו במטמון. כאן מוסבר מה אפשר למלא ומה לבדוק מראש.'
primaryCta:
  href: '/sign/'
  label: 'מילוי PDF עכשיו'
sections:
  - sketch: 'arcs'
    icon: 'WifiOff'
    iconPos: 'tr'
    kicker: 'שתי בעיות שונות'
    heading: 'למה רוב כלי המילוי נשברים ללא קליטה'
    blocks:
      - kind: 'prose'
        text: 'כלי אחד עשוי להזדקק לרשת כדי להעלות ולעבד את הקובץ; כלי אחר עשוי לעבד מקומית אך עדיין להזדקק לנכסי האתר שטרם נטענו. לכן "עובד ללא אינטרנט" דורש בדיקה מעשית לאחר טעינה.'
      - kind: 'prose'
        text: 'פתחו את הכלי מראש כשיש חיבור, השלימו טעינה, ואז בדקו עם קובץ שאינו רגיש. אם המטמון חסר או נמחק, ייתכן שהעמוד לא יהיה זמין ללא רשת.'
  - variant: 'highlight'
    sketch: 'rings'
    icon: 'Type'
    iconPos: 'br'
    kicker: 'הקלדה על הדף'
    heading: 'הוספת טקסט ישירות לדף'
    blocks:
      - kind: 'steps'
        items:
          - '<strong>פתחו את <a href="/sign/">Sign &amp; Fill</a></strong> ובחרו את ה‑PDF מהמכשיר.'
          - '<strong>הוסיפו טקסט, סימנים או חתימה</strong> במקומות הנדרשים; הגדילו את הדף למשימות קטנות.'
          - '<strong>הורידו ובדקו את העותק.</strong> שמרו אותו במקום שתוכלו למצוא גם ללא חיבור.'
      - kind: 'prose'
        text: 'טקסט שמוצב על הדף אינו בהכרח עדכון של שדות AcroForm המאוחסנים בתוך ה‑PDF. אם גורם דורש נתוני שדות מסוימים, בדקו עמו מה הוא מקבל.'
  - sketch: 'grid'
    icon: 'FileText'
    iconPos: 'cl'
    kicker: 'סוג המסמך'
    heading: 'לא משנה איזה PDF קיבלתם — אבל היכולות כן משתנות'
    blocks:
      - kind: 'prose'
        text: 'טופס יכול לכלול שדות אמיתיים, או להיות סריקה שטוחה ללא שדות. בשני המקרים אפשר להציב תוכן נראה לעין, אך סריקה אינה הופכת אוטומטית לטופס עם נתונים מובנים.'
      - kind: 'columns'
        items:
          - icon: 'FormInput'
            title: 'שדות קיימים'
            body: 'ייתכן שאפשר למלאם בהתאם למבנה הקובץ ולתמיכת הדפדפן.'
          - icon: 'ScanText'
            title: 'סריקה שטוחה'
            body: 'אפשר להציב עליה טקסט וסימנים, אך אין בה שדות PDF שנשמרים כנתונים.'
          - icon: 'CheckSquare'
            title: 'תיבות'
            body: 'אפשר להוסיף סימן נראה לעין; בדקו את המיקום לפני הורדה.'
      - kind: 'prose'
        text: 'עבור מסמך רגיש, הורידו ובדקו את הקובץ הסופי; אל תבלבלו בין טקסט מצויר על הדף לבין נתונים שהטופס שומר בשדות פנימיים.'
  - sketch: 'waves'
    icon: 'Download'
    iconPos: 'tr'
    kicker: 'טעינה אחת לפני הנסיעה'
    heading: 'לאחר טעינה, אפשר לנסות לעבוד ללא רשת'
    blocks:
      - kind: 'prose'
        text: 'העיבוד נעשה בדפדפן ובמכשיר, ולא נשלח לשרת לצורך עריכה. פעולה ללא רשת תלויה בנכסים שכבר נשמרו במטמון ובאחסון שהדפדפן מאפשר.'
      - kind: 'prose'
        text: 'בדקו מראש מצב לא מקוון וקובץ לדוגמה. אין הבטחה שהנכסים יהיו במטמון בכל מכשיר, אחרי ניקוי נתונים או לפני ביקור ראשון.'
faq:
  - question: 'האם צריך אינטרנט כדי למלא טופס PDF?'
    answer: 'אחרי טעינה מוצלחת ומטמון זמין אפשר לעיתים לעבוד ללא רשת. בביקור ראשון או ללא מטמון, נדרש חיבור כדי לטעון את הכלי.'
  - question: 'אפשר למלא סריקה שאין בה שדות?'
    answer: 'אפשר להציב טקסט, סימנים וחתימה על דף סרוק. המסמך עדיין אינו מקבל שדות PDF אמיתיים רק משום שהוצב עליו טקסט.'
  - question: 'האם הטקסט נכנס לשדות האמיתיים של הטופס?'
    answer: 'לא תמיד. טקסט שמוצב על הדף הוא תוכן נראה לעין; הוא אינו בהכרח אותו דבר כמו נתונים בשדות AcroForm. בדקו דרישות מיוחדות עם מקבל הטופס.'
  - question: 'אפשר לסמן תיבות ולא רק להקליד?'
    answer: 'אפשר להוסיף סימן נראה לעין באזור המתאים. הגדילו את הדף ובדקו את המיקום בעותק שהורד.'
  - question: 'האם ה‑PDF מועלה בזמן המילוי?'
    answer: 'תוכן המסמך מעובד במכשיר ולא נשלח לשרת לעיבוד. זה אינו אומר בהכרח שאין באתר מדידות תפעוליות אנונימיות.'
  - question: 'מה קורה אם הדפדפן קורס?'
    answer: 'טיוטה מקומית עשויה לעזור לשחזר עבודה, אך היא זמנית ואינה גיבוי מובטח. הורידו עותקים של עבודה חשובה.'
