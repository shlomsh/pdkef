sourceHash: 'fnv1a64:a8b318b0afd08dba'
title: 'הקטנת תמונה לטופס: גודל תמונה בקילובייטים | PDkef'
description: 'מכסה של 150KB לתמונה לכרטיס סטודנט, 800KB לטופס בקופת חולים. מה קובע אם התמונה תיכנס, מה הכלי עושה, ומה לא, עם מדידות אמיתיות ומגבלות ממקורות רשמיים.'
breadcrumb: 'גודל תמונה לטופס'
icon: 'FormInput'
kicker: 'קודם פיקסלים, אחר כך איכות'
h1: 'הקטנת תמונה לטופס: גודל תמונה וחתימה'
subhead: 'טופס באתר של אוניברסיטה, קופת חולים או גוף ממשלתי מגביל לא פעם את גודל הקובץ, ולפעמים גם את הסוג שלו, בעוד שתמונה מהטלפון מתחילה ב-3 עד 6MB. כך מבינים מה באמת קובע אם התמונה שלכם תיכנס.'
primaryCta:
  href: '/compress-image/'
  label: 'פתחו את כלי כיווץ התמונה'
sections:
  - variant: 'highlight'
    sketch: 'grid'
    icon: 'ScanText'
    iconPos: 'tr'
    kicker: 'שני הדברים שקובעים'
    heading: 'קודם מידות בפיקסלים, אחר כך איכות JPEG'
    blocks:
      - kind: 'prose'
        text: 'תמונה היא קובץ אחד ולא ספירת עמודים, ולכן מכסה קטנה בדרך כלל אפשר להשיג, בניגוד לסריקה של עשרה עמודים שמתבקשת להיכנס לאותו מספר. מה שקובע אם התמונה באמת תגיע ליעד הם שני דברים, בסדר הזה: מידות התמונה בפיקסלים, ואחר כך איכות ה-JPEG שבה היא נשמרת.'
      - kind: 'prose'
        text: 'מצלמת טלפון מצלמת במשהו כמו 4000 על 3000 פיקסלים. בגודל כזה שום הורדת איכות לא תביא אתכם קרוב ל-150KB, כי קובץ JPEG גדול כל כך עדיין נושא הרבה מאוד מידע גם בהגדרה הגסה ביותר. אותה תמונה, כשמקטינים אותה קודם בפיקסלים, נכנסת ליעד קטן בלי מאמץ, כי יש הרבה פחות מידע לשמור. קודם מקטינים את התמונה עצמה, ואז האיכות משלימה את השאר.'
  - sketch: 'rings'
    icon: 'AlertTriangle'
    iconPos: 'cl'
    kicker: 'מה הכלי לא עושה'
    heading: 'כיווץ תמונה לא חותך את התמונה למידות מדויקות'
    blocks:
      - kind: 'prose'
        text: '<a href="/compress-image/">כיווץ תמונה</a> מגיע ליעד ב-KB בכך שהוא עובר על סולם של גדלים, ובכל שלב מחפש את איכות ה-JPEG המתאימה, ומנסה כל גודל לפני שהוא מוותר על עוד פרטים. הוא לא חותך ולא משנה לרוחב וגובה שתבחרו בעצמכם. התפקיד שלו הוא להכניס קובץ מתחת למגבלת גודל, לא להתאים לרשת פיקסלים.'
      - kind: 'prose'
        text: 'אם הטופס שלכם מציין מידות בפיקסלים וגם מגבלת גודל, חתכו קודם למידות האלה, בכלי החיתוך של הטלפון או בכל תוכנת עריכה, ורק אחר כך הקטינו את הקובץ החתוך כאן. חיתוך אחרי הכיווץ לא שומר על הגודל שהגעתם אליו: כלי החיתוך שומר את הקובץ מחדש באיכות משלו, ותצטרכו לכווץ פעם נוספת. שורות החתימה והפורטרט במדידות למטה, ביעד של 10KB, מראות בדיוק כמה זה עולה בחדות.'
  - sketch: 'waves'
    icon: 'FileText'
    iconPos: 'br'
    kicker: 'מה חוזר אליכם'
    heading: 'מה כיווץ תמונה משנה, בפשטות'
    blocks:
      - kind: 'prose'
        text: 'הקובץ שיוצא הוא תמיד JPEG, בלי קשר לפורמט שהתחלתם ממנו. PNG שקוף מושטח קודם על רקע לבן, כי ל-JPEG אין שקיפות. בשמירה מחדש נעלם גם מידע ה-EXIF, כולל המיקום שמצלמת הטלפון רושמת לא פעם, דגם המצלמה וזמן הצילום. צילום מסך או תמונה של דף כתוב יכולים להראות פגמים סביב האותיות כשהיעד קטן, יותר מתמונת פורטרט רגילה. אם הקובץ כבר קטן מהיעד, הוא חוזר בדיוק כמו שהיה.'
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'ListChecks'
    iconPos: 'tr'
    kicker: 'מגבלות אמיתיות'
    heading: 'כמה מגבלות גודל של גופים בישראל'
    blocks:
      - kind: 'prose'
        text: 'אלה מספרים שנבדקו באתר של כל גוף ב-22 באוקטובר 2026. מגבלות משתנות, ולכן בדקו תמיד את הערך העדכני בטופס עצמו.'
      - kind: 'checklist'
        items:
          - '<strong>האוניברסיטה הפתוחה, תמונה לכרטיס סטודנט:</strong> קובץ JPG עד 150KB. <a href="https://www.openu.ac.il/registration/guidelines/pages/studentid.aspx" target="_blank" rel="noopener noreferrer">הדף באתר</a>.'
          - '<strong>מכבי, טופס פניות מנהליות:</strong> עד 800KB, בקבצי txt, pdf, jpg או gif. זה נכון לטופס הזה בלבד. <a href="https://www.maccabi4u.co.il/forms/administrative_issues/" target="_blank" rel="noopener noreferrer">הדף באתר</a>.'
          - '<strong>ביטוח לאומי, שירות אישי:</strong> עד 5MB לקובץ, בקבצי JPG, PNG, TIF או PDF. <a href="https://www.btl.gov.il/About/faq/TroubleShooting/FaqIshi/Pages/%D7%9B%D7%99%D7%A6%D7%93--%D7%A0%D7%99%D7%AA%D7%9F-%D7%9C%D7%A9%D7%9C%D7%95%D7%97-%D7%9E%D7%A1%D7%9E%D7%9B%D7%99%D7%9D-%D7%91%D7%A9%D7%99%D7%A8%D7%95%D7%AA-%D7%90%D7%99%D7%A9%D7%99.aspx" target="_blank" rel="noopener noreferrer">הדף באתר</a>.'
          - '<strong>ביטוח לאומי, שליחת מסמכים:</strong> עד 10MB לקובץ ועד 15 קבצים, בפורמטים JPG, PNG, TIFF, BMP או PDF. <a href="https://www.btl.gov.il/About/faq/TroubleShooting/FaqGeneral/Pages/%D7%90%D7%99%D7%9A-%D7%A0%D7%99%D7%AA%D7%9F-%D7%9C%D7%A9%D7%9C%D7%95%D7%97-%D7%9C%D7%9B%D7%9D-%D7%9E%D7%A1%D7%9E%D7%9B%D7%99%D7%9D.aspx" target="_blank" rel="noopener noreferrer">הדף באתר</a>.'
          - '<strong>משרד הביטחון, פיקדון:</strong> עד 10MB לקובץ ועד 10 קבצים, בפורמטים PDF, PNG, TIFF או JPG. <a href="https://www.hachvana.mod.gov.il/GrantAndDeposit/DepositUpTo5/Pages/education.aspx" target="_blank" rel="noopener noreferrer">הדף באתר</a>.'
      - kind: 'prose'
        text: 'בכל החמישה מותר JPG, וכלי הכיווץ מוציא JPEG, ולכן הקובץ שיוצא ממנו מתאים. תמונה של 3 עד 6MB שנשלחת לביטוח לאומי היא בדיוק המקרה שבו כדאי להקטין, ובמקרה של האוניברסיטה הפתוחה היעד הוא 150KB. אם צריך להקטין גם מסמך סרוק, <a href="/he/compress/">כיווץ PDF</a> עושה את זה.'
  - sketch: 'grid'
    icon: 'HardDriveDownload'
    iconPos: 'tr'
    kicker: 'נמדד, לא מובטח'
    heading: 'תמונות אמיתיות, דרך כלי כיווץ התמונה'
    blocks:
      - kind: 'table'
        caption: 'כל שורה רצה דרך כלי כיווץ התמונה של PDkef בדפדפן אמיתי, קובץ אחד לכל יעד. שש השורות הראשונות נמדדו ב-12.9.2026, השתיים האחרונות ב-22.10.2026.'
        headers: ['מסמך ויעד', 'גודל מקורי', 'תוצאה', 'האם שמיש?']
        rows:
          - ['פורטרט (סלפי מהטלפון, JPEG), ביעד 50KB', '867KB', '50.1KB', 'כן, חד, לא ניתן להבחין מהמקור בגודל של מסך טלפון']
          - ['אותו פורטרט, ביעד 20KB', '867KB', '19.5KB, 1088x1932', 'כן, יפה, ריכוך קל רק בהגדלה']
          - ['אותו פורטרט, ביעד 10KB', '867KB', '9.8KB, 725x1288', 'הפנים ניכרים אבל רכים ומרובעים בשיער ובעור; שמיש כתמונת פנים, אבל גדול בהרבה ממידות של תמונה לטופס']
          - ['חתימה על נייר, מצולמת בלי חיתוך (JPEG), ביעד 20KB', '589KB', '20.4KB, 1088x1932', 'כן, קריאה, הקווים רכים']
          - ['אותה חתימה, ביעד 10KB', '589KB', '10.1KB, 725x1288', 'קריאה אבל רכה, עם הילה קלה סביב הקווים; רוב ה-10KB הלכו על הנייר הריק ולא על החתימה']
          - ['מכתב מודפס בעמוד אחד, מצולם (JPEG), ביעד 50KB', '1.15MB', '48.9KB, 1088x1932', 'כן, קריא לגמרי עם ריכוך קל']
          - ['תמונת נוף (עותק PNG, 1210x680), ביעד 150KB', '1.2MB', '145.0KB, 1210x680', 'כן, כמעט לא ניתן להבחין מהמקור בגודל מלא']
          - ['אותה תמונה, ביעד 800KB', '1.2MB', '280.1KB, 1210x680', 'כן; הכלי לא ניפח את הקובץ כדי למלא את היעד, והתמונה נשארה בגודל המלא']
      - kind: 'prose'
        text: 'כך זה נראה על תמונה אמיתית מטלפון: אותה תמונה כפי שצולמה, ואחרי הקטנה ל-20KB. משמאל המקור, מימין הקובץ של 20KB, וזה הקובץ שהכלי הוציא בפועל, לא הדמיה. הסתכלו על הרכסים הרחוקים מימין: ב-20KB האובך נהיה מנוקד וסגלגל, בעוד האגם והיער עדיין קריאים. זה המחיר האמיתי ביעד של 20KB על נוף רחב; לתמונת פנים לטופס יש הרבה פחות פרטים לאבד.'
      - kind: 'compareFigure'
        beforeSrc: '/images/photo-and-signature-size-for-forms/estany-llat-before.webp'
        afterSrc: '/images/photo-and-signature-size-for-forms/estany-llat-20kb.jpg'
        beforeLabel: 'המקור'
        afterLabel: '20KB'
        alt: 'אגם הרים בפירנאים כשהוא נראה מרכס, עם יער ופסגות מאחוריו, מוצג כתמונה המקורית משמאל וכאותה תמונה מכווצת ל-20KB מימין'
        width: 1210
        height: 680
        caption: '<strong>תמונה של 2.05MB ממצלמת Google Pixel 8a, ברזולוציה 4032x2268, שכווצה ל-19KB ב-1210x680.</strong> החצי הימני הוא הקובץ שכלי כיווץ התמונה הוציא, בית אחר בית, ותג המיקום של הטלפון נעלם ממנו. לא תמונה שלי (שלי נשארות פרטיות): תמונה בנחלת הכלל של Alan Mattingly מ-Wikimedia Commons, CC0.'
      - kind: 'prose'
        text: 'שתי שורות תמונת הנוף נמדדו על עותק ה-PNG של התמונה שמוצגת למעלה, בגודל 1210x680 ו-1.2MB, ולא על קובץ הטלפון המקורי; צילום ישיר מהטלפון גדול בהרבה, ולכן השורות האלה מראות רק מה קורה לקובץ בגודל הזה. בשתיהן הכלי חיפש קודם איכות בגודל המלא, ובשתיהן מצא התאמה בלי לרדת בסולם הגדלים. ביעד של 800KB האיכות הגיעה לתקרה שלו, ולכן התוצאה קטנה בהרבה מהיעד.'
      - kind: 'prose'
        text: 'שורת החתימה היא ההוכחה הברורה ביותר להמלצה לחתוך קודם. ב-10KB כמעט כל התקציב הלך על הנייר הריק שסביב הקווים, כי הכלי לא יודע שהחתימה היא החלק היחיד שחשוב, הוא רק מקטין את כל התמונה, ואף פעם לא חותך. אותו הדבר קורה לפורטרט של 10KB: התוצאה ניכרת הרבה מעבר למידות של תמונה לטופס, וחיתוך קודם למידות הנכונות היה מוציא את אותם 10KB על הרבה פחות פיקסלים, וחד במקום רך.'
  - sketch: 'rings'
    icon: 'CheckSquare'
    iconPos: 'tl'
    kicker: 'אם זה עדיין לא נכנס'
    heading: 'מה לנסות לפני שמוותרים'
    blocks:
      - kind: 'checklist'
        items:
          - '<strong>חתכו קודם.</strong> אם הטופס מציין מידות בפיקסלים וגם גודל, חתכו למידות האלה לפני הכיווץ ולא אחריו.'
          - '<strong>בדקו שהמגבלה באמת כזו.</strong> הנחיות בטפסים מועתקות לפעמים ממחזור קודם; חפשו את הערך הנוכחי לפני שמניחים שהקובץ חייב להגיע למספר הקטן ביותר שמצאתם.'
          - '<strong>בחרו רקע פשוט.</strong> רקע לבן או בהיר מאחורי פורטרט או חתימה נותן ל-JPEG הרבה פחות פרטים לשמור, באותה איכות נראית לעין.'
          - '<strong>צלמו באור טוב ואחיד.</strong> תמונה רועשת באור חלש מכריחה את ה-JPEG להשקיע מהתקציב בגרעיניות במקום בנושא, וזה הדבר הראשון שהולך לאיבוד ביעד קטן.'
  - variant: 'highlight'
    sketch: 'grid'
    icon: 'WifiOff'
    iconPos: 'br'
    kicker: 'חינם, פרטי, בלי חשבון'
    heading: 'נסו על התמונה שלכם לפני שחותכים משהו'
    blocks:
      - kind: 'prose'
        text: '<a href="/compress-image/">פתחו את כלי כיווץ התמונה</a>, הזינו את היעד שהטופס שלכם באמת מבקש ובדקו את התוצאה. התמונה לא עוזבת את המכשיר, ולכן אין המתנה להעלאה כדי לגלות אם היא נכנסת, ואין חשבון לפתוח קודם. אם הטופס מגביל גם מסמך סרוק, <a href="/he/pdf-wont-compress-to-100kb/">אותה שאלה על קובצי PDF</a> מסבירה את החצי הזה, ו<a href="/how-to-scan-a-document-to-pdf/">איך לסרוק מסמך ל-PDF</a> מראה איך יוצרים את הסריקה מלכתחילה.'
faq:
  - question: 'מה קובע אם אפשר לכווץ תמונה לגודל קטן?'
    answer: 'שני דברים, בסדר הזה: מידות התמונה בפיקסלים, ואחר כך איכות ה-JPEG. תמונה גדולה מהטלפון צריכה קודם להתכווץ בפיקסלים לפני שהורדת איכות לבדה תגיע ליעד קטן.'
  - question: 'האם כיווץ תמונה משנה אותה למידות מדויקות שהטופס מבקש?'
    answer: 'לא. הכלי מחפש את שילוב הגודל והאיכות הקטן ביותר שנכנס ליעד ב-KB, לא רוחב וגובה מסוימים. אם הטופס מציין מידות בפיקסלים וגם גודל, חתכו קודם בעצמכם ואז כווצו את הקובץ החתוך.'
  - question: 'מה מגבלת הגודל של תמונה לכרטיס סטודנט באוניברסיטה הפתוחה?'
    answer: 'לפי דף ההנחיות של האוניברסיטה הפתוחה, התמונה לכרטיס הסטודנט היא קובץ JPG עד 150KB. בדקו את הדף עצמו לפני ההעלאה, כי הערכים עלולים להשתנות.'
  - question: 'מה פורמט הקובץ שיוצא מהכלי?'
    answer: 'תמיד JPEG, בלי קשר למה שהתחלתם ממנו. PNG שקוף מושטח קודם על רקע לבן, כי JPEG לא מכיל שקיפות. קובץ שכבר קטן מהיעד נשאר כמו שהוא, כולל הפורמט המקורי.'
  - question: 'האם כיווץ התמונה מוחק ממנה מידע?'
    answer: 'כן. שמירה מחדש כ-JPEG מורידה את ה-EXIF, כולל המיקום שהטלפון רושם, דגם המצלמה וזמן הצילום. זו תוצאה של ציור מחדש של הפיקסלים ולא ניקוי מכוון, ולכן אל תסתמכו על זה אם אתם דווקא צריכים את המידע.'
  - question: 'האם חתימה סרוקה או תמונה של מסמך תיראה מטושטשת ביעד קטן?'
    answer: 'יכול להיות. דחיסת JPEG מתאימה לתמונות, ויעד קטן עלול להשאיר פגמים סביב קצוות חדים כמו כתב יד, טקסט או קווים דקים, יותר מאשר בפורטרט רגיל. אם התוצאה גסה מדי, נסו יעד גדול יותר או סריקה נקייה יותר.'
  - question: 'מה מגבלות הקבצים לשליחת מסמכים לביטוח לאומי?'
    answer: 'לפי הסברי האתר של ביטוח לאומי, בשירות אישי אפשר לשלוח קבצי JPG, PNG, TIF או PDF עד 5MB כל אחד, ובשליחת מסמכים כללית עד 10MB לקובץ ועד 15 קבצים. מומלץ לבדוק את הדף העדכני.'
  - question: 'מה לעשות אם התמונה עדיין לא נכנסת למגבלה?'
    answer: 'חתכו קודם למידות שהטופס מבקש, ודאו שהמגבלה שמצאתם היא העדכנית, בחרו רקע פשוט וצלמו באור טוב ואחיד כדי שיהיה ל-JPEG פחות רעש לשמור. ארבעת אלה סוגרים בדרך כלל את הפער בתמונה שחורגת קצת.'
