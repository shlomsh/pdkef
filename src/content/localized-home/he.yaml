title: 'כלי PDF חינמיים - פרטי, מקומי, בלי הרשמה | PDkef'
description: 'חבילת כלי PDF חינמית וקוד פתוח שרצה כולה בדפדפן שלכם. מיזוג, חתימה, פיצול, טשטוש, כיווץ והמרה של קבצי PDF, בלי העלאה לשרת, בלי חשבון ובלי סימן מים. הקבצים שלכם לא עוזבים את המכשיר.'
h1: 'כלי PDF חינמיים שרצים על המכשיר שלכם'
h1Accent: 'על המכשיר שלכם'
subhead: 'מיזוג, חתימה, פיצול, טשטוש וכיווץ קבצי PDF. בלי הרשמה, בלי התקנה, שום דבר לא יוצא מהמכשיר שלכם.'
faq:
  - question: 'האם הכלים באמת חינמיים?'
    answer: 'כן. כל כלי חינמי לגמרי, בלי תשלום, בלי הגבלת שימוש ובלי סימני מים.'
  - question: 'צריך להירשם או ליצור חשבון?'
    answer: 'לא. בלי חשבון, בלי אימייל ובלי תקופת ניסיון. פותחים כלי ומתחילים.'
  - question: 'הקבצים שלי מועלים לשרת?'
    answer: 'לא. קובצי ה-PDF שלכם נשארים במכשיר. כל כלי פועל מקומית בדפדפן, במחשב או בנייד.'
  - question: 'האם PDkef קוד פתוח?'
    answer: 'כן. הקוד ברישיון MIT ופתוח לכל מי שרוצה לבדוק אותו, להשתמש בו או לשפר אותו.'
founderStory:
  kicker: 'למה בניתי את זה'
  heading: 'כלי PDF פשוטים, שנועדו לשיתוף'
  paragraph1: 'לבת הזוג שלי היה צריך למזג שקופיות קורס לפני מבחן, ולחתום על טופס קייטנה שהגיע בוואטסאפ. הכלים שמצאנו הגבילו את מספר העמודים, דרשו מנוי, או ביקשו להעלות מסמכים אישיים.'
  paragraph2: 'אז בניתי את PDkef. רציתי שכלי PDF יומיומיים יהיו חינמיים וזמינים לכולם, בכל מכשיר. ואז רציתי לשתף אותם.'
  paragraph3: 'הכול פועל בדפדפן שלכם. זה שומר על פרטיות הקבצים שלכם, ומאפשר לכלים להישאר זולים מספיק כדי להישאר חינמיים.'
  pills:
    - title: 'חינם לתמיד'
      subtitle: 'בלי הגבלות, בלי תפסים'
    - title: 'פרטי'
      subtitle: 'הקבצים לא עוזבים את המכשיר שלכם'
    - title: 'קוד פתוח'
      subtitle: 'בדקו את הקוד בעצמכם'
draftPersistence:
  kicker: 'פרטיות ונוחות'
  heading: 'סוגרים את הלשונית. שומרים על ההתקדמות.'
  paragraph: 'קובץ ה-PDF והעריכות שלכם נשמרים בדפדפן הזה תוך כדי העבודה. חוזרים אחרי סגירת לשונית או הפעלה מחדש של המחשב, וממשיכים מהטיוטה השמורה.'
  pill: 'נשמר אוטומטית במכשיר'
  availability: 'זמין בכלים <strong>חתימה ומילוי</strong> ו<strong>טשטוש ומחיקה</strong>. הטיוטות נשארות במכשיר הזה, וניקוי נתוני הדפדפן מוחק אותן.'
offlineInstall:
  heading: 'כלי ה-PDF שלכם, גם בלי אינטרנט'
  lead: 'התקינו את PDkef כדי לקבל מקום על מסך הבית. ברגע שכלי מוכן לעבודה לא מקוונת, תוכלו לעבוד גם בלי חיבור לאינטרנט.'
  tabs:
    - label: 'Chrome ו-Edge'
      steps:
        - 'גשו לאתר בכרום או באדג׳.'
        - 'לחצו על סמל <strong>ההתקנה</strong> (מסך עם חץ למטה) בצד שורת הכתובת.'
        - 'לחלופין, פתחו את תפריט הדפדפן (שלוש נקודות), בחרו <strong>שמירה ושיתוף</strong>, ולחצו על <strong>התקנת PDkef</strong>.'
    - label: 'Safari (iOS)'
      steps:
        - 'פתחו את האתר ב-<strong>Safari</strong> באייפון או באייפד.'
        - 'הקישו על כפתור <strong>השיתוף</strong> (ריבוע עם חץ למעלה) בסרגל הכלים.'
        - 'גללו ברשימת האפשרויות ובחרו <strong>הוספה למסך הבית</strong>.'
    - label: 'Safari (macOS)'
      steps:
        - 'פתחו את האתר ב-<strong>Safari</strong> במחשב Mac.'
        - 'לחצו על כפתור <strong>השיתוף</strong> בסרגל הכלים של Safari, בפינה הימנית העליונה.'
        - 'בחרו <strong>הוספה לדוק...</strong> מהתפריט הנפתח ולחצו על <strong>הוספה</strong>.'
