title: 'How to Sign a PDF on Windows (No Install) | PDkef'
description: >-
  Sign a PDF on Windows without printing and scanning it. Edge can draw on a page but not much more
  - here is what it covers, and how to fill the rest in Chrome or Edge, free.
breadcrumb: 'Windows'
icon: 'Monitor'
kicker: 'Windows, no install'
h1: 'How to Sign a PDF on Windows'
subhead: >-
  Windows has no equivalent of Preview, which is why signing a PDF on a PC so often ends with
  printing the page, signing it by hand, and scanning it back in. You can skip all of that in the
  browser you already have open.
primaryCta:
  href: '/sign/'
  label: 'Sign a PDF now'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'Monitor'
    iconPos: 'tr'
    kicker: 'Four steps'
    heading: 'Sign a PDF on Windows'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Open <a href="/sign/">pdkef.com/sign</a></strong> in Chrome or Edge.
          - >-
            <strong>Drag the PDF in</strong> from File Explorer, or straight out of the Downloads
            bar if it just came in by email.
          - >-
            <strong>Fill in the fields, then add your signature.</strong> Draw it with the mouse,
            trackpad, touchscreen or pen, type it in a handwriting font, or upload a photo of one
            you signed on paper.
          - >-
            <strong>Download it.</strong> The signed PDF lands in Downloads as a new file, next to
            your untouched original.
  - sketch: 'grid'
    icon: 'Monitor'
    iconPos: 'br'
    kicker: 'Edge, side by side'
    heading: 'How far Edge''s own PDF tools get you'
    blocks:
      - kind: 'prose'
        text: >-
          Edge opens PDFs by default on Windows and has a small annotation toolbar of its own. It's
          genuinely useful for marking up a document you're reviewing. It was built for annotating
          rather than for completing forms, though, and the difference shows the moment the thing in
          front of you is a scanned page with boxes to tick.
      - kind: 'compare'
        builtInLabel: 'Microsoft Edge'
        caption: >-
          Both run locally on your PC with nothing uploaded, so this is about what each one can do,
          not about privacy.
        rows:
          - task: 'Add a handwritten signature'
            builtIn: 'Freehand ink only, with the Draw pen'
            here: 'Draw it, type it, or upload a photo of one'
          - task: 'Fill a form that has real fillable fields'
            builtIn: 'Yes'
            here: 'Yes'
          - task: 'Type onto a flat or scanned form'
            builtIn: 'Possible, but sizing and alignment are fiddly'
            here: 'Click where you want it and type'
          - task: 'Tick a checkbox on a scanned form'
            builtIn: ''
            here: 'Yes'
          - task: 'Reorder or delete pages before you send it'
            builtIn: ''
            here: 'Yes'
          - task: 'Permanently remove text from a page'
            builtIn: ''
            here: 'Yes'
  - sketch: 'waves'
    icon: 'Printer'
    iconPos: 'cl'
    kicker: 'The habit worth dropping'
    heading: 'Print, sign, scan is a workaround, not a standard'
    blocks:
      - kind: 'prose'
        text: >-
          Almost nobody prefers printing a form out. It survives because Windows never shipped an
          answer to this, so it became the thing you fall back on when a deadline is closer than a
          solution. The scan that comes back is heavier, often crooked, and no longer real text,
          which matters if anyone downstream needs to search or copy from it.
      - kind: 'prose'
        text: >-
          Signing on screen keeps the file a proper PDF the whole way through. If the scan already
          happened and you're working from a photographed page, that's fine too, you can <a
          href="/image-to-pdf/">turn the photos back into a PDF</a> first and carry on from there.
faq:
  - question: 'Do I need to install any software on Windows to sign a PDF?'
    answer: >-
      No. It's a website that runs in the browser tab you already have open, so there's nothing to
      download, nothing to keep updated, and no admin password to talk a work laptop into accepting.
  - question: 'Edge can already draw on a PDF. Isn''t that enough?'
    answer: >-
      It is, for a quick scribble. Edge's Draw pen is freehand ink, so a signature comes out as
      whatever your mouse managed, and there's no way to type into a scanned form or tick a real
      checkbox. If the document is a form rather than a page to initial, you'll hit that ceiling
      quickly.
  - question: 'Do I still need to print, sign, and scan it back in?'
    answer: >-
      No, and that's mostly what this page exists to spare you. Printing and scanning is the
      standard Windows workaround because nothing in Windows itself signs a PDF, not because the
      result is any better. A signature added on-screen is cleaner and stays a real, selectable PDF.
  - question: 'Does this work in both Chrome and Edge?'
    answer: >-
      Yes, and in Firefox. There is no browser-specific setup, and nothing to enable first.
  - question: 'Can I sign with a touchscreen or a pen instead of a mouse?'
    answer: >-
      Yes. Drawing works the same with a mouse, a trackpad, a touchscreen, or a stylus. On a Surface
      or any pen-enabled laptop, the pen gives by far the most natural-looking signature.
  - question: 'Where does the signed file go?'
    answer: >-
      To your Downloads folder, as a new file alongside the original. Nothing overwrites what you
      started with.
