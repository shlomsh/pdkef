title: 'How to Sign a PDF on a Windows Computer for Free | PDkef'
description: >-
  Sign a PDF on your Windows computer for free in Chrome or Edge. Add text and a signature, then
  download it. No signup, watermark, or document upload.
breadcrumb: 'Windows'
icon: 'Monitor'
kicker: 'Windows, no install'
h1: 'How to Sign a PDF on a Windows Computer'
subhead: >-
  You can sign a PDF on your computer without printing and scanning it. Open PDkef in Chrome or
  Edge, choose the document, add your answers and signature, and download the finished copy. It is
  free, and the PDF is processed on your PC.
primaryCta:
  href: '/sign/'
  label: 'Sign a PDF on your computer'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'Monitor'
    iconPos: 'tr'
    kicker: 'Four steps'
    heading: 'Sign a PDF on your computer in four steps'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Save the PDF from email or WhatsApp.</strong> Put it in a folder you can find
            again, such as Downloads. Keep the original in case you need to start over.
          - >-
            <strong>Open <a href="/sign/">pdkef.com/sign</a> in Chrome or Edge.</strong> Drag the
            PDF from File Explorer into the tool, or choose it with the file picker.
          - >-
            <strong>Add your details, then your signature.</strong> Place text and check marks on
            the page. Draw with a mouse, trackpad, touchscreen, or pen; type your signature; or choose
            an image of one you signed on paper.
          - >-
            <strong>Download and review the new PDF.</strong> Its name begins with "signed_".
            Check all pages, then attach that file to your email or WhatsApp reply. The original
            stays unchanged.
  - sketch: 'grid'
    icon: 'Monitor'
    iconPos: 'br'
    kicker: 'Edge, side by side'
    heading: 'Can Microsoft Edge sign a PDF too?'
    blocks:
      - kind: 'prose'
        text: >-
          Yes. Edge's <a href="https://learn.microsoft.com/en-us/deployedge/microsoft-edge-pdf" target="_blank" rel="noopener noreferrer">PDF reader supports basic form filling and inking</a>,
          so you can use its Draw tool for a signature. It also has <a href="https://www.microsoft.com/en-us/edge/features/pdf-reader" target="_blank" rel="noopener noreferrer">Add text for blank areas</a>.
          Those tools may be all you need. PDkef is another option when you want to type a signature,
          choose a signature image, or use the same editor on your phone.
      - kind: 'compare'
        builtInLabel: 'Microsoft Edge'
        caption: >-
          You can work with a local PDF in either workflow. Choose the controls that suit the form.
        rows:
          - task: 'Add a handwritten signature'
            builtIn: 'Draw with the inking tool'
            here: 'Draw, type, or choose a signature image'
          - task: 'Complete a form with fillable fields'
            builtIn: 'Basic form filling; XFA forms are not supported'
            here: 'Place text and check marks on the page'
          - task: 'Type onto a flat or scanned form'
            builtIn: 'Use Add text and position the text box'
            here: 'Click the page to add a text box'
          - task: 'Mark a checkbox on a scanned form'
            builtIn: 'Draw a tick or add an X'
            here: 'Place a check mark or cross'
  - sketch: 'waves'
    icon: 'Printer'
    iconPos: 'cl'
    kicker: 'Before you send it'
    heading: 'Return the signed PDF without a print and scan detour'
    blocks:
      - kind: 'prose'
        text: >-
          Working directly on the PDF avoids making a new scan of every page. It does not turn an
          existing scan into searchable text, but it lets you add the answers and signature without
          another trip through a printer. If you were sent photos instead of a PDF, use
          <a href="/image-to-pdf/">Image to PDF</a> first.
      - kind: 'prose'
        text: >-
          Open the downloaded copy before sending it: check the signature, dates, checkboxes, and
          page order. PDkef adds a visible signature, not a certificate-based digital signature or
          identity check. If the sender asks for a specific signing service or method, follow those
          instructions. Need to hide personal details in a shared copy? Use the
          <a href="/redact/">PDF redaction tool</a> before sending it.
  - sketch: 'rings'
    icon: 'ShieldCheck'
    iconPos: 'cl'
    kicker: 'No account needed'
    heading: 'Free signing on your PC, including offline use'
    blocks:
      - kind: 'prose'
        text: >-
          PDkef is free, with no signup or watermark, and <a href="/open-source-pdf-editor/">open
          source under the MIT license</a>. The PDF and signature are processed on your computer.
          Drafts and saved signatures can stay in the browser, so use a personal browser profile
          for documents you would not leave on a shared desk.
      - kind: 'prose'
        text: >-
          To use it without a connection, <a href="/install-pdf-app/">install PDkef while online</a>
          and let the required assets download. Test an export with your chosen font before going
          offline. You can finish the document locally and send it when you are connected again.
faq:
  - question: 'How do I sign a PDF on my computer for free?'
    answer: >-
      Open PDkef's signing tool in Chrome or Edge, choose the PDF, add your details and signature,
      and download the finished file. There is no signup, subscription, or watermark. You can also
      use Microsoft Edge's Draw tool if a handwritten mark is all you need.
  - question: 'Do I need to install software on Windows to sign a PDF?'
    answer: >-
      No. PDkef works in a browser without an extension or desktop installation. Installing it as
      a web app is optional and useful for offline access. On a managed work computer, your
      organization's browser and file policies still apply.
  - question: 'Can I add text and a signature with Microsoft Edge?'
    answer: >-
      Yes. Edge has basic PDF form filling, an Add text tool for blank areas, and a Draw tool for
      handwriting. PDkef also lets you type a signature or choose an existing signature image.
      Choose whichever workflow fits the document.
  - question: 'Can I use a touchscreen or pen instead of a mouse?'
    answer: >-
      Yes. You can draw with a mouse, trackpad, touchscreen, or compatible stylus. Draw the
      signature at a comfortable size, then resize it on the PDF. Typing your name or choosing a
      signature image is also available.
  - question: 'Where does the signed PDF go on Windows?'
    answer: >-
      It goes to the browser's download location, usually Downloads, or the folder you choose when
      prompted. The name begins with "signed_" and the original file is not overwritten. Attach
      that new file when replying by email or WhatsApp.
  - question: 'Does PDkef create a certificate-based digital signature?'
    answer: >-
      No. It adds a visible signature to the PDF and does not provide a signing certificate,
      identity verification, or a signing audit trail. If the recipient requests one of those,
      use the signing method they specify.
  - question: 'Does this populate the PDF''s interactive form fields?'
    answer: >-
      PDkef adds text and check marks to the page rather than writing values into interactive
      form fields. If a form needs its built-in submit button or the recipient needs field data,
      use a compatible form reader for that PDF.
