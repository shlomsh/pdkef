title: 'Delete Text and Images From a PDF Free | PDkef'
description: >-
  Delete existing text and image elements from a PDF page for free. Keep the rest selectable, replace
  prefilled form data, and work privately in your browser.
breadcrumb: 'Delete from PDF'
icon: 'Trash2'
kicker: 'Remove the element itself'
h1: 'Delete Text and Images From a PDF'
subhead: >-
  Select an existing text or image element, remove it from the page, and keep everything around it
  as normal PDF content. It is especially useful for replacing prefilled form data, clearing outdated
  text, or taking an unwanted image out of a document.
primaryCta:
  href: '/redact/'
  label: 'Open the PDF Delete tool'
sections:
  - variant: 'highlight'
    sketch: 'rings'
    icon: 'Trash2'
    iconPos: 'br'
    kicker: 'A significant difference'
    heading: 'Delete changes the page instead of covering it'
    blocks:
      - kind: 'prose'
        text: >-
          Choose <strong>Delete</strong> and the editor highlights the text and image elements it
          can remove. Click one and Download creates a PDF without that selected element on the page.
          The other text, lines and images remain where they were. A Delete-only page stays selectable
          and searchable because it is not flattened into a picture.
      - kind: 'image'
        src: '/images/redaction-guide/delete.jpg'
        alt: 'Real PDkef editor showing a prefilled email address marked with the Delete tool'
        width: 640
        height: 555
        caption: >-
          <strong>The selected email is being deleted from the page.</strong> The field label,
          document lines and all surrounding page content stay in place.
  - sketch: 'grid'
    icon: 'MousePointerClick'
    iconPos: 'tr'
    kicker: 'Useful everyday jobs'
    heading: 'What can you do with PDF Delete?'
    blocks:
      - kind: 'columns'
        items:
          - icon: 'FileEdit'
            title: 'Replace form data'
            body: >-
              Delete an old name, email, date or answer. Download, then open the result in
              <strong>Sign &amp; Fill PDF</strong> to enter the new value.
          - icon: 'Trash2'
            title: 'Clean up a page'
            body: >-
              Remove an outdated heading, duplicate line, obsolete price, draft note, or other text
              block while leaving the rest of the document intact.
          - icon: 'Layers'
            title: 'Remove an image'
            body: >-
              Take out a detected logo, photo, stamp or image placement without turning the entire
              page into a flat image.
      - kind: 'prose'
        text: >-
          PDFs do not always store text one word at a time, so the highlight shows the exact element
          a click will remove. It may be a word, line, or larger text run. If a scanned page appears
          as one large image, use Whiteout to clear only the area you want to replace.
  - sketch: 'arcs'
    icon: 'ListChecks'
    iconPos: 'cl'
    kicker: 'Three steps'
    heading: 'Delete an element and replace it with new content'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Open the <a href="/redact/">Redact tool</a> and choose Delete.</strong> The PDF
            stays on your device while the removable text and image elements are highlighted.
          - >-
            <strong>Click the complete element you want removed.</strong> Mark more elements if
            needed, or use Undo before downloading if you selected the wrong one.
          - >-
            <strong>Download the edited PDF.</strong> To replace a form value, open the new copy in
            <a href="/sign/">Sign &amp; Fill PDF</a>, add the new text, position it, and download again.
      - kind: 'prose'
        text: >-
          Your original file is not overwritten. Download creates a new copy, and the local draft
          lets you return to the editor and make another version.
  - sketch: 'waves'
    icon: 'Layers'
    iconPos: 'tr'
    kicker: 'Choose by result'
    heading: 'Delete, Whiteout, Blackout and Blur each have a job'
    blocks:
      - kind: 'table'
        caption: 'Use the option that produces the page you want.'
        headers: ['Tool', 'Result', 'Example']
        rows:
          - ['Delete', 'The selected element is removed; other page text stays searchable', 'Remove a prefilled answer or an old logo']
          - ['Whiteout', 'A clean-colored cover is flattened into the page', 'Clear a scanned form field before writing over it']
          - ['Blackout', 'A solid visible cover is flattened into the page', 'Show that a name or reference was withheld']
          - ['Blur', 'The selected visual detail is softened and flattened', 'De-emphasize a face, signature or screenshot detail']
      - kind: 'prose'
        text: >-
          See each option in the <a href="/blur-vs-blackout-vs-delete-pdf/">visual guide to Delete,
          Whiteout, Blackout, Blur and flattening</a>. You can combine the tools in the same PDF and
          make a different choice for each element.
  - sketch: 'rings'
    icon: 'Code2'
    iconPos: 'br'
    kicker: 'Free and on your device'
    heading: 'Delete PDF elements with no upload or account'
    blocks:
      - kind: 'prose'
        text: >-
          PDkef processes the document in your browser. There is no signup, watermark or paid tier,
          and the code is open source under the MIT license. Read how to
          <a href="/open-source-pdf-editor/">verify local PDF processing</a>, or
          <a href="/install-pdf-app/">install PDkef for offline use</a> after its required assets
          have loaded.
faq:
  - question: 'Does Delete remove the selected element from the PDF page?'
    answer: >-
      Yes. Choose Delete, click a highlighted text or image element, and Download creates a PDF
      without that selected element on the page. The surrounding content stays in place.
  - question: 'Can I replace prefilled information in a PDF form?'
    answer: >-
      Yes. Delete the old highlighted value, download the edited PDF, then open it in Sign & Fill PDF
      to add the replacement text. If the old value is part of a scan, use Whiteout to clear that
      area visually before adding the new value.
  - question: 'Will the rest of the page stay searchable after Delete?'
    answer: >-
      Yes, when the page contains Delete edits only. The selected element is removed while the rest
      remains selectable and searchable. Adding Whiteout, Blackout or Blur makes Download flatten
      that whole page into an image instead.
  - question: 'Can Delete remove images as well as text?'
    answer: >-
      Yes. When the editor highlights an image placement, choose it to remove that image from the
      page. This is useful for old logos, photos, stamps and other unwanted visual elements.
  - question: 'Why does Delete sometimes highlight a whole line?'
    answer: >-
      A PDF may store a word, line or group of words as one text element. The highlight shows the
      complete element that will be removed, so you can review the selection before clicking it.
  - question: 'Can I use Delete on a scanned PDF?'
    answer: >-
      A scan is usually one large image rather than separate text elements, so Delete may select the
      complete scanned image. Use Whiteout when you want to clear one specific area of the scan.
