title: 'How to Sign a PDF on Mac for Free | PDkef'
description: >-
  Sign a PDF on Mac for free in Safari or Chrome. Add text and a signature without uploading your
  document, or use Preview. No signup or watermark.
breadcrumb: 'Mac'
icon: 'Laptop'
kicker: 'macOS, right in the browser'
h1: 'How to Sign a PDF on Mac for Free'
subhead: >-
  Your Mac can already fill and sign PDFs with Preview. If you prefer a browser, PDkef lets you
  add text, check marks, and a drawn, typed, or image signature in Safari or Chrome. It is free,
  with no signup or watermark, and your document is processed on your Mac.
primaryCta:
  href: '/sign/'
  label: 'Sign a PDF on Mac'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'Laptop'
    iconPos: 'tr'
    kicker: 'Four steps'
    heading: 'Sign a PDF on your Mac in Safari or Chrome'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Save the PDF from Mail, WhatsApp, or your browser.</strong> Choose a folder
            you can find in Finder, such as Downloads, and keep the original copy.
          - >-
            <strong>Open <a href="/sign/">pdkef.com/sign</a> in Safari or Chrome.</strong> Drag
            the PDF from Finder into the tool, or select it with the file picker.
          - >-
            <strong>Add your answers and signature.</strong> Place text and check marks on the
            page. Draw your signature with the trackpad, type it, or choose a signature image, then
            position and resize it to fit.
          - >-
            <strong>Download and review the finished PDF.</strong> The name begins with
            "signed_". Open that copy, check every page, and attach it to your reply. Your original
            file stays unchanged.
  - sketch: 'grid'
    icon: 'FileEdit'
    iconPos: 'br'
    kicker: 'Preview, side by side'
    heading: 'What Preview on Mac already handles'
    blocks:
      - kind: 'prose'
        text: >-
          Preview can fill supported form fields, add text boxes to flat pages, and capture a
          signature from a trackpad, camera, iPhone, or iPad. It also offers AutoFill for contact
          details in supported forms. Apple's <a href="https://support.apple.com/guide/preview/fill-out-and-sign-pdf-forms-prvw35725/mac" target="_blank" rel="noopener noreferrer">Preview signing guide</a>
          explains those options. You do not need another tool if Preview already fits the job.
      - kind: 'compare'
        builtInLabel: 'Preview'
        caption: >-
          Both workflows can use a PDF stored on your Mac. The main choice is how you prefer to add
          and position your answers.
        rows:
          - task: 'Add a handwritten signature'
            builtIn: 'Capture with trackpad, camera, iPhone, or iPad'
            here: 'Draw, type, or choose a signature image'
          - task: 'Complete a form with fillable fields'
            builtIn: 'Fill supported fields; AutoFill where available'
            here: 'Place text and check marks on the page'
          - task: 'Add text to a flat or scanned form'
            builtIn: 'Add and position a text box'
            here: 'Click the page to add a text box'
          - task: 'Mark a checkbox on a scanned form'
            builtIn: 'Draw a tick or place an X with Markup'
            here: 'Place a check mark or cross'
          - task: 'Redact sensitive text before sharing'
            builtIn: 'Use Redaction Selection in Markup'
            here: 'Use the separate PDF redaction tool'
      - kind: 'prose'
        text: >-
          Preview also has a <a href="https://support.apple.com/guide/preview/annotate-a-pdf-prvw11580/mac" target="_blank" rel="noopener noreferrer">Redaction Selection tool</a>
          for permanently removing selected text. In PDkef, use the <a href="/redact/">Redact PDF
          tool</a> when you need to hide details in a shared copy. A drawn shape placed over text
          is not the same as removing it from the file.
  - sketch: 'rings'
    icon: 'Lightbulb'
    iconPos: 'cl'
    kicker: 'The built-in route'
    heading: 'How to add a signature with Preview'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Open the PDF in Preview.</strong> If another app opens it, Control-click the
            file in Finder and choose Open With, then Preview.
          - >-
            <strong>Show the Markup toolbar and choose Sign.</strong> Select a saved signature,
            or create one with the trackpad, camera, or a compatible iPhone or iPad.
          - >-
            <strong>Place the signature and save a copy.</strong> Drag it to the signature line,
            resize it with the handles, and check the finished document before sharing it.
      - kind: 'prose'
        text: >-
          Prefer a typed signature or a signature image you already have? Open the PDF in
          <a href="/sign/">PDkef's signing tool</a> instead. Either way, follow the recipient's
          instructions if they request a particular signing method. Adding a visible signature does
          not create a certificate-based digital signature.
  - sketch: 'waves'
    icon: 'ShieldCheck'
    iconPos: 'cl'
    kicker: 'Your file, your Mac'
    heading: 'Free, open source, and available offline'
    blocks:
      - kind: 'prose'
        text: >-
          PDkef processes the PDF locally, with no document upload, signup, or watermark. It is
          <a href="/open-source-pdf-editor/">open source under the MIT license</a>. Drafts and
          saved signatures stay in the browser you use; they do not automatically follow you to
          another Mac or your phone.
      - kind: 'prose'
        text: >-
          To work without a connection, <a href="/install-pdf-app/">install PDkef while online</a>
          and let the required assets download. Test your chosen font and an export before going
          offline. Keep the source PDF available locally too, and check your save location if you
          do not want the finished copy in a folder that syncs to iCloud.
faq:
  - question: 'How do I sign a PDF on my Mac for free?'
    answer: >-
      Use Preview's Markup signature tool, or open PDkef in Safari or Chrome. In PDkef, choose the
      PDF, add a drawn, typed, or image signature, then download the signed copy. No account,
      subscription, or watermark is required.
  - question: 'Can Preview fill forms and sign PDFs without another app?'
    answer: >-
      Yes. Preview fills supported form fields, adds text boxes to flat pages, and captures and
      places signatures. AutoFill is available for compatible forms. You can also draw a tick or
      place an X on a scanned checkbox; it does not need to be an interactive field.
  - question: 'Can I draw my signature with a Mac trackpad?'
    answer: >-
      Yes. In PDkef, draw in the signature dialog, then place and resize it on the PDF. You can
      also type your name or choose a signature image. Preview has its own trackpad signature
      capture if you prefer the built-in app.
  - question: 'Does PDkef work in Safari on Mac?'
    answer: >-
      Yes. Open the signing tool in Safari or Chrome and choose your PDF. No browser extension is
      needed. For offline use, prepare the app and required assets while connected and test an
      export before you disconnect.
  - question: 'Where is the signed PDF saved on Mac?'
    answer: >-
      In your browser's download folder, usually Downloads, or the location you choose when
      prompted. Its name begins with "signed_". Open that copy to check it, then attach it to
      your reply in Mail or WhatsApp.
  - question: 'Can I start on Mac and continue the same draft on iPhone?'
    answer: >-
      Drafts do not sync between devices or browsers. Download the work you want to keep and
      transfer that PDF yourself, then open it on the other device to add more. Earlier additions
      are part of the exported PDF, not the original editable draft.
  - question: 'Does PDkef fill the PDF''s actual form fields?'
    answer: >-
      PDkef places text and check marks on the page rather than updating interactive field
      values. If the recipient needs the form's field data or a built-in submit button, use a
      compatible form reader such as Preview where that form is supported.
