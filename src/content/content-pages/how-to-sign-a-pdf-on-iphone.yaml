title: 'How to Sign a PDF on iPhone for Free | PDkef'
description: >-
  Sign a PDF on iPhone for free in Safari. Save a WhatsApp attachment, fill it in, and send the
  signed PDF back. No signup, watermark, or document upload.
breadcrumb: 'iPhone'
icon: 'Smartphone'
kicker: 'iPhone, right in Safari'
h1: 'How to Sign a PDF on iPhone for Free'
subhead: >-
  You can sign a PDF on your iPhone without printing it or installing another app. Save the
  attachment to Files, open it in PDkef, add your answers and signature, then send it back. The
  signing is free and happens on your phone. Apple's own PDF tools are an option too.
primaryCta:
  href: '/sign/'
  label: 'Sign a PDF on iPhone'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'Smartphone'
    iconPos: 'tr'
    kicker: 'Four steps'
    heading: 'Fill and sign a PDF in Safari on iPhone'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Save the attachment to Files.</strong> Open the PDF, tap Share, then Save to
            Files. Choose On My iPhone if you want a local folder rather than iCloud Drive.
          - >-
            <strong>Open <a href="/sign/">pdkef.com/sign</a> in Safari.</strong> Tap to choose a
            file, choose Browse if needed, and select the PDF from the folder you just used.
          - >-
            <strong>Fill it in, then add your signature.</strong> Place text and check marks where
            needed. Draw your signature with a finger, type it, or choose an image of a signature.
          - >-
            <strong>Download the finished PDF.</strong> Look for the new file beginning with
            "signed_" in Files. If Safari opens a preview instead, use Share, then Save to Files.
            Open the saved copy and check every page before sending it.
  - sketch: 'waves'
    icon: 'FileEdit'
    iconPos: 'cl'
    kicker: 'The WhatsApp form'
    heading: 'How to sign a PDF sent through WhatsApp on iPhone'
    blocks:
      - kind: 'steps'
        items:
          - >-
            <strong>Open the PDF in the WhatsApp chat.</strong> Tap Share, choose Save to Files,
            and pick a folder you can find again. Keep the original attachment as your starting copy.
          - >-
            <strong>Choose the saved file in <a href="/sign/">the signing tool</a>.</strong>
            Fill in the requested details, add the date and signature, then download the new PDF.
          - >-
            <strong>Send the signed copy back as a document.</strong> In WhatsApp, open the chat's
            attachment menu, choose Document, and browse to the new file in Files. Select the name
            beginning with "signed_" and check it before sending.
      - kind: 'prose'
        text: >-
          You can also use <strong>Share</strong> in PDkef when Safari supports it. Tap Share to
          prepare the finished PDF, then <strong>Share now</strong> to open the share sheet and
          choose WhatsApp. If WhatsApp is not offered, save the PDF to Files and attach it from the
          chat. Sending the PDF keeps the full document together.
  - sketch: 'grid'
    icon: 'PenLine'
    iconPos: 'br'
    kicker: 'Apple tools, side by side'
    heading: 'Signing with Files, Markup, or Preview on iPhone'
    blocks:
      - kind: 'prose'
        text: >-
          Your iPhone already has useful PDF tools. Apple's <a href="https://support.apple.com/guide/iphone/fill-forms-sign-documents-create-signatures-iph1d3607e5c/ios" target="_blank" rel="noopener noreferrer">form filling and Markup tools</a>
          can add text and signatures, and AutoFill can use saved contact details in supported
          forms. On iOS 26, <a href="https://support.apple.com/guide/iphone/fill-out-and-sign-pdf-forms-iphd7e3c0c74/ios" target="_blank" rel="noopener noreferrer">Preview also fills and signs PDFs</a>.
          If those do what you need, use them. PDkef offers another workflow in Safari.
      - kind: 'compare'
        builtInLabel: 'Apple PDF tools'
        caption: >-
          The available controls depend on your iOS version and the app opening the document.
        rows:
          - task: 'Add a handwritten signature'
            builtIn: 'Add or reuse a signature with Markup'
            here: 'Draw, type, or choose a signature image'
          - task: 'Complete a supported PDF form'
            builtIn: 'Form filling and AutoFill'
            here: 'Place text and check marks on the page'
          - task: 'Add text to a flat or scanned form'
            builtIn: 'Add and position a text form box'
            here: 'Tap the page to add a text box'
          - task: 'Mark a checkbox on a scanned form'
            builtIn: 'Draw a tick or place an X with Markup'
            here: 'Place a check mark or cross'
  - sketch: 'rings'
    icon: 'ShieldCheck'
    iconPos: 'cl'
    kicker: 'Useful beyond one signature'
    heading: 'Free signing, with your PDF kept on your phone'
    blocks:
      - kind: 'prose'
        text: >-
          There is no signup or watermark. PDkef processes the file locally and is
          <a href="/open-source-pdf-editor/">open source under the MIT license</a>. Your browser
          can keep a draft and saved signatures for next time. Where you save or share the finished
          document is your choice; selecting iCloud Drive or WhatsApp uses that service.
      - kind: 'prose'
        text: >-
          Need it without a connection? <a href="/install-pdf-app/">Install PDkef for offline use</a>
          while connected, let its assets finish downloading, and test an export with your chosen
          font. If you need to remove personal details before sharing a copy, the
          <a href="/redact/">PDF redaction tool</a> can black them out before you send it.
faq:
  - question: 'Do I need an App Store download to sign a PDF on iPhone?'
    answer: >-
      No. PDkef runs in Safari with no account or subscription. Your iPhone also has built-in
      signing tools through Markup and, on iOS 26, Preview. A draft and saved signatures may remain
      locally in Safari for next time.
  - question: 'How do I sign a PDF file sent through WhatsApp on iPhone?'
    answer: >-
      Open the attachment in WhatsApp, tap Share, and choose Save to Files. Select that PDF in
      PDkef, add your signature, and download it. Then attach the new file beginning with "signed_"
      as a Document in the WhatsApp chat. Do not forward the unsigned original.
  - question: 'Can I fill and sign the PDF with Apple''s own tools instead?'
    answer: >-
      Yes. Apple supports form filling, text boxes, AutoFill in compatible forms, and signatures
      through its PDF tools. Preview on iOS 26 also handles these tasks. The available controls
      depend on your iOS version and the document, so choose the tool that fits your form.
  - question: 'Does this work on iPad too?'
    answer: >-
      Yes. Open PDkef in Safari on iPad and choose the PDF from Files. You can draw a signature with
      a finger or, on a compatible iPad, an Apple Pencil. Apple Pencil does not work with iPhone.
  - question: 'Where does Safari save my signed PDF?'
    answer: >-
      Check Safari's Downloads and the Files app. The folder depends on your Safari download
      settings and can be in iCloud Drive or On My iPhone. If the PDF opens in a preview, tap Share
      and Save to Files to choose the folder yourself.
  - question: 'Can I sign offline on my iPhone?'
    answer: >-
      Yes, once the app and required assets are available offline. Install while connected and
      test an export with your chosen font first. Keep the source PDF downloaded on the phone too.
      Sending the result through WhatsApp or email still needs a connection.
  - question: 'Can I type my signature instead of drawing with my finger?'
    answer: >-
      Yes. You can type your name or choose an image of your signature. To improve a drawn
      signature, draw it larger and resize it on the page. Follow the recipient's instructions if
      they require a specific signature method or signing service.
  - question: 'Does PDkef update the PDF''s interactive form fields?'
    answer: >-
      It adds text, check marks, and signatures to the page rather than populating interactive
      field values. If the recipient requires the original form's fields or submit button to work,
      use a compatible form reader for that document.
