title: 'Remove the CamScanner Watermark From a PDF, Free | PDkef'
description: >-
  Remove the "Scanned with CamScanner" line from a PDF, free, on your phone or computer. Tap it, it's
  gone, download. No signup, no upload.
breadcrumb: 'CamScanner watermark'
icon: 'ScanText'
kicker: 'Tap it, it is gone'
h1: 'Remove the CamScanner Watermark From Your PDF'
subhead: >-
  The free CamScanner app adds a "Scanned with CamScanner" line to every page. With the Redact tool you
  tap it away and download a clean PDF, right in your browser.
primaryCta:
  href: '/redact/'
  label: 'Open the free Redact tool'
sections:
  - variant: 'highlight'
    sketch: 'arcs'
    icon: 'ListChecks'
    iconPos: 'tr'
    kicker: 'Before and after'
    heading: 'How to remove "Scanned with CamScanner" from a PDF'
    blocks:
      - kind: 'image'
        src: '/images/camscanner-guide/before-after.svg'
        alt: 'A sketched receipt with the Scanned with CamScanner line in its corner, and the same receipt with the corner clean'
        width: 800
        height: 520
        caption: 'The same receipt, before and after. The rest of the page stays exactly as it was.'
      - kind: 'steps'
        items:
          - >-
            <strong>Open your PDF in the <a href="/redact/">Redact tool</a> and choose Delete.</strong>
            It works on a phone or a computer.
          - >-
            <strong>Tap the footer.</strong> It lights up on its own, and one tap removes it.
          - >-
            <strong>Do the same on each page, then Download.</strong> You get a new, clean PDF.
  - sketch: 'grid'
    icon: 'MousePointerClick'
    iconPos: 'br'
    kicker: 'Three taps'
    heading: 'Tap it, it is gone, download'
    blocks:
      - kind: 'image'
        src: '/images/camscanner-guide/steps.svg'
        alt: 'Three sketches: the footer outlined where it is tapped, the page without it, and the download button'
        width: 960
        height: 460
        caption: 'Delete outlines the footer on its own, so you can see what one tap removes.'
      - kind: 'prose'
        text: >-
          If Delete lights up the whole page instead, the footer is part of the scanned picture. Choose
          <strong>Whiteout</strong>, pick a colour close to the paper's, and drag it over the line.
  - sketch: 'waves'
    icon: 'Layers'
    iconPos: 'tl'
    kicker: 'Nothing left behind'
    heading: 'The hidden link goes too'
    blocks:
      - kind: 'image'
        src: '/images/camscanner-guide/hidden-link.svg'
        alt: 'The CamScanner footer lifted like a sticker, showing a hidden link to the CamScanner website underneath'
        width: 800
        height: 500
        caption: 'Under the footer sits an invisible link. Delete takes both.'
      - kind: 'prose'
        text: >-
          The footer is also an invisible link to CamScanner's website. Delete removes the link together
          with the footer, and the downloaded file keeps no title, author or scan time from the original.
  - sketch: 'rings'
    icon: 'ShieldCheck'
    iconPos: 'br'
    kicker: 'Nothing is uploaded'
    heading: 'Your scan stays on your device'
    blocks:
      - kind: 'prose'
        text: >-
          PDkef works in your browser, with no upload, no account and no watermark of its own. It is free
          and open source, and you can
          <a href="/open-source-pdf-editor/">check that nothing leaves your device</a>.
faq:
  - question: 'How do I remove the CamScanner watermark from a PDF for free?'
    answer: >-
      Open the PDF in PDkef's Redact tool, choose Delete and tap the "Scanned with CamScanner" line on
      each page, then Download. If Delete selects the whole page, drag a Whiteout box over the line
      instead.
  - question: 'Can I remove the CamScanner watermark on my iPhone or Android phone?'
    answer: >-
      Yes. Open pdkef.com in your phone's browser, choose the PDF from Files and tap the footer. Nothing
      is installed and nothing is uploaded.
  - question: 'Does the hidden CamScanner link go too?'
    answer: >-
      Yes. The footer is also an invisible link to CamScanner's website. Delete removes it with the
      footer, and the downloaded file keeps no title, author or scan time from the original.
  - question: 'Is my scan uploaded anywhere?'
    answer: >-
      No. PDkef works on the PDF in your browser, on your device. There is no upload and no account,
      and the code is open source.
