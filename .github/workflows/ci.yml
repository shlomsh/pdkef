name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The exported-PDF render guard's baseline is platform-bound and must be
  # captured on this runner, never on a developer's machine - see
  # BASELINE_PLATFORM in e2e/sign/fixtures/exportRenderHarness.js. Running the
  # workflow manually with this input set captures it here and prints it for
  # review; it is never committed automatically, because the whole point of a
  # stored baseline is that somebody looks at the diff.
  workflow_dispatch:
    inputs:
      update-export-render-baseline:
        description: "Recapture the exported-PDF render baseline on this runner and print it"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # poppler-utils gives the W6 extraction guard (src/lib/sign.test.js) its
    # `pdftotext` half. Without it that half self-skips with a warning, which
    # would leave the one assertion that actually proves /ActualText works
    # running only on a developer's machine.
    - name: Install poppler-utils (pdftotext, for the W6 extraction guard)
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    - name: Run tests
      run: npm run test

    - name: Typecheck
      run: npm run typecheck

    - name: Verify editor dependency directions
      run: npm run test:editor-dependency-directions

    - name: Verify shared box-resize owner
      run: test "$(git grep -l "maxWidthFromRightGrowth\|maxHeightFromBottomGrowth" -- 'src/**' | wc -l | tr -d ' ')" = 1

    - name: Verify gesture golden-rule (static)
      run: npm run test:gesture-golden-rule

    # Source-side, so it needs no build and fails before one is spent. It also
    # runs again inside test:css below, for anyone running that locally.
    - name: Verify every class string resolves to CSS
      run: node scripts/check-class-resolution.js

    # Source-side, so it needs no build. Guards the fontkit TTF subsetter (used by
    # sign.js's `{ subset: true }` font embedding) against unaligned `glyf` outlines,
    # which subset into corrupt/missing glyphs in the exported PDF. See the script's
    # header comment for the Kalam-Regular/Kalam-Bold incident this catches.
    - name: Verify bundled font glyf alignment
      run: npm run test:fonts

    - name: Verify reviewed runtime dependency licenses
      run: npm run test:licenses

    - name: Build
      run: npm run build

    - name: Verify CSP hashes
      run: npm run test:csp

    - name: Verify SEO invariants
      run: npm run test:seo

    - name: Check CSS correctness and duplication
      run: npm run test:css

    - name: Check first-load page weight
      run: npm run test:weight

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright e2e tests
      # `test:e2e` builds for a useful local one-command release check. CI has
      # already built the exact dist checked by CSP, SEO, CSS and weight gates,
      # so invoke Playwright directly rather than building it a second time.
      run: npx playwright test

    # Prints the recaptured baseline rather than committing it. Review the
    # decoded file before it lands: a baseline change is a change to what users
    # receive.
    - name: Recapture exported-PDF render baseline (manual runs only)
      # always(), because a step's `if` otherwise still implies success() and
      # the e2e step above is exactly the one expected to be red when a
      # baseline needs recapturing.
      if: ${{ always() && inputs.update-export-render-baseline }}
      env:
        UPDATE_EXPORT_RENDER_BASELINE: '1'
      run: |
        npx playwright test e2e/sign/export-render-guard --reporter=list || true
        echo "BASELINE_GZ_B64_START"
        gzip -9 -c e2e/sign/fixtures/exportRenderBaseline.json | base64 -w 3000
        echo "BASELINE_GZ_B64_END"

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
