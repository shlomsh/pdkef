name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The font guards are path-gated below; the nightly run is the backstop that
  # catches a runner image or browser change none of our own commits made. It
  # skips itself (via `scope`'s `nightly_unchanged` output) when nothing has
  # landed since its own last completed run - a quiet repo has nothing new for
  # it to catch, and the previous night's run already vouched for that commit.
  schedule:
    - cron: "17 3 * * *"
  # The exported-PDF render guard's baseline is platform-bound and must be
  # captured on this runner, never on a developer's machine - see
  # BASELINE_PLATFORM in e2e/sign/fixtures/exportRenderHarness.js. Running the
  # workflow manually with this input set captures it here and prints it for
  # review; it is never committed automatically, because the whole point of a
  # stored baseline is that somebody looks at the diff.
  workflow_dispatch:
    inputs:
      update-export-render-baseline:
        description: "Recapture the exported-PDF render baseline on this runner and print it"
        type: boolean
        default: false

# Jobs run in parallel instead of one sequential job, so the wall time is the
# longest chain, not the sum. Measured before the first split (n=8 runs): 8.2
# min median, two thirds of it Playwright on a single worker, with the font
# guards more than half of that. All of them wait on the `scope` job (about
# 10s) and skip when the change is docs-only; when scope produces no verdict
# they run, so a broken classifier costs time, never coverage.
#
# `build` runs every guard that reads dist/ (csp, seo, redirects, css, weight);
# `e2e` is a two-shard matrix beside it, each shard building for itself and
# running its half of the product e2e. Splitting it from `build` was QUAL-05
# (2026-09-13): the product e2e was the long pole in `build` at 1:45-2:10 on
# two workers, and halving it needs no knowledge of the code, unlike the
# per-tool gating ARCH-20 plans. Each shard pays the fixed cost (npm ci,
# build, browser install) again, which is the trade the ticket accepts.
# `e2e-webkit` (QUAL-09, 2026-09-14) is a third, unsharded job beside it: the
# 21 webkit tests and the perf budgets run once there, so the two chromium
# shards install and run chromium only.
#
# ARCH-20 (2026-09-14): `checks`, each `e2e` shard, each `font-guards` shard and `export-guards` narrow
# their own unit/e2e work to what a real Nx project graph (one project per
# src/shell, src/editor, src/editor-ui, src/lib, src/tools/<tool>/, the site,
# public/fonts and the e2e trees - see nx.json and the project.json files)
# says the push affects. `scripts/affected-scope.mjs` is the oracle - it asks
# `nx show projects --affected`, then each job runs ONE `vitest run <paths>`
# or `playwright test <paths>` itself; Nx never executes a test directly (see
# docs/nx-affected-ci.md for why 18 separate `nx run <project>:test` calls
# would cost more than they save whenever most projects are affected). The
# affected computation happens INSIDE each consuming job, right after its own
# `npm ci`, not in `scope`: `scope` has no node_modules and stays ~6s so every
# other job isn't waiting on an `npm ci` most runs don't need to narrow
# anything from. `scope` only adds a `base` output (the resolved base sha)
# for the consuming jobs to reuse, so all of them agree on the same diff.
jobs:
  # Everything that needs no build: source guards, the unit suite, typecheck.
  checks:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5
      with:
        # Full history: src/site-lib/gitLastModified.test.js dates a real
        # guide from git and refuses a shallow boundary commit, so on the
        # default depth-1 checkout it would see null and fail. Same reason
        # and cost as `build` below (30 MB against 24 MB, 2026-09-14).
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # scripts/affected-scope.mjs asks Nx which projects the push affects and
    # prints what to narrow the unit run to. Right after npm ci (needs
    # node_modules for `nx`), not in `scope` (see the header comment above).
    # Fails open (everything=true) with no usable base, an nx error, or an
    # unowned changed file - see the script's own header for the full rules.
    # The same call appends its verdict to the run's step summary. No
    # `--depth=1` on this fetch, unlike the e2e and font-guards jobs: on the
    # full checkout above a depth-1 fetch turns the clone SHALLOW, grafting
    # BASE in as a parentless boundary that cuts HEAD off from everything
    # below it, and gitLastModified.test.js then saw null for a guide dated
    # weeks back (run 34890208527, 2026-09-14).
    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    # poppler-utils gives the W6 extraction guard (src/lib/sign.test.js) its
    # `pdftotext` half. Without it that half self-skips with a warning, which
    # would leave the one assertion that actually proves /ActualText works
    # running only on a developer's machine.
    - name: Install poppler-utils (pdftotext, for the W6 extraction guard)
      run: sudo apt-get update && sudo apt-get install -y poppler-utils

    # backlog/tasks/*.md is the canonical board; BACKLOG.md and TODO.md are
    # generated from it. Fails on malformed task metadata, a dependency that
    # does not resolve, or a stale generated view (ARCH-12). Source guards
    # stay unconditional - nothing in scripts/, backlog/ or docs/ is claimed
    # by any Nx project on purpose (see docs/nx-affected-ci.md's root-project
    # trap), so `nx affected` was never going to narrow these anyway.
    - name: Validate backlog and generated indexes
      run: npm run check:backlog

    # CLAUDE.md loads into every agent session; the topic detail lives in
    # .claude/rules/*.md, loaded only for matching files. Fails if CLAUDE.md
    # exceeds its line budget, a rule lacks paths: frontmatter, or a glob
    # matches nothing.
    - name: Validate agent guidance budget
      run: npm run check:guidance

    # ARCH-28: unit tests are selected by Vitest's own module graph
    # (`vitest related` against the changed files, plus a small widen-rule
    # table for what that graph can't see - scripts/unit-scope.mjs), not by
    # which Nx project a file's folder belongs to. A core-project verdict
    # above (`everything=true`) no longer means the unit step runs all ~193
    # files - see scripts/unit-scope.mjs's own header for why. This
    # recomputes its own scope from the same $BASE the step above already
    # fetched (scripts/change-scope.mjs's resolveBase(), shared by both) and
    # prints why each test file ran, or why it widened, to this step's log
    # and to the job summary.
    - name: Run tests
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: node scripts/affected-scope.mjs --base "$BASE" --run unit

    - name: Typecheck
      run: npm run typecheck

    # Also covers the box-resize single-owner rule (exactly one file under
    # src/ may mention maxWidthFromRightGrowth/maxHeightFromBottomGrowth),
    # folded in under DEBT-12 from its own `git grep` step here so it also
    # runs in check:fast, not only in CI.
    - name: Verify editor dependency directions
      run: npm run test:editor-dependency-directions

    # docs/module-boundaries.md (ARCH-15) draws the target layout; this reads
    # the real import graph and fails on any edge that crosses it, against an
    # explicit, shrink-only allowlist of today's violations.
    - name: Verify module boundaries
      run: npm run test:module-boundaries

    - name: Verify gesture golden-rule (static)
      run: npm run test:gesture-golden-rule

    # FORM-22: field detection (src/tools/sign/fields/'s ink/widget/cell
    # detectors, plus the scored corpus's scoring loader) stays plain data in,
    # plain data out - no pdf-lib/pdf.js/DOM/time/random touch outside a named
    # boundary shim, no module-level mutable state. Source-side, so it needs
    # no build; see scripts/check-detection-purity.mjs's own header for why it
    # parses with the TypeScript compiler API rather than scanning raw text.
    - name: Verify field detection stays pure
      run: npm run test:detection-purity

    # Source-side, so it needs no build. It also runs again inside test:css in
    # the build job, for anyone running that locally.
    - name: Verify every class string resolves to CSS
      run: node scripts/check-class-resolution.js

    # Source-side, so it needs no build. Guards the fontkit TTF subsetter (used by
    # sign.js's `{ subset: true }` font embedding) against unaligned `glyf` outlines,
    # which subset into corrupt/missing glyphs in the exported PDF. See the script's
    # header comment for the Kalam-Regular/Kalam-Bold incident this catches.
    - name: Verify bundled font glyf alignment
      run: npm run test:fonts

    - name: Verify reviewed runtime dependency licenses
      run: npm run test:licenses

    # A dependency update is only safe to automate while the same PR still
    # reaches the release checks below, including the platform-bound render
    # guard. This locally validates that wiring on every PR.
    - name: Verify dependency governance wiring
      run: npm run test:dependency-governance

  # The build and every guard that reads dist/. The product e2e suite is the
  # `e2e` job below, which builds again rather than waiting for this job; the
  # font guards have their own job further down.
  build:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5
      with:
        # Full history, not the default depth 1: `build` runs test:seo, which
        # now fails when a content page has no "Last updated" date, and
        # src/site-lib/gitLastModified.js can only date a file from history the
        # clone holds (a shallow boundary commit is refused as unknowable). The
        # full pack is 30 MB against 24 MB shallow, measured 2026-09-14.
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Verify CSP hashes
      run: npm run test:csp

    - name: Verify SEO invariants
      run: npm run test:seo

    - name: Verify trailing-slash redirects cover every real route
      run: npm run test:redirects

    - name: Check CSS correctness and duplication
      run: npm run test:css

    - name: Check first-load page weight
      run: npm run test:weight

    # Field detection is Sign-only and behind a dynamic import; nothing in the
    # language keeps it there, so this walks the built graph a page at a time.
    - name: Check Sign-only modules stay out of every page's first paint
      run: npm run test:lazy-modules

  # The product e2e suite, split into two shards so each pays roughly half
  # the Playwright wall time (QUAL-05). Every chromium spec except the font
  # guards (their own job below) and webkit/perf (their own job, `e2e-webkit`,
  # QUAL-09). Each shard builds for itself (10s) instead
  # of waiting for `build` and downloading its dist/: measured on the first
  # sharded run, that put 60s of `build` in front of a 65s fixed cost per
  # shard (checkout, npm ci, browser install) and gave back the whole 43s the
  # split had saved. The build is deterministic for a commit, so the guards in
  # `build` still vouch for what these specs load.
  e2e:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Right after npm ci (needs node_modules for `nx`), so both shards agree
    # on the same affected paths - see the workflow header comment and
    # docs/nx-affected-ci.md. Empty e2e_paths means either everything=true
    # (run the full suite) or nothing e2e-relevant is affected; either way,
    # `--pass-with-no-tests` below makes a narrowed, zero-match project exit
    # 0 instead of Playwright's default failure for that case.
    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    - name: Build
      run: npm run build

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    # Chromium only (QUAL-09): webkit and the perf budgets moved to the
    # unsharded `e2e-webkit` job below. Caching was measured and rejected for
    # the old, pre-QUAL-09 combined chromium+webkit shape that used to run
    # here: a cache hit was 5s to restore plus 46s of `install-deps` for
    # webkit's apt libraries, against 38s for the single uncached install
    # there, so the cache only saved the download, not the apt cost, and
    # wasn't worth it. That combination no longer runs in this job. This job
    # now installs chromium only, and each of the two shards pays that apt
    # cost separately; `font-guards`'s own comment below measured its
    # chromium-only apt half at 12-19s per shard, so a hit here is worth
    # trading for even though the old combined case was not. PROJECTION, not
    # a fresh CI measurement (nothing here can exercise GitHub's real cache
    # backend) - whoever reviews the next few runs should confirm the cache
    # actually hits and actually saves the time this comment assumes.
    - name: Install Playwright browsers (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    # One command per project (QUAL-09): webkit now lives in its own job
    # (`e2e-webkit`) instead of being sharded here alongside chromium.
    # $E2E_PATHS is empty (no filter, the full suite) when affected-scope.mjs
    # saw everything=true.
    - name: Run Playwright e2e tests (product chromium, shard ${{ matrix.shard }}/2)
      env:
        E2E_PATHS: ${{ steps.affected.outputs.e2e_paths }}
      run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2 --pass-with-no-tests $E2E_PATHS

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-product-shard-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

  # QUAL-09 (2026-09-14): webkit and the perf budgets run once here, unsharded,
  # instead of inside the `e2e` matrix above. Measured on run 34788031094:
  # each chromium shard's `playwright install --with-deps chromium webkit`
  # cost 51s to install a browser that only ran 21 webkit tests, about 32s of
  # test time; both shards paid the 51s, and after QUAL-06 rebalanced the font
  # guards, the `e2e` shards were the wall at 180-210s. Splitting webkit out
  # means the two chromium shards install and run chromium only, and webkit
  # plus the perf budgets are installed and run exactly once, here.
  e2e-webkit:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Right after npm ci (needs node_modules for `nx`), so this job and the
    # chromium shards agree on the same affected paths - see the workflow
    # header comment and docs/nx-affected-ci.md. Empty e2e_paths means either
    # everything=true (run the full suite) or nothing e2e-relevant is
    # affected; either way, `--pass-with-no-tests` below makes a narrowed,
    # zero-match project exit 0 instead of Playwright's default failure.
    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    - name: Build
      run: npm run build

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        # Own key, distinct from `e2e`'s and `font-guards`'s: this job caches
        # a different browser set (chromium + webkit) than either, and
        # sharing a key with one of them would evict on alternating runs.
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit

    # Also installs chromium: the `perf` project is chromium-based (see
    # `devices['Desktop Chrome']` in playwright.config.js), and the perf
    # budgets run in this job too, on the job that has the spare time after
    # dropping webkit from the two chromium shards.
    #
    # QUAL-09's own measurement (run 34788031094) was against the old shape
    # where each of the two chromium shards paid `install --with-deps chromium
    # webkit` uncached, at 51s a shard; that measurement never covered this
    # job, which pays the combined apt cost exactly once instead of twice.
    # Caching that one-time apt cost trades a restore for a chromium+webkit
    # `install-deps`, which is worth it whenever the restore is cheaper than
    # apt, per the same reasoning as `e2e` above. PROJECTION, not a fresh CI
    # measurement (nothing here can exercise GitHub's real cache backend) -
    # whoever reviews the next few runs should confirm the cache actually
    # hits and actually saves the time this comment assumes.
    - name: Install Playwright browsers (cache miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium webkit

    - name: Install Playwright system dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium webkit

    - name: Run Playwright e2e tests (product webkit)
      env:
        E2E_PATHS: ${{ steps.affected.outputs.e2e_paths }}
      run: npx playwright test --project=webkit --pass-with-no-tests $E2E_PATHS

    # The wall-clock budget specs, on one worker so nothing else on the
    # runner is in the measurement (see PERF_BUDGETS in playwright.config.js).
    # Moved here from `e2e` shard 1 by QUAL-09: this job has the spare time
    # once the chromium shards stop installing webkit.
    - name: Run Playwright e2e tests (performance budgets, one worker)
      env:
        E2E_PATHS: ${{ steps.affected.outputs.e2e_paths }}
      run: npx playwright test --project=perf --workers=1 --pass-with-no-tests $E2E_PATHS

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-product-webkit
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

  # Classifies the change, so the jobs above run only when it can reach them.
  # `docs_only` (backlog, docs, guidance, root markdown: a third of the commits
  # on main, which used to build the site and open browsers to validate a
  # task file) lives in scripts/change-scope.mjs, unchanged by ARCH-20 - it
  # answers "did anything buildable change at all," not a per-project
  # question. A docs-only change is checked right here, by the two guards
  # that read those files. Fails open: without a resolvable base, nothing is
  # docs-only and every other job runs.
  #
  # Also runs on `schedule` (not just `push`/`pull_request`) so its own
  # `nightly_unchanged` output can gate the nightly cron: `docs_only` resolves
  # to false there (no `before` sha to diff against), which is harmless - it
  # only widens, and `nightly_unchanged` is the output that actually narrows a
  # scheduled run. `workflow_dispatch` (the manual baseline recapture) is
  # deliberately left out here: it still skips `scope` entirely and fails open
  # through `needs.scope.result != 'success'`, same as before.
  #
  # This job stays dependency-free (no `npm ci`) on purpose - see the
  # workflow header comment. It resolves BASE once and outputs it as `base`
  # so `checks`, each `e2e` shard, each `font-guards` shard, `export-guards` and `e2e-webkit`
  # can each run their own `scripts/affected-scope.mjs` (which needs
  # `node_modules` for `nx`, hence cannot live here) against the same diff.
  scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base: ${{ steps.classify.outputs.base }}
      nightly_unchanged: ${{ steps.nightly.outputs.unchanged }}
    permissions:
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'

    # The nightly cron is a backstop for a runner-image or browser change none
    # of our own commits made (see the workflow header); on a quiet repo there
    # is nothing new for it to catch. Compares HEAD against the most recent
    # *completed* scheduled run's commit, not the last push - a push already
    # ran the full matrix itself, so what the nightly needs to know is whether
    # anything has landed since it last ran. Fails open (unchanged=false) on
    # the first-ever scheduled run or any API error, same policy as
    # `docs_only` below: an unresolvable comparison never hides a real run.
    - name: Check for commits since the last nightly run
      id: nightly
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        LAST_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=1" \
          --jq '.workflow_runs[0].head_sha // empty' || echo "")
        if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
          echo "unchanged=true" >> "$GITHUB_OUTPUT"
        else
          echo "unchanged=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Classify the change against its base
      id: classify
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/change-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"
        echo "base=$BASE" >> "$GITHUB_OUTPUT"

    # Dependency-free node scripts, so no `npm ci` here.
    - name: Validate backlog and generated indexes (docs-only change)
      if: steps.classify.outputs.docs_only == 'true'
      run: npm run check:backlog

    - name: Validate agent guidance budget (docs-only change)
      if: steps.classify.outputs.docs_only == 'true'
      run: npm run check:guidance

  # The 25 font screening guards (the `fonts` Playwright project): shaping
  # guards per script, font parity, Hebrew composition. This job now starts on
  # every non-docs run (same fail-open `if:` as `checks`/`build`/`e2e`) and
  # computes its own `fonts` boolean right after `npm ci`, via
  # scripts/affected-scope.mjs's `matchesFontsGlob` file-glob rule (ARCH-23,
  # 2026-09-18: public/fonts, src/editor/text, editorFonts.css, scripts/fonts,
  # the guard specs/fixtures under e2e/sign, playwright.config.js; the steps
  # gate on `!= 'false'` so a missing output runs them, fail-open) - ARCH-20
  # first retired the hand-kept `FONT_GUARD_INPUTS` list this used to read
  # from the `scope` job in favour of asking Nx whether `fonts` was affected;
  # ARCH-23 then found that Nx edge (`fonts` declaring `editor`/`lib`/
  # `tool-sign` as whole-project dependencies) ran all 27 guards on a Sign
  # toolbar/tooltip change with zero measured coverage benefit, so the
  # per-push decision is a glob again - see backlog/tasks/ARCH-23.md and
  # docs/nx-affected-ci.md's "ARCH-23" section. Every step after that reads
  # costs one runner ~20s in parallel with `checks`/`e2e` and no wall time
  # when fonts is not affected; on the nightly schedule and a manual dispatch
  # (no `scope` job, no base) affected-scope.mjs's own fail-open rule makes
  # fonts=true, so those still run. The two guards that exercise the real
  # export pipeline (the export render guard, language acceptance) are the
  # `export-guards` job below, not part of this one any more.
  #
  # QUAL-06 (2026-09-14): matrixed into two shards balanced by measured time
  # in playwright.config.js (`fonts-shard-1`/`fonts-shard-2`), because on
  # every run where the guards ran this job was the long pole (144-251s
  # against 135-180s for the `e2e` shards). Both shards compute the same
  # `fonts` verdict from affected-scope.mjs and skip together. The exported-PDF
  # baseline recapture step used to live here (shard 1 only, since the export
  # render guard was its heaviest named spec) - ARCH-23 moved both to the
  # `export-guards` job below, alongside the guard that owns the baseline.
  font-guards:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    - name: Build
      if: steps.affected.outputs.fonts != 'false'
      run: npm run build

    - name: Resolve Playwright version
      id: playwright
      if: steps.affected.outputs.fonts != 'false'
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      if: steps.affected.outputs.fonts != 'false'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Playwright browsers
      if: steps.affected.outputs.fonts != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.affected.outputs.fonts != 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Run Playwright e2e tests (font guards, shard ${{ matrix.shard }}/2)
      if: steps.affected.outputs.fonts != 'false'
      run: npx playwright test --project=fonts-shard-${{ matrix.shard }}

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-fonts-shard-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

  # ARCH-23 (2026-09-18): the two guards that actually exercise the export
  # pipeline - export-render-guard.spec.js (rasterises the real `signPdf`
  # output against a runner-pinned baseline) and language-acceptance.spec.js
  # (the same bundle over every shipped language/face combination) - split out
  # of `font-guards` above into their own project (`export-guards`,
  # e2e/export/). Unlike `fonts`, this project's Nx implicitDependencies stay
  # coarse on purpose (editor, lib, tool-sign, font-assets - see
  # e2e/export/project.json), so `export_guards` is a normal Nx-affected
  # verdict from scripts/affected-scope.mjs, not a glob: a Sign toolbar or
  # tooltip change still runs these two (cheap, well under a minute combined),
  # it just no longer drags the other 25 font guards with it. No matrix - two
  # specs do not need sharding.
  export-guards:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    - name: Build
      if: steps.affected.outputs.export_guards != 'false'
      run: npm run build

    - name: Resolve Playwright version
      id: playwright
      if: steps.affected.outputs.export_guards != 'false'
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      if: steps.affected.outputs.export_guards != 'false'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    - name: Install Playwright browsers
      if: steps.affected.outputs.export_guards != 'false' && steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Install Playwright system dependencies
      if: steps.affected.outputs.export_guards != 'false' && steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    - name: Run Playwright e2e tests (export guards)
      if: steps.affected.outputs.export_guards != 'false'
      run: npx playwright test --project=export-guards

    # Prints the recaptured baseline rather than committing it. Review the
    # decoded file before it lands: a baseline change is a change to what users
    # receive. Moved here from `font-guards` (ARCH-23) alongside the guard
    # that owns the baseline; no shard to gate on any more.
    - name: Recapture exported-PDF render baseline (manual runs only)
      # always(), because a step's `if` otherwise still implies success() and
      # the e2e step above is exactly the one expected to be red when a
      # baseline needs recapturing.
      if: ${{ always() && inputs.update-export-render-baseline }}
      env:
        UPDATE_EXPORT_RENDER_BASELINE: '1'
      run: |
        npx playwright test e2e/export/export-render-guard --reporter=list || true
        echo "BASELINE_GZ_B64_START"
        gzip -9 -c e2e/export/fixtures/exportRenderBaseline.json | base64 -w 3000
        echo "BASELINE_GZ_B64_END"

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-export-guards
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
