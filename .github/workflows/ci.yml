name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # The font guards are path-gated below; the nightly run is the backstop that
  # catches a runner image or browser change none of our own commits made. It
  # skips itself (via `scope`'s `nightly_unchanged` output) when nothing has
  # landed since its own last completed run - a quiet repo has nothing new for
  # it to catch, and the previous night's run already vouched for that commit.
  # It also runs every chromium spec twice, as a flake pass (QUAL-24).
  # A manual run with the `nightly` input set takes this same path on demand.
  schedule:
    - cron: "17 3 * * *"
  # The exported-PDF render guard's baseline is platform-bound and must be
  # captured on this runner, never on a developer's machine - see
  # BASELINE_PLATFORM in e2e/sign/fixtures/exportRenderHarness.js. Running the
  # workflow manually with this input set captures it here and prints it for
  # review; it is never committed automatically, because the whole point of a
  # stored baseline is that somebody looks at the diff.
  workflow_dispatch:
    inputs:
      update-export-render-baseline:
        description: "Recapture the exported-PDF render baseline on this runner and print it"
        type: boolean
        default: false
      nightly:
        description: "Run the nightly path: scope, every chromium spec twice, update-cost, flake report"
        type: boolean
        default: false

# Jobs run in parallel, so the wall time is the longest chain, not the sum. All of them wait on the
# `scope` job (about 10s) and skip when the change is docs-only; when scope produces no verdict they
# run, so a broken classifier costs time, never coverage.
#
# QUAL-42: `plan` runs once per run. It resolves the affected scope (`scripts/affected-scope.mjs`,
# which needs node_modules for `nx`, hence cannot live in `scope`), sizes the e2e matrix by the number
# of specs in scope, builds `dist/` and uploads it as the `dist` artifact. `build` (the guards that
# read dist/), each `e2e` shard, `e2e-webkit`, each `font-guards` shard and `export-guards` download
# that artifact and read the scope from plan's outputs instead of installing, resolving and building
# for themselves. `checks` and `units` read no build and run beside it. `scope` stays free of
# `npm ci` (about 6s) and adds a `base` output, the resolved base sha, that plan and `checks` reuse so
# every job agrees on the same diff. The affected computation is described in docs/nx-affected-ci.md.
#
# `e2e` is a matrix beside `build` (QUAL-05, QUAL-23); `e2e-webkit` (QUAL-09) is a separate,
# unsharded job, so the chromium shards run chromium only.
# DEBT-35: the one build here is stamped with the commit, exactly like a Vercel build, so the build
# guards run on what ships and e2e/error-report-build.spec.js (which reads this variable) fails if
# a stamped build ever stops carrying the tag. Workflow-level, not per step.
# QUAL-26: a newer push to the same pull request cancels its older run. Every
# other event (push to main, the nightly, a manual dispatch) gets a group of
# its own run id, which nothing else ever joins, so it always runs to the end.
# A `cancel-in-progress` expression on the event name queued the newer PR run
# but left the running one going (PR #41), hence the literal `true`.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

jobs:
  # Everything that needs no build: source guards (the unit suite is `units`, ARCH-86).
  checks:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5
      with:
        # Full history: src/site-lib/gitLastModified.test.js dates a real
        # guide from git and refuses a shallow boundary commit, so on the
        # default depth-1 checkout it would see null and fail. Same reason
        # and cost as `build` below (30 MB against 24 MB, 2026-09-14).
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # backlog/tasks/*.md is the canonical board; BACKLOG.md and TODO.md are
    # generated from it. Fails on malformed task metadata, a dependency that
    # does not resolve, or a stale generated view (ARCH-12). Source guards
    # stay unconditional - nothing in scripts/, backlog/ or docs/ is claimed
    # by any Nx project on purpose (see docs/nx-affected-ci.md's root-project
    # trap), so `nx affected` was never going to narrow these anyway.
    - name: Validate backlog and generated indexes
      run: npm run check:backlog

    # CLAUDE.md loads into every agent session; the topic detail lives in
    # .claude/rules/*.md, loaded only for matching files. Fails if CLAUDE.md
    # exceeds its line budget, a rule lacks paths: frontmatter, or a glob
    # matches nothing.
    - name: Validate agent guidance budget
      run: npm run check:guidance

    # SEO-37: English copy must not use the section 7 never-say phrases or the
    # intensifiers SEO-36 removed (scripts/check-never-say.mjs holds the list).
    - name: Validate never-say copy
      run: npm run check:never-say

    # Also covers the box-resize single-owner rule (exactly one file under
    # src/ may mention maxWidthFromRightGrowth/maxHeightFromBottomGrowth),
    # folded in under DEBT-12 from its own `git grep` step here so it also
    # runs in check:fast, not only in CI.
    - name: Verify editor dependency directions
      run: npm run test:editor-dependency-directions

    # docs/module-boundaries.md (ARCH-15) draws the target layout; this reads
    # the real import graph and fails on any edge that crosses it, against an
    # explicit, shrink-only allowlist of today's violations.
    - name: Verify module boundaries
      run: npm run test:module-boundaries

    # ARCH-44: cross-layer imports use the #lib/#editor/#editor-ui/#shell aliases.
    - name: Verify import aliases
      run: npm run test:import-aliases

    # Everything an api/ function or middleware.ts reaches imports relatively with .js: the
    # function build cannot load an alias or a .ts specifier (ARCH-44 took /api/report down for 6h).
    - name: Verify function imports
      run: npm run test:function-imports

    # ARCH-76: scripts/ratchet-limits.json holds every ratchet limit; a value that
    # rose (or an entry added to an existing section) against the base fails here.
    # BASE is empty when the scope job could not resolve one; the script then
    # falls back to the merge base with origin/main.
    - name: Refuse raised ratchet limits
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: npm run test:ratchet-raises -- --base "$BASE"

    # ARCH-50: files over 800 lines and functions over 300 are recorded in the same
    # JSON; one that grew, or a new one over the threshold, fails.
    - name: Verify size ratchet
      run: npm run test:size-ratchet

    # ARCH-66: files with more than 10 hook calls are recorded with their hook and effect
    # counts; a record where either rose, or a new file over the threshold, fails.
    - name: Verify hook ratchet
      run: npm run test:hook-ratchet

    # ARCH-70: explicit any in src/tools is counted (comments and strings excluded) and only shrinks.
    - name: Verify any ratchet
      run: npm run test:any-ratchet

    # ARCH-80: test files carrying @ts-nocheck only get fewer (scripts/ts-nocheck-limit.json).
    - name: Verify the ts-nocheck ratchet
      run: npm run test:ts-nocheck-ratchet

    - name: Verify e2e sleep ratchet
      run: npm run test:e2e-sleeps

    - name: Verify floating promises are handled
      run: npm run test:floating-promises

    - name: Verify no IntersectionObserver reveals what JS hid
      run: npm run test:reveal-observers

    - name: Verify every fetch site is listed with its reason
      run: npm run test:fetch-sites

    - name: Verify patched dependencies are pinned to their patch
      run: npm run test:patch-pins

    - name: Verify every tool folder follows the template
      run: npm run test:tool-shape

    - name: Verify typed JavaScript folders and the .js file ratchet
      run: npm run test:js-typed

    - name: Verify the unused-exports ratchet
      run: npm run test:unused-exports

    # ARCH-81: every pure module in lib, editor and the tools has a test that references it; the allowlist only shrinks.
    - name: Verify every pure module has a test
      run: npm run test:untested-modules

    - name: Verify every island renders inside the error boundary
      run: npm run test:island-boundary

    - name: Verify gesture golden-rule (static)
      run: npm run test:gesture-golden-rule

    # DEBT-27: a catch that drops its error must report it, rethrow, or say
    # why (// expected:). Zero tolerance; `npm run test:swallowed-errors -- --list` shows findings.
    - name: Verify no new swallowed errors
      run: npm run test:swallowed-errors

    # DEBT-21: a flag set on the path that navigates away must be
    # useNavigatingAway(), or Back (bfcache) restores it set and the control dead.
    - name: Verify navigating-away flags survive a Back
      run: npm run test:navigating-away

    # FORM-22: field detection (src/tools/sign/fields/'s ink/widget/cell
    # detectors, plus the scored corpus's scoring loader) stays plain data in,
    # plain data out - no pdf-lib/pdf.js/DOM/time/random touch outside a named
    # boundary shim, no module-level mutable state. Source-side, so it needs
    # no build; see scripts/check-detection-purity.mjs's own header for why it
    # parses with the TypeScript compiler API rather than scanning raw text.
    - name: Verify field detection stays pure
      run: npm run test:detection-purity

    # Source-side, so it needs no build. It also runs again inside test:css in
    # the build job, for anyone running that locally.
    - name: Verify every class string resolves to CSS
      run: node scripts/check-class-resolution.js

    # Source-side, so it needs no build. Guards the fontkit TTF subsetter (used by
    # sign.js's `{ subset: true }` font embedding) against unaligned `glyf` outlines,
    # which subset into corrupt/missing glyphs in the exported PDF. See the script's
    # header comment for the Kalam-Regular/Kalam-Bold incident this catches.
    - name: Verify bundled font glyf alignment
      run: npm run test:fonts

    - name: Verify reviewed runtime dependency licenses
      run: npm run test:licenses

    # A dependency update is only safe to automate while the same PR still
    # reaches the release checks below, including the platform-bound render
    # guard. This locally validates that wiring on every PR.
    - name: Verify dependency governance wiring
      run: npm run test:dependency-governance

    # QUAL-39: the `units` shards together run each unit file exactly once.
    - name: Verify the unit shards cover the suite exactly once
      run: npm run check:unit-shards

    # QUAL-41: every file a spec reads directly is selected, with that spec, by a scope rule.
    - name: Verify every file a spec reads has a scope rule
      run: npm run test:spec-file-reads

  # ARCH-86: the unit suite beside the guards in `checks`, so neither delays the other's verdict.
  # QUAL-39: two `vitest --shard` jobs, so the long pole of a narrowed run is half as long. `checks`
  # proves the two halves cover every unit file exactly once (scripts/check-unit-shards.mjs).
  units:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@v5
      with:
        # Full history: src/site-lib/gitLastModified.test.js dates a real
        # guide from git and refuses a shallow boundary commit, so on the
        # default depth-1 checkout it would see null and fail. Same reason
        # and cost as `build` below (30 MB against 24 MB, 2026-09-14).
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # poppler-utils gives the W6 extraction guard (src/lib/sign.test.js) its
    # `pdftotext` half. Without it that half self-skips with a warning, which
    # would leave the one assertion that actually proves /ActualText works
    # running only on a developer's machine.
    - name: Install poppler-utils (pdftotext, for the W6 extraction guard)
      run: bash scripts/ci-bounded-apt.sh 120 300 bash -c 'apt-get update && apt-get install -y poppler-utils'

    # QUAL-24 (2026-10-18) moved unit narrowing to local checks only; CI runs
    # every unit file on every push.
    - name: Run tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
      run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # QUAL-42: the one place that resolves the affected scope and builds. Every consumer downloads
  # `dist` and reads the scope from these outputs. A dependency bump that breaks the build fails here
  # once (this replaces the old dependabot-only build gate). Full history, because the site build
  # dates pages from git (see `build`). `product_e2e` false means no e2e job runs; `e2e_shards` is a
  # JSON array of 1..4 numbers sized by the spec count in scope (scripts/e2e-shard-count.mjs).
  plan:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')
    outputs:
      product_e2e: ${{ steps.affected.outputs.product_e2e }}
      e2e_paths: ${{ steps.affected.outputs.e2e_paths }}
      fonts: ${{ steps.affected.outputs.fonts }}
      export_guards: ${{ steps.affected.outputs.export_guards }}
      everything: ${{ steps.affected.outputs.everything }}
      e2e_shards: ${{ steps.shards.outputs.e2e_shards }}

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # An empty e2e_paths is ambiguous (everything=true or nothing e2e-relevant is affected) and an
    # empty filter runs every spec, so the e2e jobs are gated on `product_e2e` (QUAL-32).
    - name: Resolve affected scope
      id: affected
      env:
        BASE: ${{ needs.scope.outputs.base }}
      run: |
        # No --depth: the checkout is full history and the site build dates pages from it; a depth-limited fetch makes the clone shallow.
        if [ -n "$BASE" ]; then git fetch --no-tags origin "$BASE" || true; fi
        node scripts/affected-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"

    - name: Size the e2e matrix
      id: shards
      if: steps.affected.outputs.product_e2e != 'false'
      env:
        EVERYTHING: ${{ steps.affected.outputs.everything }}
        E2E_PATHS: ${{ steps.affected.outputs.e2e_paths }}
      run: |
        if [ "$EVERYTHING" = "true" ]; then
          node scripts/e2e-shard-count.mjs --everything >> "$GITHUB_OUTPUT"
        else
          node scripts/e2e-shard-count.mjs --paths "$E2E_PATHS" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      run: npm run build

    # include-hidden-files: dist/.well-known is a dot directory and would be dropped without it.
    - name: Upload dist
      uses: actions/upload-artifact@v5
      with:
        name: dist
        path: dist/
        include-hidden-files: true
        overwrite: true
        retention-days: 3
        if-no-files-found: error

  # The guards that read dist/. The product e2e suite is the `e2e` job below and the font guards have
  # their own job further down; all of them download plan's build.
  # astro check is CI-only since QUAL-24; local checks run tsc.
  typecheck:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true')

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [scope, plan]
    if: always() && needs.scope.outputs.nightly_unchanged != 'true' && (needs.scope.result != 'success' || needs.scope.outputs.docs_only != 'true') && needs.plan.result == 'success'

    steps:
    - uses: actions/checkout@v5
      with:
        # Full history, not the default depth 1: `build` runs test:seo, which
        # now fails when a content page has no "Last updated" date, and
        # src/site-lib/gitLastModified.js can only date a file from history the
        # clone holds (a shallow boundary commit is refused as unknowable). The
        # full pack is 30 MB against 24 MB shallow, measured 2026-09-14.
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist

    - name: Verify CSP hashes
      run: npm run test:csp

    - name: Verify SEO invariants
      run: npm run test:seo

    - name: Verify trailing-slash redirects cover every real route
      run: npm run test:redirects

    - name: Check CSS correctness and duplication
      run: npm run test:css

    - name: Check first-load page weight
      run: npm run test:weight

    # Field detection is Sign-only and behind a dynamic import; nothing in the
    # language keeps it there, so this walks the built graph a page at a time.
    - name: Check Sign-only modules stay out of every page's first paint
      run: npm run test:lazy-modules

    # What the service worker downloads: the shell and each page's closure,
    # budgeted, and no page carrying another tool's island chunk.
    - name: Check precache closures stay within budget
      run: npm run test:precache-budget

    # MEM-25: pages name /site/ entries and the hot chunks keep /shared/ names, so a shared-module
    # change does not rewrite every page.
    - name: Check client entries and hot chunks keep stable names
      run: npm run test:stable-names

  # The product e2e suite, a matrix sized by plan from the spec count in scope (QUAL-42; QUAL-05 and
  # QUAL-23 split it). Files shard whole and in path order. Every chromium spec except the font guards
  # (their own job below) and webkit/perf (`e2e-webkit`, QUAL-09). Each shard downloads plan's `dist`
  # instead of building, so the guards in `build` vouch for exactly what these specs load.
  e2e:
    runs-on: ubuntu-latest
    needs: [scope, plan, playwright-version]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.product_e2e != 'false' && needs.playwright-version.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.e2e_shards || '[1]') }}
    # QUAL-29: Playwright's own image, as `e2e-webkit` below, so no shard waits on the Ubuntu mirror for
    # `install-deps chromium` (11 and 13+ min on two shards of run 40394949781). `font-guards` stays on
    # the runner: its pixel thresholds were measured against the runner's own fonts.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host

    steps:
    - uses: actions/checkout@v5

    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist

    # One command per project (QUAL-09): webkit now lives in its own job
    # (`e2e-webkit`) instead of being sharded here alongside chromium.
    # $E2E_PATHS is empty (no filter, the full suite) only when affected-scope.mjs
    # saw everything=true; the job is skipped when product_e2e=false.
    # On the nightly (cron or a nightly dispatch) every chromium spec runs twice (the chromium
    # project has no retries), so a flaky spec turns the nightly red instead
    # of a push (QUAL-24).
    - name: Run Playwright e2e tests (product chromium, shard ${{ matrix.shard }}/${{ strategy.job-total }})
      env:
        E2E_PATHS: ${{ needs.plan.outputs.e2e_paths }}
        REPEAT: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) && '--repeat-each=2' || '' }}
      run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }} --pass-with-no-tests $REPEAT $E2E_PATHS

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-product-shard-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

    # ARCH-85: the JSON report of every run, kept for the nightly flake aggregation.
    - name: Upload Playwright JSON report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-json-product-shard-${{ matrix.shard }}
        path: playwright-json/
        retention-days: 30
        if-no-files-found: ignore

  # QUAL-09: webkit and the perf budgets run once here, unsharded, so the `e2e` shards run chromium
  # only. Like them it downloads plan's `dist` and gates on plan's `product_e2e`.
  e2e-webkit:
    # Pinned (QUAL-28, 2026-10-25): ubuntu-latest became Ubuntu 26.04 and
    # Playwright's WebKit build cannot start there (no libicudata.so.74), so
    # every webkit test failed at launch. Back to ubuntu-latest once a
    # Playwright release runs WebKit on 26.04.
    runs-on: ubuntu-24.04
    needs: [scope, plan, playwright-version]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.product_e2e != 'false' && needs.playwright-version.result == 'success'
    # QUAL-29 (2026-10-26): Playwright's own image, with chromium, webkit and every system library they
    # need already in it. `install-deps` used to fetch about 119 MB of WebKit libraries from the Azure
    # Ubuntu mirror on every run, usually in 30s but in 35-55 min on 6 runs that day (48 kB/s, run
    # 40361495800). The tag is the lockfile's Playwright version (the `playwright-version` job), so the
    # browsers in the image are the ones the tests expect.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Docker's 64 MB /dev/shm is too small for Chromium (the perf budgets run here); Playwright's
      # Docker guide asks for the host's IPC namespace.
      options: --ipc=host

    steps:
    - uses: actions/checkout@v5

    # The container's git did not create the workspace, so it would refuse it as "dubious ownership".
    - name: Trust the workspace for git
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist

    - name: Run Playwright e2e tests (product webkit)
      env:
        E2E_PATHS: ${{ needs.plan.outputs.e2e_paths }}
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-json/webkit.json
      run: npx playwright test --project=webkit --pass-with-no-tests $E2E_PATHS

    # The wall-clock budget specs, on one worker so nothing else on the
    # runner is in the measurement (see PERF_BUDGETS in playwright.config.js).
    # Moved here from `e2e` shard 1 by QUAL-09: this job has the spare time
    # once the chromium shards stop installing webkit.
    - name: Run Playwright e2e tests (performance budgets, one worker)
      env:
        E2E_PATHS: ${{ needs.plan.outputs.e2e_paths }}
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-json/perf.json
      run: npx playwright test --project=perf --workers=1 --pass-with-no-tests $E2E_PATHS

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-product-webkit
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

    # ARCH-85: the JSON report of every run, kept for the nightly flake aggregation.
    - name: Upload Playwright JSON report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-json-product-webkit
        path: playwright-json/
        retention-days: 30
        if-no-files-found: ignore

  # ARCH-83: how far affected-scope narrowed this run, written to the job
  # summary. A job of its own rather than a step of `scope`, because `scope`
  # has no node_modules (and stays ~6s so every other job can start); this
  # one needs `nx`. Nothing `needs` it, so it can neither delay nor fail the
  # run. Reporting only.
  scope-summary:
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.result == 'success' && needs.scope.outputs.nightly_unchanged != 'true'
    continue-on-error: true
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Write the narrowing summary
      env:
        BASE: ${{ needs.scope.outputs.base }}
        DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/scope-summary.mjs --base "$BASE"

  # ARCH-85: per-spec flake rates over the last N main runs, from the JSON
  # reports the Playwright jobs upload. Nightly only. Reporting only: it
  # never fails the run, and nothing needs it.
  flake-report:
    runs-on: ubuntu-latest
    needs: [scope, e2e]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUNS: 30
    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'

    - name: Download the JSON reports of the last main runs
      run: |
        mkdir -p flake-reports
        for id in $(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch main --status completed --limit "$RUNS" --json databaseId --jq '.[].databaseId'); do
          gh run download "$id" --repo "${{ github.repository }}" --pattern 'playwright-json-*' --dir "flake-reports/$id" || true
        done

    - name: Aggregate per-spec failure and retry rates
      run: node scripts/flake-report.mjs --dir flake-reports --runs "$RUNS" --threshold 0.02

  # ARCH-123: how often the last 50 pushes to main narrowed, replayed against today's project graph.
  # Nightly only. Reporting only: it never fails the run, and nothing needs it.
  narrowing-share:
    runs-on: ubuntu-latest
    needs: scope
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Write the narrowed share of the last main pushes
      env:
        GH_TOKEN: ${{ github.token }}
      run: node scripts/narrowing-share.mjs --limit 50

  # The Playwright version the `e2e` and `e2e-webkit` containers are tagged with: Playwright's image
  # carries the browsers of one release, so the tag comes from the lockfile, never a copy kept by hand.
  # Its own job, not a step of `scope`, because `scope` is skipped on workflow_dispatch and both e2e
  # jobs run then too.
  playwright-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
    - uses: actions/checkout@v5
      with:
        sparse-checkout: package-lock.json
        sparse-checkout-cone-mode: false

    - name: Read @playwright/test from the lockfile
      id: read
      run: |
        VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Classifies the change, so the jobs above run only when it can reach them.
  # `docs_only` (backlog, docs, guidance, root markdown: a third of the commits
  # on main, which used to build the site and open browsers to validate a
  # task file) lives in scripts/change-scope.mjs, unchanged by ARCH-20 - it
  # answers "did anything buildable change at all," not a per-project
  # question. A docs-only change is checked right here, by the two guards
  # that read those files. Fails open: without a resolvable base, nothing is
  # docs-only and every other job runs.
  #
  # Also runs on `schedule` (not just `push`/`pull_request`) so its own
  # `nightly_unchanged` output can gate the nightly cron: `docs_only` resolves
  # to false there (no `before` sha to diff against), which is harmless - it
  # only widens, and `nightly_unchanged` is the output that actually narrows a
  # scheduled run. A plain `workflow_dispatch` (the manual baseline recapture)
  # still skips `scope` entirely and fails open through
  # `needs.scope.result != 'success'`; a dispatch with `nightly: true` runs it
  # like the scheduled path.
  #
  # This job stays dependency-free (no `npm ci`) on purpose - see the
  # workflow header comment. It resolves BASE once and outputs it as `base`
  # so `plan` (which runs `scripts/affected-scope.mjs`, needing `node_modules`
  # for `nx`) and `checks` work against the same diff.
  scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly))
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      base: ${{ steps.classify.outputs.base }}
      nightly_unchanged: ${{ steps.nightly.outputs.unchanged }}
    permissions:
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true

    # The nightly cron is a backstop for a runner-image or browser change none
    # of our own commits made (see the workflow header); on a quiet repo there
    # is nothing new for it to catch. Compares HEAD against the most recent
    # *completed* scheduled run's commit, not the last push - a push already
    # ran the full matrix itself, so what the nightly needs to know is whether
    # anything has landed since it last ran. Fails open (unchanged=false) on
    # the first-ever scheduled run or any API error, same policy as
    # `docs_only` below: an unresolvable comparison never hides a real run.
    - name: Check for commits since the last nightly run
      id: nightly
      # Schedule-only on purpose: a manual nightly is an explicit ask and never skips itself.
      if: github.event_name == 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        LAST_SHA=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?event=schedule&status=completed&per_page=1" \
          --jq '.workflow_runs[0].head_sha // empty' || echo "")
        if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "${{ github.sha }}" ]; then
          echo "unchanged=true" >> "$GITHUB_OUTPUT"
        else
          echo "unchanged=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Classify the change against its base
      id: classify
      env:
        BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -n "$BASE" ]; then git fetch --no-tags --depth=1 origin "$BASE" || true; fi
        node scripts/change-scope.mjs --base "$BASE" >> "$GITHUB_OUTPUT"
        echo "base=$BASE" >> "$GITHUB_OUTPUT"

    # Dependency-free node scripts, so no `npm ci` here.
    - name: Validate backlog and generated indexes (docs-only change)
      if: steps.classify.outputs.docs_only == 'true'
      run: npm run check:backlog

    - name: Validate agent guidance budget (docs-only change)
      if: steps.classify.outputs.docs_only == 'true'
      run: npm run check:guidance

  # MEM-21: what a returning client's service worker update downloads, between
  # the last two production deploys, against a target of about 500 KB brotli.
  # The deploys come from the GitHub deployments Vercel records: main's first
  # parent is not a deploy (a branch merged with main lands as a merge whose
  # first parent is the branch), and a docs-only push deploys nothing. One build
  # per commit, so it runs only on the nightly, and skips with it when nothing
  # has landed (`nightly_unchanged`).
  # A reading over the 500 KB target fails the nightly: a CSS Module edit changes only its own sheet
  # (MEM-26) and tool pages link their shared CSS instead of inlining it (MEM-27), so an ordinary
  # style deploy reads about 35 KB.
  update-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: scope
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) && needs.scope.outputs.nightly_unchanged != 'true'
    permissions:
      contents: read
      deployments: read

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Find the last two production deploys
      id: deploys
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        node scripts/lastDeploys.mjs "${{ github.repository }}" >> "$GITHUB_OUTPUT"

    # Both deploys build at one path: Astro hashes each island's absolute source path into its
    # `uid`, so two paths rewrite every island page (about 880 KB of a 907 KB reading, 2026-10-28).
    - name: Build both deploys
      run: |
        git worktree add --detach "$RUNNER_TEMP/build" "${{ steps.deploys.outputs.before }}"
        for side in before after; do
          sha=$([ "$side" = before ] && echo "${{ steps.deploys.outputs.before }}" || echo "${{ steps.deploys.outputs.after }}")
          git -C "$RUNNER_TEMP/build" checkout --detach --force "$sha"
          git -C "$RUNNER_TEMP/build" clean -fdxq
          (cd "$RUNNER_TEMP/build" && npm ci && npm run build && mv dist "$RUNNER_TEMP/dist-$side")
        done

    - name: Measure the update cost
      run: npm run measure:update-cost -- "$RUNNER_TEMP/dist-before" "$RUNNER_TEMP/dist-after"

  # The 25 font screening guards (the `fonts` Playwright project): shaping guards per script, font
  # parity, Hebrew composition. Gated on plan's `fonts` verdict, which is the file-glob rule
  # `matchesFontsGlob` in scripts/affected-scope.mjs (ARCH-23; see docs/nx-affected-ci.md), and fail-open:
  # `!= 'false'`. The nightly, a nightly dispatch and a plain manual dispatch make fonts=true. Matrixed
  # into two shards balanced by measured time (QUAL-06: `fonts-shard-1`/`fonts-shard-2` in
  # playwright.config.js). These run on the plain runner, never the Playwright container: their pixel
  # thresholds were measured against the runner's own fonts. The export guards are the job below.
  font-guards:
    runs-on: ubuntu-latest
    needs: [scope, plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.fonts != 'false'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    # QUAL-33: apt is bounded at 120 s, retry 300 s; the browser download is separate.
    - name: Install Playwright system dependencies
      run: bash scripts/ci-bounded-apt.sh 120 300 npx playwright install-deps chromium

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium

    - name: Run Playwright e2e tests (font guards, shard ${{ matrix.shard }}/2)
      run: npx playwright test --project=fonts-shard-${{ matrix.shard }}

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-fonts-shard-${{ matrix.shard }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore

  # ARCH-23 (2026-09-18): the two guards that actually exercise the export
  # pipeline - export-render-guard.spec.js (rasterises the real `signPdf`
  # output against a runner-pinned baseline) and language-acceptance.spec.js
  # (the same bundle over every shipped language/face combination) - split out
  # of `font-guards` above into their own project (`export-guards`,
  # e2e/export/). Unlike `fonts`, this project's Nx implicitDependencies stay
  # coarse on purpose (editor, lib, tool-sign, font-assets - see
  # e2e/export/project.json), so `export_guards` is a normal Nx-affected
  # verdict from scripts/affected-scope.mjs, not a glob: a Sign toolbar or
  # tooltip change still runs these two (cheap, well under a minute combined),
  # it just no longer drags the other 25 font guards with it. No matrix - two
  # specs do not need sharding. Gated on plan's `export_guards`, downloads plan's `dist`.
  export-guards:
    runs-on: ubuntu-latest
    needs: [scope, plan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.export_guards != 'false'

    steps:
    - uses: actions/checkout@v5

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22.x'
        check-latest: true
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Download dist
      uses: actions/download-artifact@v5
      with:
        name: dist
        path: dist

    - name: Resolve Playwright version
      id: playwright
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

    # QUAL-33: apt is bounded at 120 s, retry 300 s; the browser download is separate.
    - name: Install Playwright system dependencies
      run: bash scripts/ci-bounded-apt.sh 120 300 npx playwright install-deps chromium

    - name: Install Playwright browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium

    - name: Run Playwright e2e tests (export guards)
      run: npx playwright test --project=export-guards

    # Prints the recaptured baseline rather than committing it. Review the
    # decoded file before it lands: a baseline change is a change to what users
    # receive. Moved here from `font-guards` (ARCH-23) alongside the guard
    # that owns the baseline; no shard to gate on any more.
    - name: Recapture exported-PDF render baseline (manual runs only)
      # always(), because a step's `if` otherwise still implies success() and
      # the e2e step above is exactly the one expected to be red when a
      # baseline needs recapturing.
      if: ${{ always() && inputs.update-export-render-baseline }}
      env:
        UPDATE_EXPORT_RENDER_BASELINE: '1'
      run: |
        npx playwright test e2e/export/export-render-guard --reporter=list || true
        echo "BASELINE_GZ_B64_START"
        gzip -9 -c e2e/export/fixtures/exportRenderBaseline.json | base64 -w 3000
        echo "BASELINE_GZ_B64_END"

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: playwright-artifacts-export-guards
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
