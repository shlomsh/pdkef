name: Regenerate export-render-guard baseline (temporary, manual)

on:
  workflow_dispatch: {}
  push:
    branches: [ "claude/fix-e2e-ci-n8gk74" ]

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Regenerate baseline
      run: UPDATE_EXPORT_RENDER_BASELINE=1 npx playwright test e2e/sign/export-render-guard.spec.js

    - name: Upload regenerated baseline
      uses: actions/upload-artifact@v4
      with:
        name: regenerated-export-render-baseline
        path: e2e/sign/fixtures/exportRenderBaseline.json

    # Artifact download goes through Azure Blob Storage, which this session's
    # network policy can't reach - print the file straight into the job log
    # (fetchable via the Actions API) as a fallback retrieval path.
    - name: Print regenerated baseline to log
      run: |
        echo "===BASELINE-START==="
        cat e2e/sign/fixtures/exportRenderBaseline.json
        echo "===BASELINE-END==="
