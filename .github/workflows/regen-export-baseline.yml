name: Regenerate export-render-guard baseline (temporary, manual)

on:
  workflow_dispatch: {}
  push:
    branches: [ "claude/fix-e2e-ci-n8gk74" ]

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Regenerate baseline
      run: UPDATE_EXPORT_RENDER_BASELINE=1 npx playwright test e2e/sign/export-render-guard.spec.js

    # Artifact download goes through Azure Blob Storage, which this session's
    # network policy can't reach, so commit the regenerated file straight to
    # this branch instead - avoids hand-transcribing a ~30KB JSON blob out of
    # a log.
    - name: Commit regenerated baseline
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add e2e/sign/fixtures/exportRenderBaseline.json
        if git diff --cached --quiet; then
          echo "No baseline changes to commit."
        else
          git commit -m "Regenerate export-render-guard baseline on real CI (Linux) Chromium"
          git push origin HEAD:${{ github.ref_name }}
        fi
