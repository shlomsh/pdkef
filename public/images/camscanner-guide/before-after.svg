<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="520" viewBox="0 0 800 520" role="img" aria-labelledby="t d">
  <title id="t">A scanned receipt before and after removing the CamScanner footer</title>
  <desc id="d">On the left, a receipt with the "Scanned with CamScanner" line in its bottom right corner. An arrow points to the same receipt on the right, with the corner clean.</desc>
  <defs>
    <symbol id="receipt" viewBox="0 0 280 400">
      <rect x="2" y="2" width="276" height="396" rx="10" fill="#ffffff" stroke="#9fbfb9" stroke-width="3"/>
      <g stroke-linecap="round" fill="none">
        <path d="M44 50 H236" stroke="#0b4c4c" stroke-width="9" opacity=".78"/>
        <path d="M86 76 H194" stroke="#9fbfb9" stroke-width="6"/>
        <path d="M30 104 H250" stroke="#c9d8d4" stroke-width="3" stroke-dasharray="7 7"/>
        <g stroke="#9fbfb9" stroke-width="6"><path d="M30 134 H128"/><path d="M30 162 H112"/><path d="M30 190 H134"/><path d="M30 218 H100"/></g>
        <g stroke="#0b4c4c" stroke-width="6" opacity=".55"><path d="M204 134 H250"/><path d="M212 162 H250"/><path d="M200 190 H250"/><path d="M214 218 H250"/></g>
        <path d="M30 248 H250" stroke="#c9d8d4" stroke-width="3" stroke-dasharray="7 7"/>
        <path d="M30 278 H108" stroke="#0b4c4c" stroke-width="9" opacity=".8"/>
        <path d="M188 278 H250" stroke="#0b4c4c" stroke-width="9" opacity=".8"/>
      </g>
    </symbol>
    <symbol id="footer" viewBox="0 0 108 44">
      <rect x="1" y="1" width="106" height="42" rx="4" fill="#f3f4f2" stroke="#b9c2bf" stroke-width="2"/>
      <text x="54" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7d8a86">Scanned with</text>
      <text x="54" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#56625f">CamScanner</text>
    </symbol>
  </defs>
  <rect width="800" height="520" rx="28" fill="#eef6f3"/>
  <g transform="rotate(-2 200 250)">
    <use href="#receipt" x="60" y="50" width="280" height="400"/>
    <use href="#footer" x="212" y="390" width="108" height="44"/>
  </g>
  <path d="M352 238 C 380 212, 420 212, 446 238" fill="none" stroke="#007979" stroke-width="5" stroke-linecap="round"/>
  <path d="M432 222 L448 240 L426 246" fill="none" stroke="#007979" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="rotate(2 600 250)">
    <use href="#receipt" x="460" y="50" width="280" height="400"/>
    <circle cx="668" cy="412" r="17" fill="#007979"/>
    <path d="M659 412 L666 419 L678 405" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0b4c4c" text-anchor="middle">
    <text x="200" y="496">Before</text>
    <text x="600" y="496">After</text>
  </g>
</svg>
