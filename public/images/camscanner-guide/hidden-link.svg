<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">The CamScanner footer lifted like a sticker, with a hidden link underneath</title>
  <desc id="d">The footer is peeled up off the corner of the page. Underneath it, a dashed box marks an invisible link to the CamScanner website. Delete removes both.</desc>
  <defs>
    <symbol id="receipt" viewBox="0 0 280 400">
      <rect x="2" y="2" width="276" height="396" rx="10" fill="#ffffff" stroke="#9fbfb9" stroke-width="3"/>
      <g stroke-linecap="round" fill="none">
        <path d="M44 50 H236" stroke="#0b4c4c" stroke-width="9" opacity=".78"/>
        <path d="M86 76 H194" stroke="#9fbfb9" stroke-width="6"/>
        <path d="M30 104 H250" stroke="#c9d8d4" stroke-width="3" stroke-dasharray="7 7"/>
        <g stroke="#9fbfb9" stroke-width="6"><path d="M30 134 H128"/><path d="M30 162 H112"/><path d="M30 190 H134"/><path d="M30 218 H100"/></g>
        <g stroke="#0b4c4c" stroke-width="6" opacity=".55"><path d="M204 134 H250"/><path d="M212 162 H250"/><path d="M200 190 H250"/><path d="M214 218 H250"/></g>
        <path d="M30 248 H250" stroke="#c9d8d4" stroke-width="3" stroke-dasharray="7 7"/>
        <path d="M30 278 H108" stroke="#0b4c4c" stroke-width="9" opacity=".8"/>
        <path d="M188 278 H250" stroke="#0b4c4c" stroke-width="9" opacity=".8"/>
      </g>
    </symbol>
    <symbol id="footer" viewBox="0 0 108 44">
      <rect x="1" y="1" width="106" height="42" rx="4" fill="#f3f4f2" stroke="#b9c2bf" stroke-width="2"/>
      <text x="54" y="18" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#7d8a86">Scanned with</text>
      <text x="54" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#56625f">CamScanner</text>
    </symbol>
  </defs>
  <rect width="800" height="500" rx="28" fill="#eef6f3"/>
  <use href="#receipt" x="50" y="50" width="280" height="400"/>
  <rect x="202" y="388" width="108" height="44" rx="4" fill="#fcf1f3" stroke="#b84c58" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="none" stroke="#b84c58" stroke-width="3.5" stroke-linecap="round">
    <rect x="232" y="404" width="22" height="12" rx="6"/>
    <rect x="248" y="404" width="22" height="12" rx="6"/>
  </g>
  <g transform="translate(296 330) rotate(-18)">
    <rect x="4" y="8" width="118" height="48" rx="5" fill="#0b4c4c" opacity=".12"/>
    <use href="#footer" x="0" y="0" width="118" height="48"/>
  </g>
  <path d="M296 390 C 300 372, 306 362, 318 356" fill="none" stroke="#9fbfb9" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" fill="#0b4c4c">
    <text x="452" y="196" font-size="30" font-weight="700">The footer hides</text>
    <text x="452" y="234" font-size="30" font-weight="700">a link underneath.</text>
    <text x="452" y="292" font-size="24" fill="#b84c58">It opens CamScanner's</text>
    <text x="452" y="322" font-size="24" fill="#b84c58">site when tapped.</text>
    <text x="452" y="382" font-size="26" font-weight="700" fill="#007979">Delete removes both.</text>
  </g>
</svg>
