  <rect width="640" height="640" fill="#eef6f3"/>
  <g transform="translate(117 32) scale(1.45)">
    <use href="#receipt" x="0" y="0" width="280" height="400"/>
    <use href="#footer" x="130" y="326" width="132" height="54"/>
