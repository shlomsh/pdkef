<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan corpus labelling</title>
<style>
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 760px; margin-inline: auto; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 4px 0 12px; color: #555; }
  #stage { position: relative; display: inline-block; touch-action: none; margin: 8px 0; }
  canvas { display: block; max-width: 100%; border: 1px solid #999; cursor: crosshair; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
  label.chip { border: 1px solid #aaa; border-radius: 14px; padding: 3px 10px; cursor: pointer; }
  label.chip:has(input:checked) { background: #222; color: #fff; }
  label.chip input { display: none; }
  input[type=text] { flex: 1; min-width: 220px; padding: 6px; }
  button { padding: 7px 14px; font: inherit; }
  #status { color: #555; }
</style>
</head>
<body>
<h1>Scan corpus labelling</h1>
<p>Pick photos. For each: click the four page corners in order (top left, top right, bottom right, bottom left, as the page reads), or press "No page". Tick what makes it hard, say who took it, save. Everything stays on this computer.</p>

<div class="row"><input type="file" id="pick" accept="image/*" multiple></div>
<div id="status">No photos picked yet.</div>

<div id="work" hidden>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="row">
    <button id="undo">Undo corner</button>
    <button id="nopage">No page in this photo</button>
    <span id="hint"></span>
  </div>
  <div class="row" id="conds"></div>
  <div class="row"><input type="text" id="source" placeholder="Source: who took it, and that we have consent"></div>
  <div class="row">
    <label>Name <input type="text" id="name" size="28"></label>
    <button id="save">Save this photo and go on</button>
    <button id="skip">Skip</button>
  </div>
</div>

<div class="row"><button id="finish" disabled>Download labels.json</button> <span id="count"></span></div>

<script>
(() => {
  const CONDITIONS = ['low-contrast', 'shadow', 'glare', 'dark-print', 'clutter', 'lap', 'curled', 'partly-out', 'hand', 'no-page', 'plain'];
  const LONG_EDGE = 320;
  const $ = (id) => document.getElementById(id);
  const cv = $('cv');
  const ctx = cv.getContext('2d');
  const labels = {};
  let files = [];
  let index = -1;
  let bitmap = null;
  let corners = [];
  let noPage = false;
  let lastSource = '';

  for (const c of CONDITIONS) {
    const l = document.createElement('label');
    l.className = 'chip';
    l.innerHTML = '<input type="checkbox" value="' + c + '"> ' + c;
    $('conds').appendChild(l);
  }
  const checks = () => [...$('conds').querySelectorAll('input')];

  function draw() {
    ctx.drawImage(bitmap, 0, 0, cv.width, cv.height);
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff2d55';
    ctx.fillStyle = '#ff2d55';
    ctx.beginPath();
    corners.forEach(([x, y], i) => (i ? ctx.lineTo(x * cv.width, y * cv.height) : ctx.moveTo(x * cv.width, y * cv.height)));
    if (corners.length === 4) ctx.closePath();
    ctx.stroke();
    corners.forEach(([x, y], i) => {
      ctx.beginPath(); ctx.arc(x * cv.width, y * cv.height, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '12px sans-serif'; ctx.fillText(['TL', 'TR', 'BR', 'BL'][i], x * cv.width + 8, y * cv.height - 8);
      ctx.fillStyle = '#ff2d55';
    });
    $('hint').textContent = noPage ? 'Marked: no page.' : corners.length < 4 ? 'Next corner: ' + ['top left', 'top right', 'bottom right', 'bottom left'][corners.length] : 'Four corners set.';
  }

  async function open(i) {
    index = i;
    if (index >= files.length) {
      $('work').hidden = true;
      $('status').textContent = 'All photos done. Download labels.json.';
      return;
    }
    const f = files[index];
    // Respect EXIF orientation so the photo is upright, as the app hands it to the detector.
    bitmap = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const s = LONG_EDGE / Math.max(bitmap.width, bitmap.height);
    // Work at 2x the saved size on screen so corners are easy to hit; saved normalized, so size does not matter.
    cv.width = Math.round(bitmap.width * s * 2);
    cv.height = Math.round(bitmap.height * s * 2);
    corners = []; noPage = false;
    checks().forEach((c) => (c.checked = false));
    $('source').value = lastSource;
    $('name').value = f.name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'photo-' + index;
    $('work').hidden = false;
    $('status').textContent = 'Photo ' + (index + 1) + ' of ' + files.length + ': ' + f.name;
    draw();
  }

  cv.addEventListener('pointerdown', (e) => {
    if (noPage || corners.length >= 4) return;
    const r = cv.getBoundingClientRect();
    corners.push([Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]);
    draw();
  });
  $('undo').onclick = () => { corners.pop(); noPage = false; draw(); };
  $('nopage').onclick = () => { noPage = true; corners = []; checks().forEach((c) => { if (c.value === 'no-page') c.checked = true; }); draw(); };

  function download(name, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function gray320() {
    const s = LONG_EDGE / Math.max(bitmap.width, bitmap.height);
    const w = Math.max(1, Math.round(bitmap.width * s));
    const h = Math.max(1, Math.round(bitmap.height * s));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(bitmap, 0, 0, w, h);
    const rgba = g.getImageData(0, 0, w, h).data;
    const head = new TextEncoder().encode('P5\n' + w + ' ' + h + '\n255\n');
    const out = new Uint8Array(head.length + w * h);
    out.set(head, 0);
    for (let i = 0; i < w * h; i += 1) out[head.length + i] = Math.round(0.299 * rgba[i * 4] + 0.587 * rgba[i * 4 + 1] + 0.114 * rgba[i * 4 + 2]);
    return out;
  }

  $('save').onclick = () => {
    const name = $('name').value.trim();
    const source = $('source').value.trim();
    const conditions = checks().filter((c) => c.checked).map((c) => c.value);
    if (!noPage && corners.length !== 4) return alert('Click four corners, or press "No page".');
    if (!name) return alert('Give it a name.');
    if (labels[name]) return alert('That name is already used in this session.');
    if (!source) return alert('Say who took it, and that we have consent.');
    if (noPage && !conditions.includes('no-page')) conditions.push('no-page');
    if (!noPage && conditions.includes('no-page')) return alert('"no-page" is only for photos with no page. Untick it or press "No page".');
    labels[name] = { corners: noPage ? null : corners.map(([x, y]) => [+x.toFixed(4), +y.toFixed(4)]), conditions, source };
    download(name + '.pgm', new Blob([gray320()], { type: 'application/octet-stream' }));
    lastSource = source;
    $('count').textContent = Object.keys(labels).length + ' labelled';
    $('finish').disabled = false;
    open(index + 1);
  };
  $('skip').onclick = () => open(index + 1);
  $('pick').onchange = (e) => { files = [...e.target.files]; open(0); };
  $('finish').onclick = () => {
    // One block per photo; paste the entries into src/tools/scan/lib/edges/real/labels.json.
    download('labels.json', new Blob([JSON.stringify(labels, null, 2) + '\n'], { type: 'application/json' }));
  };
})();
</script>
</body>
</html>
